        <div class="page-head"><h1>Database</h1><p>Browse and edit tables directly. The SQL console can run anything the database allows — no undo.</p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>

        <div class="btn-group mb-3" role="group" aria-label="Database view">
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'tables'}" @click="tab = 'tables'">Tables</button>
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'table'}" x-show="selectedTable" @click="tab = 'table'" x-text="selectedTable"></button>
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'console'}" x-show="can('dbms.query')" @click="openConsole()">SQL console</button>
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'move'}" x-show="can('dbms.migrate')" @click="tab = 'move'">Copy database</button>
        </div>

        <template x-if="tab === 'tables'">
          <div>
            <div class="d-flex justify-content-end mb-2" x-show="can('dbms.write')">
              <button type="button" class="btn btn-outline-secondary btn-sm" @click="showCreateForm = !showCreateForm" x-text="showCreateForm ? 'Cancel' : 'New table'"></button>
            </div>
            <div class="panel p-3 mb-3" x-show="showCreateForm">
              <div class="row g-2">
                <div class="col-md-6"><label class="form-label" for="nt-name">Table name</label><input id="nt-name" class="form-control mono" x-model="newTable.name"></div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3 mb-2"><label class="form-label mb-0">Columns</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addColumn()">Add column</button></div>
              <template x-for="(c, i) in newTable.columns" :key="i">
                <div class="row g-2 mb-2 align-items-center">
                  <div class="col-6 col-md-3"><input class="form-control form-control-sm mono" aria-label="Column name" placeholder="name" x-model="c.name"></div>
                  <div class="col-6 col-md-2"><select class="form-select form-select-sm" aria-label="Column type" x-model="c.type"><option value="string">Short text</option><option value="text">Long text</option><option value="integer">Whole number</option><option value="bigInteger">Big whole number</option><option value="boolean">On/off</option><option value="float">Decimal</option><option value="json">JSON (text)</option></select></div>
                  <div class="col-6 col-md-2 form-check"><input class="form-check-input" type="checkbox" :id="'pk-' + i" x-model="c.primaryKey"><label class="form-check-label small" :for="'pk-' + i">Primary key</label></div>
                  <div class="col-6 col-md-2 form-check" x-show="c.primaryKey"><input class="form-check-input" type="checkbox" :id="'ai-' + i" x-model="c.autoIncrement"><label class="form-check-label small" :for="'ai-' + i">Auto-increment</label></div>
                  <div class="col-6 col-md-2"><input class="form-control form-control-sm" aria-label="Default value" placeholder="Default" x-model="c.default" x-show="!(c.primaryKey && c.autoIncrement)"></div>
                  <div class="col-6 col-md-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeColumn(i)" aria-label="Remove column">×</button></div>
                </div>
              </template>
              <div class="help small muted mt-1">No date/time type on purpose — this platform stores every timestamp as milliseconds in a big whole number.</div>
              <button type="button" class="btn btn-primary mt-2" :disabled="busy || !newTable.name || !newTable.columns.length" @click="createTable()">Create table</button>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2 mb-2" x-show="tables.length">
              <a class="btn btn-outline-secondary btn-sm" data-export :href="selected.length ? exportUrl() : null" :class="{disabled: !selected.length}" :aria-disabled="!selected.length" x-text="'Export selected' + (selected.length ? ' (' + selected.length + ')' : '')"></a>
              <div class="form-check mb-0"><input class="form-check-input" type="checkbox" id="exp-data" x-model="withRecords"><label class="form-check-label small" for="exp-data">Include records</label></div>
              <span class="btn-group btn-group-sm" role="group" aria-label="Maintenance for the ticked tables" x-show="can('dbms.write')">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-optimize-selected :disabled="busy || !selected.length" @click="maintainSelected('optimize')" x-text="'Optimise selected' + (selected.length ? ' (' + selected.length + ')' : '')"></button>
                <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="busy || !selected.length" @click="maintainSelected('analyze')">Analyse</button>
              </span>
              <label class="btn btn-outline-secondary btn-sm mb-0 ms-auto" x-show="can('dbms.write')" :class="{disabled: busy}">Import<input type="file" hidden accept=".zip,application/zip" data-import @change="pickImport($event)"></label>
            </div>
            <div class="small muted mb-2" x-show="tables.length">Export makes a .zip of the chosen tables (structure, and records if ticked; passwords and keys are left out). Import reads such a file and only adds: missing tables, columns and records. Nothing is deleted or replaced.</div>
            <div class="alert alert-success" role="status" x-show="importMsg" x-text="importMsg"></div>

            <div class="panel p-3 mb-3" x-show="importPlan" data-import-plan>
              <div class="fw-semibold mb-1">Import from <span class="mono" x-text="importFile ? importFile.name : ''"></span></div>
              <div class="alert alert-danger" x-show="importPlan && importPlan.blockers.length" x-text="importPlan ? importPlan.blockers.join(' ') : ''"></div>
              <table class="table table-sm mb-2"><tbody>
                <template x-for="p in (importPlan ? importPlan.tables : [])" :key="p.table">
                  <tr>
                    <td style="width:2rem"><input class="form-check-input" type="checkbox" :aria-label="'Import ' + p.table" :value="p.table" x-model="importPick" :disabled="!!p.blocked"></td>
                    <td class="mono" x-text="p.table"></td>
                    <td class="small muted" x-text="importLine(p)"></td>
                  </tr>
                </template>
              </tbody></table>
              <ul class="small muted mb-2"><template x-for="w in (importPlan ? importPlan.warnings : [])" :key="w"><li x-text="w"></li></template></ul>
              <button type="button" class="btn btn-primary btn-sm" :disabled="busy || !importPick.length || (importPlan && importPlan.blockers.length > 0)" @click="runImport()">Import selected</button>
              <button type="button" class="btn btn-outline-secondary btn-sm ms-1" @click="cancelImport()">Cancel</button>
            </div>

            <div class="panel">
              <div class="empty" x-show="loaded && !tables.length">No tables.</div>
              <div class="px-3 py-2 small muted border-bottom" x-show="tables.length" data-list-summary x-text="listSummary()"></div>
              <div class="table-responsive" x-show="tables.length">
                <table class="table table-hover align-middle mb-0" data-tables><thead><tr>
                  <th style="width:2rem"><input class="form-check-input" type="checkbox" aria-label="Select all tables" :checked="selected.length > 0 && selected.length === tables.filter(t => !t.view).length" @change="toggleAll($event.target.checked)"></th>
                  <th>Name</th><th>Type</th><th>Engine</th><th class="text-end">Records</th><th class="text-end">Size</th><th class="text-end" x-show="can('dbms.write')">Maintenance</th>
                </tr></thead><tbody>
                  <template x-for="t in tables" :key="t.name"><tr>
                    <td><input class="form-check-input" type="checkbox" :aria-label="'Select ' + t.name" :value="t.name" x-model="selected" x-show="!t.view"></td>
                    <td class="mono"><a href="#" @click.prevent="openTable(t.name)" x-text="t.name"></a></td>
                    <td class="small"><span class="tag" :class="t.view ? '' : 'ok'" x-text="t.view ? 'View' : 'Table'"></span></td>
                    <td class="small muted" x-text="t.engine || '–'"></td>
                    <td class="small text-end text-nowrap" x-text="t.rows === null ? '–' : (t.approx ? '~' : '') + t.rows.toLocaleString()"></td>
                    <td class="small text-end text-nowrap" x-text="t.bytes === null ? '–' : fmtBytes(t.bytes)"></td>
                    <td class="text-end text-nowrap" x-show="can('dbms.write')">
                      <span class="btn-group btn-group-sm" role="group" :aria-label="'Maintenance for ' + t.name" x-show="!t.view">
                        <button class="btn btn-sm btn-outline-secondary" type="button" data-optimize :disabled="busy || !!working[t.name]" @click="maintain(t.name, 'optimize')">Optimise</button>
                        <button class="btn btn-sm btn-outline-secondary" type="button" data-analyze :disabled="busy || !!working[t.name]" @click="maintain(t.name, 'analyze')">Analyse</button>
                      </span>
                    </td>
                  </tr></template>
                </tbody></table>
              </div>
            </div>
          </div>
        </template>

        <template x-if="tab === 'table' && tableInfo">
          <div>
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <h2 class="h5 mono mb-0" x-text="selectedTable"></h2>
              <span class="tag" :class="meta && meta.view ? '' : 'ok'" x-text="meta && meta.view ? 'View' : 'Table'"></span>
              <span class="small muted" x-text="metaLine()"></span>
              <span class="ms-auto small"><a data-export-table :href="exportUrl([selectedTable])">Export this table</a> · <a :href="exportUrl([selectedTable], false)">structure only</a></span>
            </div>
            <div class="alert alert-warning" role="alert" x-show="tableInfo.sensitive">This table is only editable through the SQL console.</div>

            <ul class="nav nav-tabs mb-3" role="tablist" aria-label="Table views" data-table-tabs>
              <li class="nav-item"><button type="button" class="nav-link" :class="{active: tableTab === 'structure'}" role="tab" :aria-selected="tableTab === 'structure'" data-tab="structure" @click="tableTab = 'structure'">Structure</button></li>
              <li class="nav-item"><button type="button" class="nav-link" :class="{active: tableTab === 'data'}" role="tab" :aria-selected="tableTab === 'data'" data-tab="data" @click="tableTab = 'data'">Data <span class="badge text-bg-light" x-text="rowsTotal.toLocaleString()"></span></button></li>
              <li class="nav-item"><button type="button" class="nav-link" :class="{active: tableTab === 'editor'}" role="tab" :aria-selected="tableTab === 'editor'" data-tab="editor" @click="tableTab = 'editor'">Editor<span class="small muted" x-show="editorMode" x-text="' · ' + ({ new: 'new record', edit: 'editing', view: 'viewing' })[editorMode]"></span></button></li>
            </ul>

            <div x-show="tableTab === 'structure'" data-pane="structure">
              <div class="panel mb-3">
                <div class="table-responsive">
                  <table class="table mb-0"><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th><th></th></tr></thead><tbody>
                    <template x-for="c in tableInfo.columns" :key="c.name"><tr>
                      <td class="mono small" x-text="c.name"></td>
                      <td class="muted small" x-text="c.type"></td>
                      <td class="muted small" x-text="c.nullable ? 'Yes' : 'No'"></td>
                      <td class="muted small" x-text="c.default ?? '–'"></td>
                      <td><span class="tag ok" x-show="c.primaryKey">Primary key</span> <span class="tag" x-show="c.autoIncrement">Auto-increment</span></td>
                    </tr></template>
                  </tbody></table>
                </div>
              </div>
              <div class="panel" x-show="tableInfo.indexes.length">
                <div class="panel-h">Indexes</div>
                <div class="table-responsive">
                  <table class="table mb-0"><thead><tr><th>Name</th><th>Columns</th><th>Unique</th></tr></thead><tbody>
                    <template x-for="idx in tableInfo.indexes" :key="idx.name"><tr>
                      <td class="mono small" x-text="idx.name"></td>
                      <td class="mono small" x-text="idx.columns.join(', ')"></td>
                      <td class="small" x-text="idx.unique ? 'Yes' : 'No'"></td>
                    </tr></template>
                  </tbody></table>
                </div>
              </div>
            </div>

            <div x-show="tableTab === 'data'" data-pane="data">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="muted small" x-text="rowsTotal.toLocaleString() + ' record' + (rowsTotal === 1 ? '' : 's')"></span>
                <button class="btn btn-sm btn-primary" type="button" data-new-record x-show="canEdit()" @click="startNewRow()">Add record</button>
              </div>
              <div class="panel">
                <div class="empty" x-show="!rows.length">No records.</div>
                <div class="table-responsive" x-show="rows.length">
                  <table class="table table-hover align-middle mb-0" data-rows><thead><tr>
                    <template x-for="c in tableInfo.columns" :key="c.name"><th><a href="#" @click.prevent="sortBy(c.name)" x-text="c.name + (sortCol === c.name ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '')"></a></th></template>
                    <th></th>
                  </tr></thead><tbody>
                    <template x-for="(row, i) in rows" :key="i"><tr>
                      <template x-for="c in tableInfo.columns" :key="c.name"><td class="small" x-text="show(row[c.name])"></td></template>
                      <td class="text-end text-nowrap">
                        <span class="btn-group btn-group-sm" role="group" aria-label="Record actions">
                          <button class="btn btn-sm btn-outline-secondary" type="button" data-view-row @click="viewRow(row)">View</button>
                          <button class="btn btn-sm btn-outline-secondary" type="button" data-edit-row x-show="canEdit()" @click="startEditRow(row)">Edit</button>
                          <button class="btn btn-sm btn-outline-danger" type="button" data-delete-row x-show="canEdit()" @click="deleteRow(row)">Delete</button>
                        </span>
                      </td>
                    </tr></template>
                  </tbody></table>
                </div>
                <div class="d-flex justify-content-between align-items-center p-2" x-show="rowsPages > 1">
                  <button class="btn btn-sm btn-outline-secondary" type="button" :disabled="rowsPage <= 1" @click="changePage(rowsPage - 1)">Newer</button>
                  <span class="muted small" x-text="'Page ' + rowsPage + ' of ' + rowsPages"></span>
                  <button class="btn btn-sm btn-outline-secondary" type="button" :disabled="rowsPage >= rowsPages" @click="changePage(rowsPage + 1)">Older</button>
                </div>
              </div>
            </div>

            <div x-show="tableTab === 'editor'" data-pane="editor">
              <div class="panel p-4 text-center" x-show="!editorMode" data-editor-empty>
                <p class="muted mb-3">Choose a record in <strong>Data</strong> to look at or change it, or start a new one.</p>
                <button class="btn btn-primary btn-sm" type="button" x-show="canEdit()" @click="startNewRow()">New record</button>
                <button class="btn btn-outline-secondary btn-sm" type="button" @click="tableTab = 'data'">Go to Data</button>
              </div>
              <div class="panel p-3" x-show="editorMode" data-editor>
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                  <h3 class="h6 mb-0" x-text="editorTitle()"></h3>
                  <span class="ms-auto d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" type="button" x-show="editorMode === 'view' && canEdit()" data-editor-edit @click="startEditRow(editorRow)">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" type="button" x-show="editorMode === 'view' && canEdit()" @click="deleteRow(editorRow)">Delete</button>
                  </span>
                </div>
                <div class="row g-3">
                  <template x-for="c in tableInfo.columns" :key="c.name">
                    <div :class="longField(c) ? 'col-12' : 'col-md-6'" x-show="!(editorMode === 'new' && c.primaryKey && c.autoIncrement)">
                      <label class="form-label small mb-1" :for="'ed-' + c.name"><span class="mono" x-text="c.name"></span> <span class="muted" x-text="c.type"></span> <span class="tag ok" x-show="c.primaryKey">Primary key</span><span class="muted" x-show="c.nullable && !c.primaryKey"> · optional</span></label>
                      <template x-if="/bool/i.test(c.type)"><div class="form-check"><input class="form-check-input" type="checkbox" :id="'ed-' + c.name" x-model="editForm[c.name]" :disabled="!editable(c)"></div></template>
                      <template x-if="!/bool/i.test(c.type) && longField(c)"><textarea class="form-control form-control-sm mono" rows="5" :id="'ed-' + c.name" x-model="editForm[c.name]" :readonly="!editable(c)" :placeholder="editorMode === 'view' && editForm[c.name] === null ? 'NULL' : ''"></textarea></template>
                      <template x-if="!/bool/i.test(c.type) && !longField(c)"><input class="form-control form-control-sm" :id="'ed-' + c.name" x-model="editForm[c.name]" :readonly="!editable(c)" :placeholder="editorMode === 'view' && editForm[c.name] === null ? 'NULL' : ''"></template>
                    </div>
                  </template>
                </div>
                <div class="d-flex gap-2 mt-3" x-show="editorMode === 'new' || editorMode === 'edit'">
                  <button class="btn btn-primary btn-sm" type="button" data-editor-save :disabled="busy" @click="saveRow()">Save</button>
                  <button class="btn btn-outline-secondary btn-sm" type="button" data-editor-cancel @click="cancelEdit()">Cancel</button>
                </div>
                <div class="d-flex gap-2 mt-3" x-show="editorMode === 'view'">
                  <button class="btn btn-outline-secondary btn-sm" type="button" @click="closeEditor()">Back to data</button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <template x-if="tab === 'console'">
          <div class="row g-3">
            <div class="col-lg-8">
              <label class="form-label" for="dbms-sql">SQL</label>
              <textarea id="dbms-sql" class="form-control mono" rows="8" spellcheck="false" x-codejar="{ mode: 'text/x-sql', get: sql, set: (v) => (sql = v) }"></textarea>
              <div class="d-flex gap-2 align-items-center mt-2">
                <button class="btn btn-primary" type="button" :disabled="consoleBusy || !sql.trim()" @click="runQuery()">Run</button>
                <input class="form-control form-control-sm" style="max-width:16rem" aria-label="Name this query to save it" placeholder="Save as…" x-model="newQueryName" @keydown.enter.prevent="saveCurrentQuery()">
                <button class="btn btn-outline-secondary btn-sm" type="button" @click="saveCurrentQuery()">Save query</button>
              </div>
              <div class="alert alert-danger mt-2" role="alert" x-show="consoleError" x-text="consoleError"></div>
              <template x-if="consoleResult">
                <div class="panel mt-3">
                  <div class="panel-h" x-text="consoleResult.rows.length ? consoleResult.rowCount + ' row(s)' : consoleResult.rowCount + ' row(s) affected'"></div>
                  <div class="table-responsive" x-show="consoleResult.rows.length">
                    <table class="table mb-0"><thead><tr><template x-for="k in Object.keys(consoleResult.rows[0] || {})" :key="k"><th x-text="k"></th></template></tr></thead><tbody>
                      <template x-for="(row, i) in consoleResult.rows" :key="i"><tr><template x-for="k in Object.keys(consoleResult.rows[0] || {})" :key="k"><td class="small" x-text="show(row[k])"></td></template></tr></template>
                    </tbody></table>
                  </div>
                </div>
              </template>
            </div>
            <div class="col-lg-4">
              <div class="panel">
                <div class="panel-h">Saved queries</div>
                <div class="empty small" x-show="!savedQueries.length">None yet.</div>
                <template x-for="q in savedQueries" :key="q.id">
                  <div class="frow frow-split">
                    <div><a href="#" @click.prevent="loadSavedQuery(q)" x-text="q.name"></a></div>
                    <div><button class="btn btn-sm btn-outline-danger" type="button" @click="deleteSavedQuery(q)" aria-label="Delete saved query">×</button></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <template x-if="tab === 'move'">
          <div x-data="dbMovePanel" class="row g-3">
            <div class="col-lg-8">
              <div class="panel p-3 mb-3">
                <h2 class="h5">Copy to another database</h2>
                <p class="small muted mb-2">
                  Copies everything — content, users, settings, media records, logs — from the database this server uses now
                  (<strong x-text="sourceKindLabel"></strong>) into a new, <strong>empty</strong> database on MySQL or PostgreSQL.
                  Nothing is changed here until you press Switch, and nothing in the new database is ever overwritten.
                </p>
                <ol class="small muted ps-3 mb-0">
                  <li>Create an empty database and a user for it on the new server.</li>
                  <li>Put the site in maintenance mode (Settings → General) so nothing changes while it copies.</li>
                  <li>Enter the connection string below, test it, then copy.</li>
                  <li>When the checks pass, switch this server over. Do the same on every other server.</li>
                </ol>
              </div>

              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>

              <div class="panel p-3 mb-3">
                <label class="form-label" for="mv-url">New database connection string</label>
                <div class="input-group">
                  <input id="mv-url" class="form-control mono" :type="showUrl ? 'text' : 'password'" name="new-database-connection-string" autocomplete="off" spellcheck="false"
                         placeholder="mysql://user:password@host:3306/dbname" x-model="url" :disabled="running">
                  <button type="button" class="btn btn-outline-secondary" @click="showUrl = !showUrl" :aria-pressed="!showUrl" x-text="showUrl ? 'Hide' : 'Show'"></button>
                </div>
                <div class="help small muted mt-1">mysql://user:password@host:3306/dbname or postgres://user:password@host:5432/dbname. It is used for this copy only and is not saved.</div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                  <button type="button" class="btn btn-outline-secondary" :disabled="busy || running || !url.trim()" @click="test()">Test connection</button>
                  <button type="button" class="btn btn-primary" :disabled="busy || running || !url.trim() || (tested && !tested.empty)" @click="start()">Copy data</button>
                </div>
                <div class="small mt-2" x-show="tested">
                  <span x-show="tested && tested.empty" class="text-success">Connected to <span class="mono" x-text="tested && tested.target"></span>. It is empty and ready.</span>
                  <span x-show="tested && !tested.empty" class="text-danger">Connected, but this database already has <span x-text="tested && tested.existingTables"></span> table(s). Use a new, empty one.</span>
                </div>
              </div>

              <div class="panel p-3 mb-3" x-show="st.state && st.state !== 'idle'">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <strong x-text="headline"></strong>
                  <div class="d-flex gap-2" x-show="st.state === 'failed' || st.state === 'ready'">
                    <button type="button" class="btn btn-sm btn-primary" x-show="st.resumable" :disabled="busy || !url.trim()" @click="start(true)">Resume</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="busy" @click="clear()">Start over</button>
                  </div>
                </div>
                <div class="progress mb-2" role="progressbar" aria-label="Copy progress" x-show="running"><div class="progress-bar" :style="'width:' + percent + '%'"></div></div>
                <div class="small muted" x-show="st.step" x-text="st.step + (running ? ' — ' + rowsDone.toLocaleString() + ' of ' + rowsTotal.toLocaleString() + ' rows' : '')"></div>
                <div class="small muted" x-show="st.resumable && !url.trim()">Enter the connection string above to resume or to clear the new database.</div>
                <div class="alert alert-danger mt-2 mb-0" role="alert" x-show="st.error" x-text="st.error"></div>
                <div class="small mt-2" x-show="st.extraTables && st.extraTables.length">
                  Tables made in the SQL console were recreated by shape (their columns and plain indexes):
                  <span class="mono" x-text="(st.extraTables || []).join(', ')"></span>.
                </div>
                <div class="table-responsive mt-2" x-show="(st.tables || []).some(t => t.source > 0)">
                  <table class="table table-sm mb-0"><thead><tr><th>Table</th><th class="text-end">Rows here</th><th class="text-end">Copied</th></tr></thead><tbody>
                    <template x-for="t in (st.tables || []).filter(t => t.source > 0)" :key="t.name"><tr>
                      <td class="mono" x-text="t.name"></td><td class="text-end" x-text="t.source"></td>
                      <td class="text-end" x-text="t.done ? t.copied : (t.copied ? t.copied + '…' : '…')"></td>
                    </tr></template>
                  </tbody></table>
                </div>
                <div class="mt-3" x-show="(st.objects || []).some(o => o.status !== 'exists')">
                  <div class="small"><strong>Views, triggers, functions and extra indexes</strong></div>
                  <div class="small muted mb-1" x-show="skipped.length">Some could not be created on the new database engine. Their original SQL is shown so you can port them by hand.</div>
                  <template x-for="o in (st.objects || []).filter(o => o.status !== 'exists')" :key="o.kind + o.name + (o.table || '')">
                    <div class="small mb-1">
                      <span class="badge" :class="o.status === 'created' ? 'text-bg-success' : 'text-bg-warning'" x-text="o.status === 'created' ? 'Copied' : 'Not copied'"></span>
                      <span x-text="o.kind"></span> <span class="mono" x-text="o.name"></span><span class="muted" x-show="o.table" x-text="' on ' + o.table"></span>
                      <div class="muted" x-show="o.reason" x-text="o.reason"></div>
                      <pre class="mono small mb-0 p-2 border rounded" style="white-space:pre-wrap" x-show="o.sql" x-text="o.sql"></pre>
                    </div>
                  </template>
                </div>
                <div class="mt-2 small text-danger" x-show="st.mismatches && st.mismatches.length">
                  Different row counts after the copy:
                  <template x-for="m in st.mismatches" :key="m.name"><div class="mono" x-text="m.name + ': ' + m.source + ' here, ' + m.target + ' there'"></div></template>
                </div>
              </div>

              <div class="panel p-3" x-show="st.state === 'ready'">
                <h2 class="h5">Switch this server</h2>
                <p class="small muted">
                  The copy matches row for row. Switching rewrites <span class="mono">DB_URL</span> in this server's <span class="mono">.env</span>
                  (a dated backup is kept) and takes effect when it restarts. The old database is left untouched, so you can switch back.
                </p>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="mv-restart" x-model="restart">
                  <label class="form-check-label" for="mv-restart">Restart this server now</label>
                </div>
                <button type="button" class="btn btn-danger" :disabled="busy || st.switched || !url.trim()" @click="switchNow()">Switch to the new database</button>
                <div class="small muted mt-2" x-show="!url.trim()">Enter the connection string above again to confirm which database to switch to.</div>
                <div class="alert alert-success mt-3 mb-0" x-show="switched">
                  <div x-text="switched && switched.message"></div>
                  <div class="small mt-2">On every other server, set this and restart it: <span class="mono" x-text="switched && switched.otherServers"></span> (with the real password).</div>
                </div>
              </div>
            </div>
          </div>
        </template>
