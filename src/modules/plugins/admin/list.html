              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Plugin Manager</h1><p>Installed plugins. A plugin's server code runs with full access to this server — only install ones you trust.</p></div>
                <div class="d-flex gap-2">
                  <a class="btn btn-outline-primary" x-show="can('plugins.manage')" href="#/pluginEditor">✨ Plugin Editor</a>
                  <button class="btn btn-outline-secondary" type="button" x-show="can('plugins.manage')" :class="{disabled: busy}" @click="rescan()">Rescan plugins/</button>
                  <label class="btn btn-primary mb-0" x-show="can('plugins.manage')" :class="{disabled: busy}">Install from .zip<input type="file" hidden accept=".zip,application/zip" @change="upload($event.target.files[0]); $event.target.value = ''"></label>
                </div>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="panel">
                <div class="empty" x-show="loaded && !plugins.length">No plugins installed yet.</div>
                <table class="table" x-show="plugins.length"><thead><tr><th>Name</th><th>Version</th><th>Source</th><th>Status</th><th></th></tr></thead><tbody>
                  <template x-for="p in plugins" :key="p.slug"><tr>
                    <td><div x-text="p.name"></div><div class="small muted" x-text="p.description"></div></td>
                    <td class="mono small" x-text="p.version"></td>
                    <td><span class="tag" x-text="p.source === 'disk' ? 'plugins/' + p.slug : 'Uploaded'"></span></td>
                    <td>
                      <span class="tag" :class="p.enabled ? 'ok' : 'warn'" x-text="p.enabled ? 'Enabled' : 'Disabled'"></span>
                      <span class="tag" x-show="p.enabled && !p.loaded" title="Enabled but not yet loaded on this server">Loading…</span>
                    </td>
                    <td class="text-end text-nowrap">
                      <button class="btn btn-sm btn-outline-secondary" type="button" x-show="can('plugins.manage')" @click="editWithAi(p)">Edit with AI</button>
                      <button class="btn btn-sm btn-outline-secondary" type="button" x-show="can('plugins.manage') && p.hasConfig" :class="{active: configSlug === p.slug}" @click="toggleConfig(p)">Configure</button>
                      <button class="btn btn-sm btn-outline-secondary" type="button" x-show="can('plugins.manage')" @click="toggle(p)" x-text="p.enabled ? 'Disable' : 'Enable'"></button>
                      <a class="btn btn-sm btn-outline-secondary" x-show="can('plugins.read')" :href="exportUrl(p)">Export</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('plugins.manage') && p.source === 'db'" :disabled="p.enabled" :title="p.enabled ? 'Disable it first' : ''" @click="remove(p)">Remove</button>
                    </td>
                  </tr></template>
                </tbody></table>
              </div>
              <template x-if="configPlugin">
                <div class="panel mt-3">
                  <div class="page-head"><h2 class="h5 mb-0" x-text="configPlugin.name + ' settings'"></h2></div>
                  <div class="alert alert-danger" role="alert" x-show="configError" x-text="configError"></div>
                  <template x-for="f in configFields" :key="f.key">
                    <div class="mb-3">
                      <label class="form-label" :for="'pc_' + f.key" x-text="f.label"></label>
                      <template x-if="f.type === 'string'"><input :id="'pc_' + f.key" class="form-control" :value="configValues[f.key]" @input="configValues[f.key] = $event.target.value"></template>
                      <template x-if="f.type === 'text'"><textarea :id="'pc_' + f.key" rows="3" class="form-control" :value="configValues[f.key]" @input="configValues[f.key] = $event.target.value"></textarea></template>
                      <template x-if="f.type === 'number'"><input :id="'pc_' + f.key" type="number" class="form-control" style="max-width:10rem" :value="configValues[f.key]" :min="f.min" :max="f.max" @input="configValues[f.key] = $event.target.value === '' ? '' : Number($event.target.value)"></template>
                      <template x-if="f.type === 'boolean'"><div class="form-check form-switch"><input :id="'pc_' + f.key" type="checkbox" class="form-check-input" role="switch" :checked="configValues[f.key]" @change="configValues[f.key] = $event.target.checked"><label class="form-check-label muted" :for="'pc_' + f.key" x-text="configValues[f.key] ? 'On' : 'Off'"></label></div></template>
                      <template x-if="f.type === 'select'"><select :id="'pc_' + f.key" class="form-select" @change="configValues[f.key] = $event.target.value"><template x-for="o in f.options" :key="o.value"><option :value="o.value" :selected="o.value === configValues[f.key]" x-text="o.label"></option></template></select></template>
                      <div class="small muted" x-show="f.help" x-text="f.help"></div>
                    </div>
                  </template>
                  <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="button" :disabled="configBusy" @click="saveConfig(configPlugin)">Save settings</button>
                    <button class="btn btn-outline-secondary" type="button" @click="configSlug = null">Cancel</button>
                  </div>
                </div>
              </template>
