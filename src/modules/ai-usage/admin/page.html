        <div class="page-head"><h1 x-text="kind === 'media' ? 'Media usage' : 'Text usage'"></h1><p x-text="kind === 'media' ? 'Images generated by each provider and model.' : 'Calls to text models, with tokens, by model and feature.'"></p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="ai-from">From</label><input id="ai-from" type="date" class="form-control form-control-sm" x-model="from" @change="load()"></div>
          <div><label class="form-label small" for="ai-to">To</label><input id="ai-to" type="date" class="form-control form-control-sm" x-model="to" @change="load()"></div>
          <div x-show="kind === 'media'"><label class="form-label small" for="ai-prov">Provider</label><select id="ai-prov" class="form-select form-select-sm" x-model="provider" @change="load()"><option value="">All</option><option value="openai">OpenAI</option><option value="google">Google</option><option value="stability">Stability AI</option></select></div>
        </div>
        <div class="row g-2 mb-3" x-show="s">
          <div class="col-6 col-lg-3"><div class="panel p-3"><div class="muted small">Calls</div><div class="bigver" x-text="s ? n(s.total.calls) : '–'"></div></div></div>
          <div class="col-6 col-lg-3" x-show="kind === 'text'"><div class="panel p-3"><div class="muted small">Input tokens</div><div class="bigver" x-text="s ? n(s.total.input) : '–'"></div></div></div>
          <div class="col-6 col-lg-3" x-show="kind === 'text'"><div class="panel p-3"><div class="muted small">Output tokens</div><div class="bigver" x-text="s ? n(s.total.output) : '–'"></div></div></div>
          <div class="col-6 col-lg-3"><div class="panel p-3"><div class="muted small" x-text="kind === 'media' ? 'Images · failed calls' : 'Failed calls'"></div><div class="bigver" x-text="s ? (kind === 'media' ? n(s.total.units) + ' · ' : '') + n(s.total.failed) : '–'"></div></div></div>
        </div>
        <div class="row g-3 mb-3" x-show="s">
          <div class="col-lg-7"><div class="panel">
            <div class="panel-h">By provider and model</div>
            <div class="empty" x-show="s && !s.byModel.length">No AI calls in this range yet.</div>
            <table class="table table-sm mb-0" x-show="s && s.byModel.length"><thead><tr><th>Provider</th><th>Model</th><th class="text-end">Calls</th><th class="text-end" x-show="kind === 'text'">Input</th><th class="text-end" x-show="kind === 'text'">Output</th><th class="text-end" x-show="kind === 'media'">Images</th></tr></thead><tbody>
              <template x-for="m in (s ? s.byModel : [])" :key="m.provider + '/' + m.model"><tr><td x-text="m.provider"></td><td class="mono small" x-text="m.model || '–'"></td><td class="text-end" x-text="n(m.calls)"></td><td class="text-end" x-show="kind === 'text'" x-text="n(m.input)"></td><td class="text-end" x-show="kind === 'text'" x-text="n(m.output)"></td><td class="text-end" x-show="kind === 'media'" x-text="n(m.units)"></td></tr></template>
            </tbody></table>
          </div></div>
          <div class="col-lg-5"><div class="panel">
            <div class="panel-h">By feature</div>
            <div class="empty" x-show="s && !s.byFeature.length">Nothing yet.</div>
            <table class="table table-sm mb-0" x-show="s && s.byFeature.length"><thead><tr><th>Feature</th><th class="text-end">Calls</th><th class="text-end">Tokens</th></tr></thead><tbody>
              <template x-for="f in (s ? s.byFeature : [])" :key="f.feature"><tr><td x-text="f.feature"></td><td class="text-end" x-text="n(f.calls)"></td><td class="text-end" x-text="n(f.input + f.output)"></td></tr></template>
            </tbody></table>
          </div></div>
        </div>
        <div class="panel">
          <div class="panel-h">Recent calls</div>
          <div class="empty" x-show="!calls.length">No AI calls in this range yet.</div>
          <table class="table table-sm mb-0" x-show="calls.length"><thead><tr><th>When</th><th>Provider · model</th><th>Feature</th><th>User</th><th class="text-end">Usage</th><th>Result</th></tr></thead><tbody>
            <template x-for="c in calls" :key="c.id"><tr>
              <td class="muted text-nowrap" x-text="ago(c.at)" :title="new Date(c.at).toLocaleString()"></td>
              <td><span x-text="c.provider"></span> · <span class="mono small" x-text="c.model || '–'"></span></td>
              <td x-text="c.feature"></td>
              <td class="muted small" x-text="c.email || '–'"></td>
              <td class="text-end text-nowrap" x-text="amount(c)"></td>
              <td><span :class="c.ok ? 'muted' : 'text-danger'" x-text="c.ok ? 'OK' : 'Failed'"></span></td>
            </tr></template>
          </tbody></table>
          <div class="p-2" x-show="more"><button type="button" class="btn btn-outline-secondary btn-sm" @click="loadMore()">Load more</button></div>
        </div>
