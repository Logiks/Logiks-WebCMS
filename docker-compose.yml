# Local cluster that behaves like production: MySQL + Redis, N web nodes behind a load balancer, separate worker.
#   export APP_MASTER_KEY=$(openssl rand -base64 32)
#   docker compose up --build --scale web=3
#   open http://localhost:8080/admin      (create the first admin: see README)
x-app: &app
  build: .
  environment: &env
    NODE_ENV: production
    DB_URL: mysql://cms:cms@mysql:3306/cms
    REDIS_URL: redis://redis:6379/0
    APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY (openssl rand -base64 32)}
    TRUST_PROXY_HOPS: 1
    SHUTDOWN_DELAY_MS: 5000
    MEDIA_DIR: /app/data/media # the shared volume below: uploads must be visible to every node
  volumes: [media:/app/data/media]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  mysql:
    image: mysql:8.4
    environment:
      { MYSQL_DATABASE: cms, MYSQL_USER: cms, MYSQL_PASSWORD: cms, MYSQL_ROOT_PASSWORD: root }
    volumes: [mysql:/var/lib/mysql]
    # -h 127.0.0.1 forces TCP: the image's temporary init server answers on the socket only, which would report healthy too early.
    healthcheck:
      {
        test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot'],
        interval: 5s,
        retries: 20,
      }
  redis:
    image: redis:7
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, retries: 20 }
  migrate:
    build: .
    command: ['node', 'src/cli/index.js', 'migrate']
    environment: *env
    depends_on: { mysql: { condition: service_healthy } }
  web:
    <<: *app
    environment: { <<: *env, ROLE: web }
  worker:
    <<: *app
    environment: { <<: *env, ROLE: worker }
  lb:
    image: nginx:1.27
    ports: ['8080:80']
    volumes: ['./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [web]

volumes: { mysql: {}, media: {} }
