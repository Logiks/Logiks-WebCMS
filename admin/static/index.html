<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232b59c3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/admin/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/admin/vendor/plex-sans/latin-400.css">
  <link rel="stylesheet" href="/admin/vendor/plex-sans/latin-500.css">
  <link rel="stylesheet" href="/admin/vendor/plex-sans/latin-600.css">
  <link rel="stylesheet" href="/admin/vendor/plex-mono/latin-400.css">
  <link rel="stylesheet" href="/admin/vendor/plex-mono/latin-500.css">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/app.js" defer></script>
  <script src="/admin/vendor/alpine/cdn.min.js" defer></script>
</head>
<body x-data="app" x-cloak @profile-updated="setUser($event.detail)">

<div class="toaster" aria-live="polite">
  <template x-for="t in toasts" :key="t.id"><div class="toast-x" :class="t.type" x-text="t.msg"></div></template>
</div>

<!-- Media picker: used by the editor's image fields and blocks -->
<div class="modal-x" x-show="picker.open" style="display:none" role="dialog" aria-modal="true" aria-label="Choose from the media library" @keydown.escape.window="picker.open && closePicker()">
  <div class="modal-card">
    <div class="d-flex gap-2 mb-2 flex-wrap">
      <input class="form-control" style="max-width:16rem" placeholder="Search files" aria-label="Search files" x-model="picker.q" @input.debounce.300ms="loadPicker()">
      <label class="btn btn-outline-secondary mb-0">Upload <input type="file" hidden multiple accept="image/jpeg,image/png,image/gif,image/webp,image/avif,application/pdf" @change="pickerUpload($event.target.files); $event.target.value = ''"></label>
      <button type="button" class="btn btn-outline-secondary ms-auto" @click="closePicker()">Close</button>
    </div>
    <div class="text-danger small mb-2" role="alert" x-show="picker.error" x-text="picker.error"></div>
    <div class="empty" x-show="!picker.items.length">No files yet. Upload one to get started.</div>
    <div class="media-grid">
      <template x-for="m in picker.items" :key="m.id">
        <button type="button" class="media-tile" @click="choose(m)"><span class="ph"><img x-show="m.kind === 'image'" :src="thumb(m)" :alt="m.alt" loading="lazy"><i class="bi bi-file-earmark-pdf" x-show="m.kind !== 'image'"></i></span><span class="nm" x-text="m.filename"></span></button>
      </template>
    </div>
  </div>
</div>

<!-- ───────── Sign-in page branding (Settings → Login page) ───────── -->
<template x-if="['login', 'forgot', 'reset'].includes(view) && branding && branding.customCss">
  <style x-text="branding.customCss"></style>
</template>

<!-- ───────── Sign in ───────── -->
<template x-if="view === 'login'">
  <div class="login">
    <div class="login-side" :style="loginSideStyle">
      <img class="login-logo" x-show="branding && branding.logoUrl" :src="branding && branding.logoUrl" alt="">
      <h1 x-text="(branding && branding.welcomeHeading) || siteName || 'Admin'"></h1>
      <p x-text="(branding && branding.welcomeText) || 'Sign in to manage content, settings and the servers behind this site.'"></p>
    </div>
    <form class="login-form" @submit.prevent="signIn()">
      <h2 class="h4 mb-4">Sign in</h2>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control" autocomplete="username" required x-model="login.email" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="pw">Password</label>
        <input id="pw" type="password" class="form-control" autocomplete="current-password" required x-model="login.password">
      </div>
      <div class="text-danger small mb-3" role="alert" x-show="login.error" x-text="login.error"></div>
      <button class="btn btn-primary" :disabled="login.busy"><span x-text="login.busy ? 'Signing in…' : 'Sign in'"></span></button>
      <a href="#/forgot" class="ms-3 small" x-show="passwordReset">Forgot your password?</a>
    </form>
  </div>
</template>

<!-- ───────── Forgot password ───────── -->
<template x-if="view === 'forgot'">
  <div class="login">
    <div class="login-side" :style="loginSideStyle">
      <img class="login-logo" x-show="branding && branding.logoUrl" :src="branding && branding.logoUrl" alt="">
      <h1 x-text="siteName || 'Admin'"></h1>
      <p>We'll email you a link to choose a new password.</p>
    </div>
    <form class="login-form" @submit.prevent="submitForgot()">
      <h2 class="h4 mb-4">Reset your password</h2>
      <template x-if="!forgot.sent">
        <div>
          <div class="mb-3">
            <label class="form-label" for="fp-email">Email</label>
            <input id="fp-email" type="email" class="form-control" autocomplete="username" required x-model="forgot.email" autofocus>
          </div>
          <div class="text-danger small mb-3" role="alert" x-show="forgot.error" x-text="forgot.error"></div>
          <button class="btn btn-primary" :disabled="forgot.busy"><span x-text="forgot.busy ? 'Sending…' : 'Send reset link'"></span></button>
        </div>
      </template>
      <div class="alert alert-success" role="status" x-show="forgot.sent">If that email belongs to an account, a reset link is on its way. It expires soon, so check your inbox.</div>
      <div class="mt-4"><a href="#/">Back to sign in</a></div>
    </form>
  </div>
</template>

<!-- ───────── Choose a new password (from the emailed link) ───────── -->
<template x-if="view === 'reset'">
  <div class="login">
    <div class="login-side" :style="loginSideStyle">
      <img class="login-logo" x-show="branding && branding.logoUrl" :src="branding && branding.logoUrl" alt="">
      <h1 x-text="siteName || 'Admin'"></h1>
      <p>Choose a password you don't use anywhere else.</p>
    </div>
    <form class="login-form" @submit.prevent="submitReset()">
      <h2 class="h4 mb-4">Choose a new password</h2>
      <div class="muted" x-show="reset.valid === null && !reset.done">Checking your link…</div>
      <div class="alert alert-warning" role="alert" x-show="reset.valid === false && !reset.done">This reset link is invalid or has expired. <a href="#/forgot" x-show="passwordReset">Request a new one</a></div>
      <template x-if="reset.valid === true && !reset.done">
        <div>
          <div class="mb-3">
            <label class="form-label" for="rp-new">New password</label>
            <input id="rp-new" type="password" class="form-control" autocomplete="new-password" required x-model="reset.password" autofocus>
            <div class="form-text" x-text="'At least ' + minLength + ' characters.'"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="rp-confirm">Repeat the new password</label>
            <input id="rp-confirm" type="password" class="form-control" autocomplete="new-password" required x-model="reset.confirm">
          </div>
          <div class="text-danger small mb-3" role="alert" x-show="reset.error" x-text="reset.error"></div>
          <button class="btn btn-primary" :disabled="reset.busy"><span x-text="reset.busy ? 'Saving…' : 'Set new password'"></span></button>
        </div>
      </template>
      <div class="alert alert-success" role="status" x-show="reset.done">Password changed, and every device was signed out. <a href="#/">Sign in</a></div>
    </form>
  </div>
</template>

<!-- ───────── Shell ───────── -->
<template x-if="view === 'app'">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span x-text="siteName || 'Admin'"></span><small>Admin console</small></div>
    <nav>
      <template x-for="n in nav" :key="n.id">
        <div class="nav-item-x">
          <template x-if="!n.items">
            <a class="nav-link-x" :class="{active: route === n.id}" :href="'#/' + n.id"><i class="bi" :class="n.icon"></i><span x-text="n.label"></span></a>
          </template>
          <template x-if="n.items">
            <div>
              <button type="button" class="nav-link-x nav-group-btn" :class="{'has-active': groupActive(n)}" :aria-expanded="groupOpen(n)" :aria-controls="'nav-' + n.id" @click="toggleGroup(n)"><i class="bi" :class="n.icon"></i><span x-text="n.label"></span><i class="bi bi-chevron-down chev" :class="{open: groupOpen(n)}"></i></button>
              <div class="nav-sub" :id="'nav-' + n.id" x-show="groupOpen(n)">
                <template x-for="c in n.items" :key="c.id">
                  <a class="nav-link-x nav-sub-link" :class="{active: path === c.id}" :href="'#/' + c.id" x-text="c.label"></a>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </nav>
    <div class="me">
      <a href="#/account" class="text-white text-decoration-none" :class="{'fw-semibold': route === 'account'}" x-text="user.name" title="My account"></a>
      <small class="muted d-block" x-text="user.role"></small>
      <button class="btn btn-link" @click="signOut()">Sign out</button>
    </div>
  </aside>

  <main class="main">

    <!-- Overview -->
    <template x-if="route === 'overview'">
      <section x-data="overviewPage">
        <div class="page-head"><h1>Overview</h1><p>What's running, and what changed recently.</p></div>
        <div class="alert alert-warning" x-show="maintenance">Maintenance mode is on. Visitors see a maintenance page; the admin is unaffected. <a href="#/settings/general">Turn it off</a></div>

        <div class="row g-3 mb-3">
          <div class="col-6 col-lg-3" x-show="content">
            <div class="panel p-3 h-100"><div class="muted small mb-2">Content</div>
              <div class="bigver" x-text="content ? content.published : '–'"></div>
              <div class="small mt-2 muted"><span x-text="content ? content.draft : 0"></span> draft, <span x-text="content ? content.createdThisWeek : 0"></span> new this week</div></div>
          </div>
          <div class="col-6 col-lg-3" x-show="traffic">
            <div class="panel p-3 h-100"><div class="muted small mb-2">Traffic, last 24h</div>
              <div class="bigver" x-text="traffic ? traffic.pageviews : '–'"></div>
              <div class="small mt-2 muted"><span x-text="active ? active.total : 0"></span> active now · <a href="#/analytics-active">View</a></div></div>
          </div>
          <div class="col-6 col-lg-3" x-show="mediaTotal !== null">
            <div class="panel p-3 h-100"><div class="muted small mb-2">Media</div>
              <div class="bigver" x-text="mediaTotal"></div>
              <div class="small mt-2 muted">files in the library</div></div>
          </div>
          <div class="col-6 col-lg-3" x-show="usersTotal !== null">
            <div class="panel p-3 h-100"><div class="muted small mb-2">Users</div>
              <div class="bigver" x-text="usersTotal"></div>
              <div class="small mt-2 muted"><span x-text="usersActiveWeek"></span> signed in this week</div></div>
          </div>
        </div>

        <div class="row g-3 mb-3" x-show="cluster">
          <div class="col-md-3"><div class="panel p-3 h-100"><div class="muted small mb-2">Config version</div><div class="bigver" x-text="cluster?.dbConfigVersion"></div><div class="muted small mt-2">Bumps on every settings change</div></div></div>
          <div class="col-md-3"><div class="panel p-3 h-100"><div class="muted small mb-2">Servers up</div><div class="bigver"><span x-text="up"></span><span class="muted" style="font-size:1.4rem"> / <span x-text="cluster?.nodes.length"></span></span></div><div class="small mt-2" :class="drifted ? 'text-warning' : 'muted'" x-text="drifted ? drifted + ' behind on config' : 'All on the latest config'"></div></div></div>
          <div class="col-md-3"><div class="panel p-3 h-100"><div class="muted small mb-2">Runtime</div>
            <div class="small"><span class="mono" x-text="cluster?.runtime.database"></span> database · <span class="mono" x-text="cluster?.runtime.bus"></span> bus</div>
            <div class="small"><span class="mono" x-text="cluster?.runtime.sessions"></span> sessions · <span class="mono" x-text="cluster?.runtime.jobs"></span> jobs</div>
            <div class="small mt-2 muted" x-show="cluster && !cluster.runtime.redis">Redis isn't configured. Fine for development; production clusters need it.</div></div></div>
          <div class="col-md-3"><div class="panel p-3 h-100"><div class="muted small mb-2">Failed jobs</div><div class="bigver" x-text="failedJobs"></div><div class="small mt-2 muted"><a href="#/system">View in System</a></div></div></div>
        </div>
        <div class="panel" x-show="can('audit.read')">
          <div class="panel-h">Recent activity <a class="small fw-normal" href="#/audit">View all</a></div>
          <div class="empty" x-show="!recent.length">Nothing yet. Changes to settings, users and roles show up here.</div>
          <table class="table" x-show="recent.length"><tbody><template x-for="e in recent" :key="e.id">
            <tr><td class="mono" x-text="e.action"></td><td x-text="e.actor"></td><td class="muted text-end" x-text="ago(e.at)"></td></tr></template></tbody></table>
        </div>
      </section>
    </template>

    <!-- Settings -->
    <template x-if="route === 'settings'">
      <section x-data="settingsPage">
        <div class="page-head"><h1>Settings</h1><p>Stored in the database and applied on every server within seconds. No restart, no deploy.</p></div>
        <div class="settings-grid" x-show="loaded">
          <nav class="subnav">
            <template x-for="n in namespaces" :key="n.namespace">
              <a href="#" :class="{active: ns === n.namespace}" @click.prevent="select(n.namespace)"><span x-text="n.title"></span><span class="dirty-dot" x-show="dirtyCount(n.namespace)" title="Unsaved changes"></span></a>
            </template>
            <a href="#" class="mt-3" :class="{active: ns === '__history'}" @click.prevent="showHistory()"><i class="bi bi-clock-history me-1"></i>History</a>
          </nav>

          <div>
            <!-- form -->
            <div class="panel" x-show="current && ns !== '__history'">
              <div class="panel-h"><span x-text="current?.title"></span>
                <span class="muted small fw-normal" x-text="current?.description"></span></div>
              <template x-for="f in (current?.fields || [])" :key="f.key">
                <div class="frow" :class="{changed: isDirty(f)}">
                  <div>
                    <label class="title" :for="'f_' + f.key" x-text="f.label"></label>
                    <span class="tag" x-show="st(f).locked">Set by environment</span>
                    <span class="tag warn" x-show="f.restartRequired">Needs restart</span>
                    <span class="tag ok" x-show="f.secret && st(f).isSet && !isRemoved(f)">Saved</span>
                    <div class="key" x-text="ns + '.' + f.key"></div>
                    <div class="help" x-show="f.help" x-text="f.help"></div>
                  </div>
                  <div class="ctl">
                    <template x-if="(f.type === 'string') && !f.secret"><input :id="'f_' + f.key" class="form-control" :class="{'is-invalid': errors[f.key]}" :value="val(f)" :disabled="st(f).locked" :placeholder="f.placeholder || ''" @input="set(f, $event.target.value)"></template>
                    <template x-if="f.type === 'string' && f.secret">
                      <div>
                        <input :id="'f_' + f.key" type="password" autocomplete="new-password" class="form-control" :class="{'is-invalid': errors[f.key]}" :value="val(f)" :disabled="st(f).locked || isRemoved(f)" :placeholder="st(f).isSet ? '••••••••  (leave blank to keep)' : 'Not set'" @input="set(f, $event.target.value)">
                        <button type="button" class="btn btn-link btn-sm px-0" x-show="st(f).isSet && !isRemoved(f) && !st(f).locked" @click="remove(f)">Remove saved value</button>
                        <span class="small text-warning" x-show="isRemoved(f)">Will be removed when you save. <a href="#" @click.prevent="undoRemove(f)">Undo</a></span>
                      </div>
                    </template>
                    <template x-if="f.type === 'text'"><textarea :id="'f_' + f.key" rows="3" class="form-control" :class="{'is-invalid': errors[f.key]}" :value="val(f)" :disabled="st(f).locked" @input="set(f, $event.target.value)"></textarea></template>
                    <template x-if="f.type === 'number' && !f.media"><input :id="'f_' + f.key" type="number" class="form-control" style="max-width:10rem" :class="{'is-invalid': errors[f.key]}" :value="val(f)" :min="f.min" :max="f.max" :disabled="st(f).locked" @input="set(f, $event.target.value === '' ? '' : Number($event.target.value))"></template>
                    <template x-if="f.type === 'number' && f.media">
                      <div class="d-flex align-items-center gap-3">
                        <span class="ph thumb" x-show="val(f)"><img x-show="media[val(f)] && media[val(f)].kind === 'image'" :src="thumb(media[val(f)])" alt=""></span>
                        <span class="muted small" x-show="val(f)" x-text="media[val(f)] ? media[val(f)].filename : ''"></span>
                        <button type="button" class="btn btn-outline-secondary btn-sm" :disabled="st(f).locked" @click="pickMedia(f)" x-text="val(f) ? 'Change' : 'Choose from the library'"></button>
                        <button type="button" class="btn btn-link btn-sm" x-show="val(f)" :disabled="st(f).locked" @click="set(f, 0)">Remove</button>
                      </div>
                    </template>
                    <template x-if="f.type === 'boolean'"><div class="form-check form-switch"><input :id="'f_' + f.key" type="checkbox" class="form-check-input" role="switch" :checked="val(f)" :disabled="st(f).locked" @change="set(f, $event.target.checked)"><label class="form-check-label muted" :for="'f_' + f.key" x-text="val(f) ? 'On' : 'Off'"></label></div></template>
                    <template x-if="f.type === 'select'"><select :id="'f_' + f.key" class="form-select" :disabled="st(f).locked" @change="set(f, $event.target.value)"><template x-for="o in f.options" :key="o.value"><option :value="o.value" :selected="o.value === val(f)" x-text="o.label"></option></template></select></template>
                    <template x-if="f.type === 'list'"><textarea :id="'f_' + f.key" rows="3" class="form-control mono" placeholder="One per line" :value="listText(f)" :disabled="st(f).locked" @input="setList(f, $event.target.value)"></textarea></template>
                    <div class="invalid-feedback d-block" x-show="errors[f.key]" x-text="errors[f.key]"></div>
                    <button type="button" class="btn btn-link btn-sm px-0 muted" x-show="st(f).source === 'db' && !f.secret && !st(f).locked && !isDirty(f)" @click="resetToDefault(f)">Reset to default</button>
                  </div>
                </div>
              </template>
              <div class="frow" x-show="current?.tests?.length">
                <div><span class="title">Check settings</span><div class="help">Tries the values above without saving them.</div></div>
                <div class="ctl"><template x-for="t in current?.tests || []" :key="t.id"><button class="btn btn-outline-secondary btn-sm" :disabled="testing" @click="runTest(t)" x-text="testing ? 'Testing…' : t.label"></button></template>
                  <div class="small mt-2" :class="testResult?.ok ? 'text-success' : 'text-danger'" x-show="testResult" x-text="testResult?.message"></div></div>
              </div>
            </div>

            <!-- history -->
            <div class="panel" x-show="ns === '__history'">
              <div class="panel-h">Change history</div>
              <div class="empty" x-show="!history.length">No changes yet.</div>
              <table class="table" x-show="history.length"><thead><tr><th>Setting</th><th>Change</th><th>By</th><th></th></tr></thead><tbody>
                <template x-for="r in history" :key="r.id"><tr>
                  <td class="mono" x-text="r.namespace + '.' + r.key"></td>
                  <td><span class="diff" x-show="!r.secret"><del x-text="show(r.from)"></del> → <ins x-text="r.wasReset ? 'default' : show(r.to)"></ins></span><span class="muted" x-show="r.secret">Secret value changed</span></td>
                  <td class="muted"><span x-text="r.by"></span><br><small x-text="ago(r.at)"></small></td>
                  <td class="text-end"><button class="btn btn-sm btn-outline-secondary" x-show="r.restorable" @click="restore(r)">Restore previous</button></td>
                </tr></template></tbody></table>
            </div>
          </div>
        </div>

        <div class="savebar" x-show="dirtyCount(ns) > 0">
          <span><strong x-text="dirtyCount(ns)"></strong> unsaved change<span x-show="dirtyCount(ns) !== 1">s</span></span>
          <span class="ms-auto"></span>
          <button class="btn btn-outline-secondary" @click="discard()">Discard</button>
          <button class="btn btn-primary" :disabled="saving" @click="save()" x-text="saving ? 'Saving…' : 'Save changes'"></button>
        </div>
      </section>
    </template>

    <!-- Users -->
    <template x-if="route === 'users'">
      <section x-data="usersPage">
        <div class="page-head d-flex justify-content-between align-items-end"><div><h1>Users</h1><p>People who can sign in to the admin.</p></div>
          <button class="btn btn-primary" x-show="can('users.write')" @click="edit()">Add user</button></div>

        <form class="panel mb-3" x-show="form" @submit.prevent="save()">
          <div class="panel-h" x-text="form?.id ? 'Edit user' : 'New user'"></div>
          <template x-if="form"><div class="p-3 row g-3">
            <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" required x-model="form.name"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required x-model="form.email"></div>
            <div class="col-md-4"><label class="form-label">Role</label><select class="form-select" x-model.number="form.roleId"><template x-for="r in roles" :key="r.id"><option :value="r.id" :selected="r.id === form.roleId" x-text="r.name"></option></template></select></div>
            <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" x-model="form.status"><option value="active">Active</option><option value="disabled">Disabled</option></select></div>
            <div class="col-md-4" x-show="!form.invite"><label class="form-label" x-text="form.id ? 'New password' : 'Password'"></label><input type="password" autocomplete="new-password" class="form-control" :required="!form.id && !form.invite" :placeholder="form.id ? 'Leave blank to keep' : ''" x-model="form.password"></div>
            <div class="col-12" x-show="!form.id"><div class="form-check"><input class="form-check-input" type="checkbox" id="u-invite" x-model="form.invite"><label class="form-check-label" for="u-invite">Email them a link to choose their own password</label></div></div>
            <div class="col-12 text-danger small" x-show="error" x-text="error" role="alert"></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary" :disabled="busy" x-text="form.invite ? 'Send invitation' : 'Save user'"></button><button type="button" class="btn btn-outline-secondary" @click="form = null">Cancel</button>
              <button type="button" class="btn btn-link" x-show="form.id && form.locked" @click="unlock()">Unlock account</button>
              <button type="button" class="btn btn-link" x-show="form.id" @click="sendLink()">Email a password link</button>
              <button type="button" class="btn btn-link" x-show="form.id" @click="signOutEverywhere()">Sign out everywhere</button></div>
          </div></template>
        </form>

        <div class="panel"><table class="table">
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead>
          <tbody><template x-for="u in users" :key="u.id"><tr>
            <td><div x-text="u.name"></div><div class="muted small" x-text="u.email"></div></td>
            <td x-text="u.role"></td>
            <td><span class="tag" :class="u.status === 'active' ? 'ok' : ''" x-text="u.lockedUntil ? 'Locked' : u.status"></span></td>
            <td class="muted" x-text="u.lastLoginAt ? ago(u.lastLoginAt) : 'Never'"></td>
            <td class="text-end text-nowrap"><template x-if="can('users.write')"><span><button class="btn btn-sm btn-outline-secondary" @click="edit(u)">Edit</button> <button class="btn btn-sm btn-outline-danger" @click="remove(u)">Delete</button></span></template></td>
          </tr></template></tbody></table></div>
      </section>
    </template>

    <!-- Roles -->
    <template x-if="route === 'roles'">
      <section x-data="rolesPage">
        <div class="page-head d-flex justify-content-between align-items-end"><div><h1>Roles and permissions</h1><p>A role is a set of permissions. Every user has one role.</p></div>
          <button class="btn btn-primary" x-show="can('roles.write')" @click="edit()">Add role</button></div>

        <form class="panel mb-3" x-show="form" @submit.prevent="save()">
          <div class="panel-h" x-text="form?.id ? (form.isSystem ? form.name : 'Edit role') : 'New role'"></div>
          <template x-if="form">
          <div>
            <div class="p-3 row g-3">
              <div class="col-md-5"><label class="form-label">Name</label><input class="form-control" required :disabled="form.isSystem" x-model="form.name"></div>
              <div class="col-md-7"><label class="form-label">Description</label><input class="form-control" x-model="form.description"></div>
            </div>
            <div class="muted px-3 pb-3" x-show="form.isSystem">This is a system role with full access. Its permissions can't be changed.</div>
            <template x-if="!form.isSystem"><div>
              <template x-for="g in groups" :key="g.group"><div class="perm-group">
                <div class="fw-semibold mb-1" x-text="g.group"></div>
                <template x-for="p in g.permissions" :key="p.key"><div class="form-check"><input class="form-check-input" type="checkbox" :id="'p_' + p.key" :checked="form.permissions.includes(p.key)" @change="toggle(p.key, $event.target.checked)"><label class="form-check-label" :for="'p_' + p.key"><span x-text="p.label"></span> <span class="mono muted" x-text="p.key"></span></label></div></template>
              </div></template></div></template>
            <div class="p-3 text-danger small" x-show="error" x-text="error" role="alert"></div>
            <div class="p-3 d-flex gap-2"><button class="btn btn-primary" :disabled="busy" x-show="!form.isSystem && can('roles.write')">Save role</button><button type="button" class="btn btn-outline-secondary" @click="form = null">Close</button></div>
          </div></template>
        </form>

        <div class="panel"><table class="table">
          <thead><tr><th>Role</th><th>Permissions</th><th>Users</th><th></th></tr></thead>
          <tbody><template x-for="r in roles" :key="r.id"><tr>
            <td><div x-text="r.name"></div><div class="muted small" x-text="r.description"></div></td>
            <td class="muted" x-text="r.permissions.includes('*') ? 'Everything' : r.permissions.length + ' permissions'"></td>
            <td x-text="r.userCount"></td>
            <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-secondary" @click="edit(r)" x-text="can('roles.write') && !r.isSystem ? 'Edit' : 'View'"></button> <button class="btn btn-sm btn-outline-danger" x-show="can('roles.write') && !r.isSystem" @click="remove(r)">Delete</button></td>
          </tr></template></tbody></table></div>
      </section>
    </template>

    <!-- Audit -->
    <template x-if="route === 'audit'">
      <section x-data="auditPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Audit log</h1><p>Who changed what, and when. Secret values are never recorded.</p></div>
          <a class="btn btn-outline-secondary" :href="exportUrl" download>Export CSV</a>
        </div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="au-action">Action</label><input id="au-action" class="form-control" style="max-width:16rem" placeholder="e.g. settings" x-model="filter" @input.debounce.400ms="load(true)"></div>
          <div><label class="form-label small" for="au-actor">Actor email</label><input id="au-actor" class="form-control" style="max-width:16rem" placeholder="e.g. you@example.com" x-model="actorEmail" @input.debounce.400ms="load(true)"></div>
          <div><label class="form-label small" for="au-from">From</label><input id="au-from" type="date" class="form-control" x-model="from" @change="load(true)"></div>
          <div><label class="form-label small" for="au-to">To</label><input id="au-to" type="date" class="form-control" x-model="to" @change="load(true)"></div>
          <button type="button" class="btn btn-link" x-show="filter || actorEmail || from || to" @click="clearFilters()">Clear filters</button>
        </div>
        <div class="panel">
          <div class="empty" x-show="!entries.length">No entries match.</div>
          <table class="table" x-show="entries.length"><thead><tr><th>Action</th><th>Detail</th><th>By</th><th>When</th></tr></thead><tbody>
            <template x-for="e in entries" :key="e.id"><tr>
              <td class="mono" x-text="e.action"></td>
              <td class="small"><span x-html="detail(e)"></span></td>
              <td x-text="e.actor"></td>
              <td class="muted text-nowrap" x-text="ago(e.at)" :title="new Date(e.at).toLocaleString()"></td></tr></template></tbody></table>
        </div>
        <div class="text-center mt-3"><button class="btn btn-outline-secondary" x-show="more" @click="load(false)">Load older</button></div>
      </section>
    </template>

    <!-- Analytics -->
    <template x-if="route === 'analytics-overview'">
      <section x-data="analyticsPage('overview')">
        <div class="page-head"><h1>Analytics overview</h1><p>Page views, sessions and bounces. The public site and the admin panel are tracked separately.</p></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="an-surface-1">Surface</label><select id="an-surface-1" class="form-select" x-model="surface" @change="load()"><option value="public">Public site</option><option value="admin">Admin panel</option></select></div>
          <div><label class="form-label small" for="an-from-1">From</label><input id="an-from-1" type="date" class="form-control" x-model="from" @change="load()"></div>
          <div><label class="form-label small" for="an-to-1">To</label><input id="an-to-1" type="date" class="form-control" x-model="to" @change="load()"></div>
        </div>
        <div class="row g-3">
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Page views</div><div class="bigver" x-text="overview ? overview.pageviews : '–'"></div></div></div>
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Unique visitors</div><div class="bigver" x-text="overview ? overview.sessions : '–'"></div></div></div>
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Avg. pages / visitor</div><div class="bigver" x-text="overview ? overview.avgPagesPerSession.toFixed(1) : '–'"></div></div></div>
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Bounce rate</div><div class="bigver" x-text="overview ? pct(overview.bounceRate) : '–'"></div></div></div>
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Avg. time on page</div><div class="bigver" x-text="overview ? duration(overview.avgDwellMs) : '–'"></div></div></div>
          <div class="col-6 col-lg-4"><div class="panel p-3"><div class="muted small">Clicks tracked</div><div class="bigver" x-text="overview ? overview.clicks : '–'"></div></div></div>
        </div>

        <div class="panel p-3 mt-3">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
            <h2 class="h6 mb-0">Traffic over time</h2>
            <div class="legend">
              <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-1)"></span>Page views</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-2)"></span>Visitors</span>
            </div>
          </div>
          <div class="empty" x-show="!trend.length">No page views in this range yet.</div>
          <svg x-show="trend.length" x-ref="trendSvg" class="chart-svg" viewBox="0 0 600 195" preserveAspectRatio="none" @mousemove="onTrendMove($event)" @mouseleave="onTrendLeave()" role="img" aria-label="Page views and visitors per day">
            <g x-html="trendSvgInner"></g>
          </svg>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-lg-6">
            <div class="panel p-3 h-100">
              <h2 class="h6 mb-2">Devices</h2>
              <div class="empty" x-show="!devices.length">No sessions in this range yet.</div>
              <div class="donut-wrap" x-show="devices.length">
                <svg viewBox="0 0 200 200" width="160" height="160" role="img" aria-label="Sessions by device type">
                  <g x-html="donutSvgInner"></g>
                </svg>
                <div class="legend flex-column">
                  <template x-for="seg in donutSegments" :key="seg.device + '-legend'">
                    <span class="legend-item"><span class="legend-swatch" :style="'background:' + seg.color"></span><span class="text-capitalize" x-text="seg.device"></span><span class="muted ms-auto" x-text="seg.count + ' · ' + pct(seg.pct)"></span></span>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="panel p-3 h-100">
              <h2 class="h6 mb-2">Top referrers</h2>
              <div class="empty" x-show="!referrerRows.length">No sessions in this range yet.</div>
              <div class="bar-list" x-show="referrerRows.length">
                <template x-for="r in referrerRows" :key="r.host">
                  <div class="bar-list-row">
                    <div class="bar-list-label" :title="r.host" x-text="r.host"></div>
                    <div class="bar-list-track"><div class="bar-list-fill" :style="'width:' + r.pct + '%'"></div></div>
                    <div class="bar-list-value" x-text="r.sessions"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </section>
    </template>

    <template x-if="route === 'analytics-active'">
      <section x-data="analyticsActivePage">
        <div class="page-head"><h1>Active now</h1><p>Sessions seen in the last window, by the page they're currently on. Refreshes automatically.</p></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="an-surface-0">Surface</label><select id="an-surface-0" class="form-select" x-model="surface" @change="refresh()"><option value="public">Public site</option><option value="admin">Admin panel</option></select></div>
          <div><label class="form-label small" for="an-window">Active within</label><select id="an-window" class="form-select" x-model.number="windowMin" @change="refresh()"><option value="1">1 minute</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div>
        </div>
        <div class="panel p-3 mb-3"><div class="muted small">Active sessions</div><div class="bigver" x-text="data ? data.total : '–'"></div></div>
        <div class="panel p-3">
          <h2 class="h6 mb-2">By page</h2>
          <div class="empty" x-show="data && !data.byPage.length">No active sessions right now.</div>
          <div class="bar-list" x-show="data && data.byPage.length">
            <template x-for="r in (data ? data.byPage : [])" :key="r.path">
              <div class="bar-list-row">
                <div class="bar-list-label mono" :title="r.path" x-text="r.path"></div>
                <div class="bar-list-track"><div class="bar-list-fill" :style="'width:' + pctOf(r.count) + '%'"></div></div>
                <div class="bar-list-value" x-text="r.count"></div>
              </div>
            </template>
          </div>
        </div>
      </section>
    </template>

    <template x-if="route === 'analytics-pages'">
      <section x-data="analyticsPage('pages')">
        <div class="page-head"><h1>Page analytics</h1><p>Views and time on page, page-wise.</p></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="an-surface-2">Surface</label><select id="an-surface-2" class="form-select" x-model="surface" @change="load()"><option value="public">Public site</option><option value="admin">Admin panel</option></select></div>
          <div><label class="form-label small" for="an-from-2">From</label><input id="an-from-2" type="date" class="form-control" x-model="from" @change="load()"></div>
          <div><label class="form-label small" for="an-to-2">To</label><input id="an-to-2" type="date" class="form-control" x-model="to" @change="load()"></div>
        </div>
        <div class="panel">
          <div class="empty" x-show="!pages.length">No page views yet.</div>
          <table class="table" x-show="pages.length"><thead><tr><th>Page</th><th>Views</th><th>Sessions</th><th>Avg. time</th><th>Bounce rate</th></tr></thead><tbody>
            <template x-for="p in pages" :key="p.path"><tr>
              <td class="mono" x-text="p.path"></td>
              <td x-text="p.views"></td>
              <td x-text="p.sessions"></td>
              <td x-text="duration(p.avgDwellMs)"></td>
              <td x-text="p.bounceRate == null ? '–' : pct(p.bounceRate)"></td>
            </tr></template>
          </tbody></table>
        </div>
      </section>
    </template>

    <template x-if="route === 'analytics-sessions'">
      <section x-data="analyticsPage('sessions')">
        <div class="page-head"><h1>Sessions</h1><p>One row per visit — entry and exit page, device and referrer.</p></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="an-surface-3">Surface</label><select id="an-surface-3" class="form-select" x-model="surface" @change="loadSessions(true)"><option value="public">Public site</option><option value="admin">Admin panel</option></select></div>
          <div><label class="form-label small" for="an-from-3">From</label><input id="an-from-3" type="date" class="form-control" x-model="from" @change="loadSessions(true)"></div>
          <div><label class="form-label small" for="an-to-3">To</label><input id="an-to-3" type="date" class="form-control" x-model="to" @change="loadSessions(true)"></div>
        </div>
        <div class="panel">
          <div class="empty" x-show="!sessions.length">No sessions yet.</div>
          <table class="table" x-show="sessions.length"><thead><tr><th>Entry page</th><th>Exit page</th><th>Pages</th><th>Device</th><th>Referrer</th><th>Bounce</th><th>Last seen</th></tr></thead><tbody>
            <template x-for="s in sessions" :key="s.token"><tr>
              <td class="mono" x-text="s.entryPath"></td>
              <td class="mono" x-text="s.exitPath"></td>
              <td x-text="s.pageCount"></td>
              <td x-text="s.deviceType"></td>
              <td class="muted small" x-text="s.referrer || '–'"></td>
              <td x-text="s.isBounce ? 'Yes' : 'No'"></td>
              <td class="muted text-nowrap" x-text="ago(s.lastSeen)" :title="new Date(s.lastSeen).toLocaleString()"></td>
            </tr></template>
          </tbody></table>
        </div>
        <div class="text-center mt-3"><button class="btn btn-outline-secondary" x-show="moreSessions" @click="loadSessions(false)">Load older</button></div>
      </section>
    </template>

    <template x-if="route === 'analytics-users'">
      <section x-data="analyticsPage('users')">
        <div class="page-head"><h1>User-wise analytics</h1><p>Activity for signed-in users — every admin session today; public visitors once customer accounts exist.</p></div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="an-surface-4">Surface</label><select id="an-surface-4" class="form-select" x-model="surface" @change="load()"><option value="admin">Admin panel</option><option value="public">Public site</option></select></div>
          <div><label class="form-label small" for="an-from-4">From</label><input id="an-from-4" type="date" class="form-control" x-model="from" @change="load()"></div>
          <div><label class="form-label small" for="an-to-4">To</label><input id="an-to-4" type="date" class="form-control" x-model="to" @change="load()"></div>
        </div>
        <div class="panel">
          <div class="empty" x-show="!users.length">No signed-in activity yet.</div>
          <table class="table" x-show="users.length"><thead><tr><th>User</th><th>Sessions</th><th>Page views</th><th>Last seen</th></tr></thead><tbody>
            <template x-for="u in users" :key="u.userId"><tr>
              <td><div x-text="u.name || ('user #' + u.userId)"></div><div class="muted small" x-text="u.email"></div></td>
              <td x-text="u.sessions"></td>
              <td x-text="u.pageviews"></td>
              <td class="muted text-nowrap" x-text="ago(u.lastSeen)" :title="new Date(u.lastSeen).toLocaleString()"></td>
            </tr></template>
          </tbody></table>
        </div>
      </section>
    </template>

    <!-- Cluster -->
    <template x-if="route === 'cluster'">
      <section x-data="clusterPage">
        <div class="page-head"><h1>Cluster</h1><p>Every server reports the config version it has applied. A server that falls behind shows in amber and heals itself.</p></div>
        <div class="d-flex align-items-baseline gap-3 mb-3"><div class="bigver" x-text="data ? data.dbConfigVersion : '–'"></div><div class="muted">current config version<br><span class="small">refreshes every 5 seconds</span></div></div>
        <div class="panel">
          <div class="empty" x-show="data && !data.nodes.length">No servers have reported in yet.</div>
          <template x-for="n in (data ? data.nodes : [])" :key="n.id">
            <div class="node">
              <div><div><span class="dot" :class="n.status"></span><strong x-text="n.host"></strong> <span class="tag" x-show="n.self">this server</span></div>
                <div class="muted small mono" x-text="n.role + ' · pid ' + n.pid + ' · v' + n.version"></div></div>
              <div><div class="rail" :class="{drift: n.drift}"><div class="fill" :style="'width:' + railPct(n) + '%'"></div><div class="tick" title="Current version"></div></div>
                <div class="rail-label"><span :class="n.drift ? 'text-warning fw-medium' : ''" x-text="n.drift ? 'config v' + n.configVersion + ' — ' + (data.dbConfigVersion - n.configVersion) + ' behind' : 'config v' + n.configVersion + ' — up to date'"></span></div></div>
              <div class="text-end small muted"><span x-text="n.status"></span><br><span x-text="'up ' + since(n.startedAt)"></span></div>
            </div>
          </template>
        </div>
        <div class="panel mt-3 p-3 small" x-show="data">
          <div class="fw-semibold mb-1">This server</div>
          <div class="muted">Applied <span class="mono" x-text="data?.thisNode.settingsStats.busApplied"></span> change(s) from the bus, <span class="mono" x-text="data?.thisNode.settingsStats.pollHeals"></span> healed by polling, <span class="mono" x-text="data?.thisNode.settingsStats.fullReloads"></span> full reload(s).</div>
        </div>
      </section>
    </template>


    <!-- Updates -->
    <template x-if="route === 'updates'">
      <section x-data="updatesPage">
        <div class="page-head"><h1>Updates</h1><p>Pull the latest code from git and restart servers. Every server keeps its own copy of the code, so update them one at a time and the load balancer keeps the others serving.</p></div>

        <div class="small muted mb-3" x-show="data">
          <span x-show="data?.restartMode === 'supervisor'">Restart makes the process exit, so it must run under systemd, PM2 or Docker with a restart policy, or it stays down.</span>
          <span x-show="data?.restartMode === 'self'">Restart starts a new copy of the process by itself. Under a supervisor, set the restart method in <a href="#/settings/updates">Settings</a>.</span>
        </div>

        <div class="panel mb-3">
          <div class="panel-h">Servers <label class="form-check mb-0 fw-normal small" x-show="can('system.restart')"><input class="form-check-input" type="checkbox" id="restart-after" x-model="restartAfter"> <span class="form-check-label" for="restart-after">Restart a server after updating it</span></label></div>
          <div class="empty" x-show="!data">Loading…</div>
          <div class="empty" x-show="data && !data.nodes.length">No servers have reported in yet.</div>
          <template x-for="n in (data ? data.nodes : [])" :key="n.id">
            <div class="upd">
              <div class="upd-main">
                <div><span class="dot" :class="n.status"></span><strong x-text="n.host"></strong> <span class="tag" x-show="n.self">this server</span><span class="tag" :class="state(n).tone" x-text="state(n).label"></span></div>
                <div class="muted small mono" x-text="running(n)"></div>
                <div class="small mt-1" :class="n.update?.status === 'failed' ? 'text-danger' : 'muted'" x-show="message(n)" x-text="message(n)" role="status"></div>
                <ul class="upd-log" x-show="incoming(n).length"><template x-for="c in incoming(n)" :key="c.sha"><li><span class="mono" x-text="c.sha"></span> <span x-text="c.subject"></span> <span class="muted" x-text="'· ' + c.author + ' · ' + ago(c.at)"></span></li></template></ul>
                <div class="small text-warning mt-1" x-show="notes(n)" x-text="notes(n)"></div>
                <div class="small muted mt-1" x-show="checkedAt(n)" x-text="checkedAt(n)"></div>
              </div>
              <div class="upd-actions">
                <button class="btn btn-sm btn-outline-secondary" :disabled="!actionable(n)" @click="check(n)">Check for updates</button>
                <button class="btn btn-sm btn-primary" :disabled="!actionable(n)" @click="update(n)">Update</button>
                <button class="btn btn-sm btn-outline-danger" x-show="can('system.restart')" :disabled="!actionable(n)" @click="restart(n)">Restart</button>
              </div>
            </div>
          </template>
        </div>

        <div class="panel">
          <div class="panel-h">Recent activity</div>
          <div class="empty" x-show="!history.length">Nothing yet. Checks, updates and restarts show up here.</div>
          <table class="table" x-show="history.length"><tbody><template x-for="e in history" :key="e.id">
            <tr><td x-text="describe(e)"></td><td x-text="e.actor"></td><td class="muted text-end text-nowrap" x-text="ago(e.at)"></td></tr></template></tbody></table>
        </div>
      </section>
    </template>

    <!-- Automation: Events -->
    <template x-if="route === 'events'">
      <section x-data="eventsPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Events</h1><p>Everything the platform (or a script Service) has emitted. A Webhook subscribes to one of these by name or pattern.</p></div>
        </div>
        <div class="btn-group mb-3" role="group" aria-label="Events view">

        </div>
        <template x-if="tab === 'log'">
          <div>
            <div class="d-flex gap-2 mb-2">
              <input class="form-control" style="max-width:20rem" placeholder="Filter by name prefix&hellip;" x-model="filterName" @keydown.enter="load()">

            </div>
            <div class="panel">
              <div class="empty" x-show="loaded && !events.length">Nothing logged yet.</div>
              <table class="table" x-show="events.length"><thead><tr><th>Name</th><th>Payload</th><th></th></tr></thead><tbody>
                <template x-for="e in events" :key="e.id"><tr>
                  <td class="mono small" x-text="e.name"></td>
                  <td class="muted small mono" x-text="JSON.stringify(e.payload)"></td>
                  <td class="muted small text-end" x-text="ago(e.at)"></td>
                </tr></template>
              </tbody></table>
            </div>
          </div>
        </template>
        <template x-if="tab === 'fire' && can('events.write')">
          <div class="panel p-3" style="max-width:40rem">
            <label class="form-label" for="ev-name">Event name</label>
            <input id="ev-name" class="form-control mono" placeholder="orders.created" x-model="fireName">
            <label class="form-label mt-2" for="ev-payload">Payload (JSON)</label>
            <textarea id="ev-payload" class="form-control mono" rows="6" spellcheck="false" x-codejar="{ mode: 'application/json', get: firePayload, set: (v) => (firePayload = v) }"></textarea>
            <div class="alert alert-danger mt-2" role="alert" x-show="fireError" x-text="fireError"></div>
            <button type="button" class="btn btn-primary mt-2" :disabled="fireBusy || !fireName.trim()" @click="fire()">Fire</button>
          </div>
        </template>
      </section>
    </template>

    <!-- Automation: Webhooks -->
    <template x-if="route === 'webhooks'">
      <div>
        <template x-for="v in webhooksViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="webhooksList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Webhooks</h1><p>HTTP callbacks that fire automatically when a matching event happens.</p></div>
                <a class="btn btn-primary" x-show="can('webhooks.write')" href="#/webhooks/new">New webhook</a>
              </div>
              <div class="panel">
                <div class="empty" x-show="loaded && !webhooks.length">No webhooks yet.</div>

                  <template x-for="w in webhooks" :key="w.id"><tr>
                    <td x-text="w.name"></td>
                    <td class="mono small" x-text="w.event"></td>
                    <td><span class="tag" :class="w.enabled ? 'ok' : 'warn'" x-text="w.enabled ? 'Enabled' : 'Disabled'"></span></td>
                    <td class="text-end text-nowrap">
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/webhooks/' + w.id">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('webhooks.write')" @click="remove(w)">Delete</button>
                    </td>
                  </tr></template>
                </tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="webhooksEditor(v.id)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New webhook' : name"></h1></div>
                <a href="#/webhooks" class="btn btn-outline-secondary">Back to webhooks</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <div class="row g-2">
                      <div class="col-md-6"><label class="form-label" for="wh-name">Name</label><input id="wh-name" class="form-control" maxlength="200" x-model="name"></div>
                      <div class="col-md-6"><label class="form-label" for="wh-event">Event pattern</label><input id="wh-event" class="form-control mono" placeholder="content.published or orders.*" x-model="event"></div>
                    </div>
                    <label class="form-label mt-2" for="wh-url">URL</label>
                    <input id="wh-url" class="form-control mono" placeholder="https://&hellip;" x-model="url">
                    <div class="help small muted mt-1">This URL is called exactly as given, with no restriction &mdash; the same trust level as a script Service.</div>
                    <div class="form-check mt-2"><input id="wh-enabled" class="form-check-input" type="checkbox" x-model="enabled"><label class="form-check-label small" for="wh-enabled">Enabled</label></div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="wh-secret">Signing secret</label>
                    <input id="wh-secret" type="password" class="form-control mono" autocomplete="new-password" x-model="secret" :placeholder="hasSecret ? 'Set — leave blank to keep it' : 'Optional — signs deliveries with X-CMS-Signature'">
                    <div class="help small muted mt-1" x-show="hasSecret">A secret is set. It is never shown again &mdash; type a new one to replace it.</div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Custom headers</div>
                    <template x-for="(h, i) in headers" :key="i">
                      <div class="row g-2 mb-2 align-items-center">
                        <div class="col-5"><input class="form-control form-control-sm mono" aria-label="Header name" placeholder="X-Example" x-model="h.name"></div>
                        <div class="col-6"><input class="form-control form-control-sm" aria-label="Header value" placeholder="value" x-model="h.value"></div>
                        <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeHeader(i)" aria-label="Remove header">&times;</button></div>
                      </div>
                    </template>
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="addHeader()">Add header</button>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Payload</div>
                    <div class="help small muted mb-2">Sent as the delivery's <code>payload</code>, merged under the real event's own data (the event's fields win). Also what "Send test" sends when set.</div>
                    <textarea class="form-control mono" rows="6" spellcheck="false" x-codejar="{ mode: 'application/json', get: payloadText, set: (v) => (payloadText = v) }"></textarea>
                  </div>

                  <div class="panel p-3 mb-3" x-show="!isNew">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <div class="panel-h mb-0">Recent deliveries</div>
                      <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="testBusy" @click="sendTest()">Send test</button>
                    </div>
                    <div class="empty small" x-show="!deliveries.length">No deliveries yet.</div>
                    <table class="table" x-show="deliveries.length"><thead><tr><th>Event</th><th>Status</th><th>Response</th><th></th></tr></thead><tbody>
                      <template x-for="d in deliveries" :key="d.id"><tr>
                        <td class="mono small" x-text="d.event"></td>
                        <td><span class="tag" :class="d.status === 'success' ? 'ok' : 'warn'" x-text="d.status"></span></td>
                        <td class="muted small" x-text="d.responseCode ?? d.error ?? ''"></td>
                        <td class="muted small text-end" x-text="ago(d.at)"></td>
                      </tr></template>
                    </tbody></table>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded">
                <span class="ms-auto"></span>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create webhook' : 'Save webhook'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Automation: Scheduler -->
    <template x-if="route === 'scheduler'">
      <div>
        <template x-for="v in schedulerViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="schedulerList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Scheduler</h1><p>Run a saved Service or fire a Webhook automatically, on an interval or a cron schedule.</p></div>
                <a class="btn btn-primary" x-show="can('scheduler.write')" href="#/scheduler/new">New task</a>
              </div>
              <div class="panel">
                <div class="empty" x-show="loaded && !tasks.length">No scheduled tasks yet.</div>
                <table class="table" x-show="tasks.length"><thead><tr><th>Name</th><th>Runs</th><th>Schedule</th><th>Last run</th><th></th><th></th></tr></thead><tbody>
                  <template x-for="t in tasks" :key="t.id"><tr>
                    <td x-text="t.name"></td>
                    <td class="muted small" x-text="(t.kind === 'service' ? 'Service: ' : 'Webhook: ') + t.target"></td>
                    <td class="mono small" x-text="describe(t)"></td>
                    <td class="muted small">
                      <span x-show="!t.lastRunAt">Never</span>
                      <span x-show="t.lastRunAt"><span class="tag" :class="t.lastStatus === 'ok' ? 'ok' : 'warn'" x-text="t.lastStatus"></span> <span x-text="ago(t.lastRunAt)"></span></span>
                    </td>
                    <td><span class="tag" :class="t.enabled ? 'ok' : 'warn'" x-text="t.enabled ? 'Enabled' : 'Disabled'"></span></td>
                    <td class="text-end text-nowrap">
                      <button class="btn btn-sm btn-outline-secondary" type="button" x-show="can('scheduler.write')" @click="runNow(t)">Run now</button>
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/scheduler/' + t.id">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('scheduler.write')" @click="remove(t)">Delete</button>
                    </td>
                  </tr></template>
                </tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="schedulerEditor(v.id)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New scheduled task' : name"></h1></div>
                <a href="#/scheduler" class="btn btn-outline-secondary">Back to Scheduler</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <div class="row g-2">
                      <div class="col-md-6"><label class="form-label" for="sc-name">Name</label><input id="sc-name" class="form-control" maxlength="200" x-model="name"></div>
                      <div class="col-md-6"><div class="form-check mt-4"><input id="sc-enabled" class="form-check-input" type="checkbox" x-model="enabled"><label class="form-check-label small" for="sc-enabled">Enabled</label></div></div>
                    </div>
                    <div class="row g-2 mt-1">
                      <div class="col-md-4"><label class="form-label" for="sc-kind">What to run</label>
                        <select id="sc-kind" class="form-select" x-model="kind" @change="target = ''"><option value="service">A Service</option><option value="webhook">A Webhook</option></select>
                      </div>
                      <div class="col-md-8">
                        <label class="form-label" for="sc-target">Target</label>
                        <template x-if="kind === 'service'">
                          <select id="sc-target" class="form-select" x-model="target"><option value="">Choose a Service&hellip;</option><template x-for="s in services" :key="s.slug"><option :value="s.slug" x-text="s.name + ' (' + s.slug + ')'"></option></template></select>
                        </template>
                        <template x-if="kind === 'webhook'">
                          <select id="sc-target" class="form-select" x-model="target"><option value="">Choose a webhook&hellip;</option><template x-for="w in webhooks" :key="w.id"><option :value="String(w.id)" x-text="w.name"></option></template></select>
                        </template>
                      </div>
                    </div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Schedule</div>
                    <div class="btn-group d-flex mb-3" role="group" aria-label="Schedule type">
                      <input type="radio" class="btn-check" id="sc-type-interval" value="interval" x-model="scheduleType" autocomplete="off">
                      <label class="btn btn-outline-secondary" for="sc-type-interval">Interval</label>
                      <input type="radio" class="btn-check" id="sc-type-cron" value="cron" x-model="scheduleType" autocomplete="off">
                      <label class="btn btn-outline-secondary" for="sc-type-cron">Cron expression</label>
                    </div>
                    <template x-if="scheduleType === 'interval'">
                      <div class="row g-2 align-items-end">
                        <div class="col-4"><label class="form-label" for="sc-every-value">Every</label><input id="sc-every-value" type="number" min="1" class="form-control" x-model.number="everyValue"></div>
                        <div class="col-4"><select class="form-select" aria-label="Unit" x-model="everyUnit"><option value="minutes">Minutes</option><option value="hours">Hours</option><option value="days">Days</option></select></div>
                      </div>
                      <div class="help small muted mt-1">At least a minute &mdash; this runs real work, not a cheap check.</div>
                    </template>
                    <template x-if="scheduleType === 'cron'">
                      <div>
                        <label class="form-label" for="sc-cron">Cron expression</label>
                        <input id="sc-cron" class="form-control mono" placeholder="0 * * * *" x-model="cronExpr" @input="updateCronPreview()">
                        <div class="alert alert-danger mt-2 py-2" role="alert" x-show="cronError" x-text="cronError"></div>
                        <div class="help small muted mt-1" x-show="cronPreview.length">
                          Next runs: <template x-for="(t, i) in cronPreview" :key="i"><span x-text="new Date(t).toLocaleString() + (i < cronPreview.length - 1 ? '; ' : '')"></span></template>
                        </div>
                      </div>
                    </template>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Parameters</div>
                    <div class="help small muted mb-2">For a Service: its query parameters. For a Webhook: merged into the delivery's payload. A JSON object; leave as <code>{}</code> for none.</div>
                    <textarea class="form-control mono" rows="5" spellcheck="false" x-codejar="{ mode: 'application/json', get: paramsText, set: (v) => (paramsText = v) }"></textarea>
                  </div>

                  <div class="panel p-3 mb-3" x-show="!isNew">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <div class="panel-h mb-0">Last run</div>
                      <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="runBusy" @click="runNow()">Run now</button>
                    </div>
                    <div class="empty small" x-show="!lastRunAt">Never run yet.</div>
                    <div x-show="lastRunAt">
                      <span class="tag" :class="lastStatus === 'ok' ? 'ok' : 'warn'" x-text="lastStatus"></span>
                      <span class="muted small" x-text="lastRunAt ? ago(lastRunAt) : ''"></span>
                      <div class="alert alert-danger mt-2 py-2" role="alert" x-show="lastError" x-text="lastError"></div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded">
                <span class="ms-auto"></span>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create task' : 'Save task'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Content: a list of one type, or the editor for one entry -->
    <template x-if="route === 'content'">
      <div>
        <template x-for="v in contentViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="contentList(v.type)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2"><div><h1 x-text="type.plural"></h1><p x-text="'Every ' + type.label.toLowerCase() + ', newest changes first.'"></p></div>
                <a class="btn btn-primary" x-show="type.can.write" :href="'#/content/' + typeId + '/new'" x-text="'New ' + type.label.toLowerCase()"></a></div>
              <div class="d-flex gap-2 mb-3 flex-wrap">
                <input class="form-control" style="max-width:18rem" placeholder="Search titles" aria-label="Search titles" x-model="q" @input.debounce.300ms="load(true)">
                <select class="form-select" style="max-width:12rem" aria-label="Filter by status" x-model="status" @change="load(true)"><option value="">All statuses</option><option value="draft">Draft</option><option value="scheduled">Scheduled</option><option value="published">Published</option><option value="archived">Archived</option></select>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="panel">
                <div class="empty" x-show="loaded && !entries.length">Nothing here yet.</div>
                <table class="table" x-show="entries.length"><thead><tr><th>Title</th><th>Status</th><th>By</th><th>Changed</th></tr></thead><tbody>
                  <template x-for="e in entries" :key="e.id"><tr>
                    <td><a :href="'#/content/' + typeId + '/' + e.id" :style="'padding-left:' + (depth(e) * 1.25) + 'rem'" x-text="e.title"></a><div class="muted small mono" :style="'padding-left:' + (depth(e) * 1.25) + 'rem'" x-text="'/' + e.path"></div></td>
                    <td><span class="tag" :class="e.status === 'published' ? 'ok' : (e.status === 'scheduled' ? 'warn' : '')" x-text="statusLabel(e)"></span></td>
                    <td class="muted" x-text="e.author || '–'"></td>
                    <td class="muted text-nowrap" x-text="ago(e.updatedAt)"></td>
                  </tr></template></tbody></table>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3" x-show="total > limit">
                <button class="btn btn-outline-secondary" :disabled="offset === 0" @click="prev()">Newer</button>
                <span class="muted small" x-text="(offset + 1) + '–' + Math.min(offset + limit, total) + ' of ' + total"></span>
                <button class="btn btn-outline-secondary" :disabled="offset + limit >= total" @click="next()">Older</button>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="contentEditor(v.type, v.id)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2"><div><h1 x-text="isNew ? 'New ' + type.label.toLowerCase() : (entry ? entry.title : 'Loading…')"></h1><p x-show="!isNew && entry" x-text="'Version ' + (entry ? entry.version : '') + ' · saved ' + (entry ? ago(entry.updatedAt) : '')"></p></div>
                <a :href="'#/content/' + typeId" class="btn btn-outline-secondary">Back to the list</a></div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="!loading">
                <div class="col-lg-8">
                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="e-title">Title</label>
                    <input id="e-title" class="form-control form-control-lg" maxlength="255" :class="{'is-invalid': errors.title}" x-model="form.title" @input="slugFromTitle($event.target.value)">
                    <div class="invalid-feedback d-block" x-show="errors.title" x-text="errors.title"></div>
                  </div>

                  <template x-for="f in type.fields" :key="f.key">

                      <label class="form-label fw-semibold" :for="'f-' + f.key" x-text="f.label"></label>
                      <div class="help small muted mb-1" x-show="f.help" x-text="f.help"></div>
                      <template x-if="f.type === 'string'"><input :id="'f-' + f.key" class="form-control" :maxlength="f.max || 500" x-model="form.data[f.key]"></template>
                      <template x-if="f.type === 'text'"><textarea :id="'f-' + f.key" rows="3" class="form-control" :maxlength="f.max || 20000" x-model="form.data[f.key]"></textarea></template>
                      <template x-if="f.type === 'number'"><input :id="'f-' + f.key" type="number" class="form-control" style="max-width:10rem" x-model.number="form.data[f.key]"></template>
                      <template x-if="f.type === 'boolean'"><div class="form-check form-switch"><input :id="'f-' + f.key" type="checkbox" class="form-check-input" role="switch" x-model="form.data[f.key]"><label class="form-check-label muted" :for="'f-' + f.key" x-text="form.data[f.key] ? 'Yes' : 'No'"></label></div></template>
                      <template x-if="f.type === 'select'"><select :id="'f-' + f.key" class="form-select" x-model="form.data[f.key]"><template x-for="o in f.options" :key="o.value"><option :value="o.value" x-text="o.label"></option></template></select></template>
                      <template x-if="f.type === 'list'"><textarea :id="'f-' + f.key" rows="3" class="form-control mono" placeholder="One per line" :value="listText(f)" @input="setList(f, $event.target.value)"></textarea></template>
                      <template x-if="f.type === 'media'">
                        <div class="d-flex align-items-center gap-3">
                          <span class="ph thumb" x-show="form.data[f.key]"><img x-show="media[form.data[f.key]] && media[form.data[f.key]].kind === 'image'" :src="thumb(media[form.data[f.key]])" alt=""></span>
                          <span class="muted small" x-show="form.data[f.key]" x-text="media[form.data[f.key]] ? media[form.data[f.key]].filename : ''"></span>
                          <button type="button" class="btn btn-outline-secondary btn-sm" @click="pick(f)" x-text="form.data[f.key] ? 'Change' : 'Choose from the library'"></button>
                          <button type="button" class="btn btn-link btn-sm" x-show="form.data[f.key]" @click="form.data[f.key] = null">Remove</button>
                        </div>
                      </template>
                      <template x-if="f.type === 'blocks'">
                        <div class="blocks">
                          <template x-for="(b, i) in blocksOf(f)" :key="b._id">
                            <div class="block">

                                <span class="tag" x-text="b.type"></span>

                                <button type="button" class="btn btn-sm btn-link" @click="moveBlock(f, i, 1)" aria-label="Move down" title="Move down"><i class="bi bi-arrow-down"></i></button>
                                <button type="button" class="btn btn-sm btn-link text-danger" @click="removeBlock(f, i)" aria-label="Remove block" title="Remove"><i class="bi bi-x-lg"></i></button>
                              </div>
                              <template x-if="b.type === 'paragraph'">
                                <div>
                                  <div class="rich-tools"><button type="button" class="btn btn-sm btn-outline-secondary" @mousedown.prevent="format('bold')" aria-label="Bold"><i class="bi bi-type-bold"></i></button> <button type="button" class="btn btn-sm btn-outline-secondary" @mousedown.prevent="format('italic')" aria-label="Italic"><i class="bi bi-type-italic"></i></button> <button type="button" class="btn btn-sm btn-outline-secondary" @mousedown.prevent="link()" aria-label="Link"><i class="bi bi-link-45deg"></i></button></div>
                                  <div class="rich form-control" contenteditable="true" role="textbox" aria-label="Paragraph text" x-init="initRich($el, b)" @input="syncRich($el, b)"></div>
                                </div>
                              </template>
                              <template x-if="b.type === 'header'"><div class="d-flex gap-2"><input class="form-control" aria-label="Heading text" placeholder="Heading" maxlength="500" x-model="b.data.text"><select class="form-select" style="max-width:6rem" aria-label="Heading level" x-model.number="b.data.level"><option value="1">H1</option><option value="2">H2</option><option value="3">H3</option><option value="4">H4</option></select></div></template>
                              <template x-if="b.type === 'list'"><div><select class="form-select mb-1" style="max-width:12rem" aria-label="List style" x-model="b.data.style"><option value="unordered">Bulleted</option><option value="ordered">Numbered</option></select><textarea class="form-control" rows="4" aria-label="List items" placeholder="One item per line" :value="blockLines(b)" @input="setBlockLines(b, $event.target.value)"></textarea></div></template>
                              <template x-if="b.type === 'quote'"><div><textarea class="form-control mb-1" rows="3" aria-label="Quote" placeholder="Quote" x-model="b.data.text"></textarea><input class="form-control" aria-label="Who said it" placeholder="Who said it (optional)" x-model="b.data.caption"></div></template>
                              <template x-if="b.type === 'code'"><textarea class="form-control mono" rows="6" aria-label="Code" x-codejar="{ get: b.data.code, set: (v) => (b.data.code = v) }"></textarea></template>
                              <template x-if="b.type === 'delimiter'"><hr class="my-2"></template>
                              <template x-if="b.type === 'image'">
                                <div class="d-flex gap-3 flex-wrap">
                                  <span class="ph thumb"><img x-show="b.data.mediaId && media[b.data.mediaId]" :src="thumb(media[b.data.mediaId])" alt=""></span>
                                  <div class="flex-grow-1" style="min-width:14rem">
                                    <button type="button" class="btn btn-outline-secondary btn-sm mb-2" @click="pickBlockImage(b)" x-text="b.data.mediaId ? 'Change image' : 'Choose an image'"></button>
                                    <input class="form-control mb-1" aria-label="Image description for screen readers" placeholder="Describe the image (alt text)" maxlength="500" x-model="b.data.alt">
                                    <input class="form-control" aria-label="Caption" placeholder="Caption (optional)" maxlength="500" x-model="b.data.caption">
                                  </div>
                                </div>
                              </template>
                            </div>
                          </template>
                          <div class="block-add"><span class="muted small me-1">Add:</span>
                            <template x-for="t in ['paragraph','header','list','quote','image','code','delimiter']" :key="t"><button type="button" class="btn btn-sm btn-outline-secondary" @click="addBlock(f, t)" x-text="t"></button></template></div>
                        </div>
                      </template>
                      <div class="invalid-feedback d-block" x-show="errors['data.' + f.key]" x-text="errors['data.' + f.key]"></div>
                    </div>
                  </template>
                </div>

                <div class="col-lg-4">
                  <div class="panel p-3 mb-3 sticky-side">
                    <div class="fw-semibold mb-2">Publishing</div>
                    <label class="form-label" for="e-status">Status</label>
                    <select id="e-status" class="form-select mb-2" :disabled="!canPublish" x-model="form.status"><template x-for="o in statuses" :key="o[0]"><option :value="o[0]" :selected="o[0] === form.status" x-text="o[1]"></option></template></select>
                    <div class="small muted mb-2" x-show="!canPublish">You can save drafts. Someone with the Publish permission makes them live.</div>
                    <div class="mb-2" x-show="form.status === 'scheduled'"><label class="form-label" for="e-when">Go live at</label><input id="e-when" type="datetime-local" class="form-control" :class="{'is-invalid': errors.publishAt}" x-model="form.publishAt"><div class="invalid-feedback d-block" x-show="errors.publishAt" x-text="errors.publishAt"></div></div>
                    <label class="form-label" for="e-slug">Address</label>
                    <input id="e-slug" class="form-control mono mb-1" :class="{'is-invalid': errors.slug}" x-model="form.slug" @input="slugTouched = true" placeholder="made from the title">
                    <div class="invalid-feedback d-block" x-show="errors.slug" x-text="errors.slug"></div>
                    <div class="small muted mono mb-2" x-text="addressPreview"></div>
                    <div class="mb-2" x-show="type.hierarchical"><label class="form-label" for="e-parent">Parent page</label><select id="e-parent" class="form-select" x-model.number="form.parentId"><option :value="null">None (top level)</option><template x-for="p in parents" :key="p.id"><option :value="p.id" :selected="p.id === form.parentId" x-text="'/' + p.path"></option></template></select></div>
                    <div class="d-flex gap-2 flex-wrap mt-3">
