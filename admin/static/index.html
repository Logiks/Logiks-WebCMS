        </div>
        <div class="row g-3" x-show="loaded">
          <div class="col-lg-3">
            <div class="panel">
              <div class="panel-h">Files</div>
              <div class="te-files">
                <template x-for="f in files" :key="f.path">
                  <button type="button" class="te-file" :class="{active: f.path === path}" @click="select(f.path)"><span class="mono small" x-text="f.path"></span><span class="muted small" x-text="bytes(f.size)"></span></button>
                </template>
              </div>
              <div class="p-2 border-top" x-show="editable && can('themes.edit')">
                <form class="d-flex gap-1" @submit.prevent="create()"><input class="form-control form-control-sm mono" aria-label="New file path" placeholder="components/banner.html" x-model="newPath"><button class="btn btn-sm btn-outline-secondary">Add</button></form>
                <label class="btn btn-sm btn-outline-secondary w-100 mt-2 mb-0">Upload image or font to assets/<input type="file" hidden accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.ico,.svg,.woff,.woff2,.ttf" @change="upload($event.target.files[0]); $event.target.value = ''"></label>
              </div>
            </div>
          </div>
          <div class="col-lg-9">
            <div class="panel" x-show="path">
              <div class="panel-h d-flex gap-2 align-items-center flex-wrap"><span class="mono" x-text="path"></span><span class="tag warn" x-show="dirty">Unsaved</span>
                <span class="ms-auto"></span>
                <button class="btn btn-sm btn-outline-danger" x-show="editable && can('themes.edit') && !required" @click="del()">Delete file</button>
                <button class="btn btn-sm btn-primary" x-show="editable && can('themes.edit') && file && file.text" :disabled="saving || !dirty" @click="save()" x-text="saving ? 'Checking and saving…' : 'Save file'"></button>
              </div>
              <template x-if="file && file.text"><textarea id="te-content" class="form-control mono border-0 rounded-0" rows="28" spellcheck="false" aria-label="File content" x-codejar="{ mode: /\.css$/.test(path) ? 'css' : /\.js$/.test(path) ? 'javascript' : /\.json$/.test(path) ? 'application/json' : 'htmlmixed', get: content, set: (v) => (content = v), readOnly: !editable || !can('themes.edit') }"></textarea></template>
              <div class="p-3 muted" x-show="file && !file.text">A binary file (<span x-text="bytes(file?.size || 0)"></span>). Reach it from a template with <span class="mono" x-text="`{{ '${path.replace(/^assets\//, '')}' | asset_url }}`"></span>.</div>
            </div>
            <div class="panel p-4 muted" x-show="!path">Choose a file on the left.</div>
          </div>
        </div>
      </section>
    </template>

    <!-- Menus -->
    <template x-if="route === 'menus'">
      <section x-data="menusPage">
        <div class="page-head"><h1>Menus</h1><p>Navigation your theme shows, like the main menu and the footer. Pages you link stay correct if you rename them.</p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="d-flex gap-2 flex-wrap align-items-center mb-3">
          <template x-for="m in menus" :key="m.name"><button type="button" class="btn btn-sm" :class="name === m.name ? 'btn-primary' : 'btn-outline-secondary'" @click="select(m.name)" x-text="m.title || m.name"></button></template>
          <form class="d-flex gap-1" @submit.prevent="create()"><input class="form-control form-control-sm" style="width:9rem" placeholder="New menu name" aria-label="New menu name" x-model="newName"><button class="btn btn-sm btn-outline-secondary">Add menu</button></form>
        </div>
        <div class="panel" x-show="name">
          <div class="panel-h">Items in “<span x-text="name"></span>” <span class="muted small fw-normal">Themes reach it as <span class="mono" x-text="'menus.' + name"></span></span></div>
          <div class="empty" x-show="!items.length">No items yet.</div>
          <template x-for="row in flat" :key="row.item._id">
            <div class="frow" :style="'padding-left:' + (1.25 + row.depth * 1.5) + 'rem'" style="grid-template-columns: 1fr">
              <div class="d-flex gap-2 flex-wrap align-items-center">
                <select class="form-select" style="width:8rem" aria-label="Link to" x-model="row.item.kind"><option value="entry" x-show="pages.length">A page</option><option value="url">An address</option></select>
                <select class="form-select" style="max-width:16rem" aria-label="Page" x-show="row.item.kind === 'entry'" x-model.number="row.item.entryId"><template x-for="p in pages" :key="p.id"><option :value="p.id" :selected="p.id === row.item.entryId" x-text="'/' + p.path"></option></template></select>
                <input class="form-control" style="max-width:16rem" aria-label="Address" placeholder="/about or https://…" x-show="row.item.kind === 'url'" x-model="row.item.url">
                <input class="form-control" style="max-width:14rem" aria-label="Label" placeholder="Label" x-model="row.item.label">
                <button type="button" class="btn btn-sm btn-link" @click="move(row, -1)" aria-label="Move up"><i class="bi bi-arrow-up"></i></button>
                <button type="button" class="btn btn-sm btn-link" @click="move(row, 1)" aria-label="Move down"><i class="bi bi-arrow-down"></i></button>
                <button type="button" class="btn btn-sm btn-link" x-show="row.depth < 2" @click="add(row.item.children)">Add sub-item</button>
                <button type="button" class="btn btn-sm btn-link text-danger" @click="remove(row)" aria-label="Remove item"><i class="bi bi-x-lg"></i></button>
              </div>
            </div>
          </template>
          <div class="p-3 d-flex gap-2"><button type="button" class="btn btn-outline-secondary" @click="add()">Add item</button><span class="ms-auto"></span><button type="button" class="btn btn-outline-danger" @click="del()">Delete menu</button><button type="button" class="btn btn-primary" :disabled="busy" @click="save()" x-text="busy ? 'Saving…' : 'Save menu'"></button></div>
        </div>
      </section>
    </template>

    <!-- Translations -->
    <template x-if="route === 'locales'">
      <section x-data="localesPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Translations</h1><p>The words your site and its theme show to visitors, in each language. What you type here is your own wording: it wins over the theme, and switching themes keeps it.</p></div>
          <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary" href="/api/admin/site/locales/export">Export .zip</a>
            <label class="btn btn-outline-secondary mb-0" x-show="can('locales.write')" :class="{disabled: busy}">Import .zip<input type="file" hidden accept=".zip,application/zip" @change="importZip($event.target.files[0]); $event.target.value = ''"></label>
          </div>
        </div>
        <div class="panel p-3 mb-3 d-flex gap-2 flex-wrap align-items-center">
          <label class="me-1" for="lang">Language</label>
          <select id="lang" class="form-select" style="max-width:16rem" :value="code" @change="open($event.target.value)"><template x-for="l in languages" :key="l.code"><option :value="l.code" :selected="l.code === code" x-text="l.name + ' (' + l.code + ')'"></option></template></select>
          <span class="mx-2 muted">or</span>
          <input class="form-control" style="max-width:8rem" aria-label="New language code" placeholder="fr" x-model="newCode" @keydown.enter.prevent="addLanguage()">
          <button class="btn btn-outline-secondary" type="button" @click="addLanguage()">Add language</button>
          <div class="text-danger small w-100" role="alert" x-show="error" x-text="error"></div>
        </div>
        <div class="panel">
          <div class="panel-h d-flex gap-3 align-items-center flex-wrap">
            <span x-text="name || 'Translations'"></span>
            <input class="form-control form-control-sm" style="max-width:14rem" aria-label="Filter" placeholder="Filter" x-model="filter">
            <div class="form-check mb-0"><input id="only-missing" class="form-check-input" type="checkbox" x-model="onlyMissing"><label class="form-check-label small" for="only-missing">Only missing (<span x-text="missing"></span>)</label></div>
          </div>
          <div class="empty" x-show="loaded && !entries.length">This site has no translatable text yet.</div>
          <table class="table" x-show="entries.length"><thead><tr><th>Text</th><th>Default language</th><th>Theme</th><th>Site default</th><th>Your wording</th></tr></thead><tbody>
            <template x-for="e in shown" :key="e.key"><tr>
              <td class="mono small" x-text="e.key"></td>
              <td class="muted" x-text="e.reference ?? '–'"></td>
              <td class="muted" x-text="e.theme ?? '–'"></td>
              <td class="muted" x-text="e.shipped ?? '–'"></td>
              <td><input class="form-control form-control-sm" :aria-label="'Your wording for ' + e.key" :placeholder="e.shipped ?? e.theme ?? e.reference ?? ''" x-model="e.edit"></td>
            </tr></template></tbody></table>
          <div class="p-3 d-flex gap-2 align-items-center" x-show="can('locales.write')">
            <button class="btn btn-primary" :disabled="busy || !dirty" @click="save()">Save translations</button>
            <span class="muted small" x-show="dirty" x-text="dirty + ' changed'"></span>
          </div>
        </div>
      </section>
    </template>

    <!-- Redirects -->
    <template x-if="route === 'redirects'">
      <section x-data="redirectsPage">
        <div class="page-head"><h1>Redirects</h1><p>Send visitors from an old address to a new one. Use a permanent (301) redirect when a page has moved for good.</p></div>
        <form class="panel p-3 mb-3 d-flex gap-2 flex-wrap align-items-start" @submit.prevent="add()">
          <input class="form-control" style="max-width:16rem" aria-label="Old address" placeholder="/old-page" required x-model="form.from">
          <span class="align-self-center">→</span>
          <input class="form-control" style="max-width:20rem" aria-label="New address" placeholder="/new-page or https://…" required x-model="form.to">
          <select class="form-select" style="max-width:12rem" aria-label="Type" x-model="form.status"><option value="301">Permanent (301)</option><option value="302">Temporary (302)</option><option value="308">Permanent, keep method (308)</option><option value="307">Temporary, keep method (307)</option></select>
          <button class="btn btn-primary">Add redirect</button>
          <div class="text-danger small w-100" role="alert" x-show="error" x-text="error"></div>
        </form>
        <div class="panel">
          <div class="empty" x-show="!redirects.length">No redirects yet.</div>
          <table class="table" x-show="redirects.length"><thead><tr><th>From</th><th>To</th><th>Type</th><th></th></tr></thead><tbody>
            <template x-for="r in redirects" :key="r.id"><tr><td class="mono" x-text="r.from"></td><td class="mono" x-text="r.to"></td><td x-text="r.status"></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" @click="remove(r)">Remove</button></td></tr></template></tbody></table>
        </div>
      </section>
    </template>

    <!-- Contact messages -->
    <template x-if="route === 'messages'">
      <section x-data="messagesPage">
        <div class="page-head"><h1>Messages</h1><p>Sent through the contact form on your site. They are also emailed when email is set up.</p></div>
        <div class="panel">
          <div class="empty" x-show="loaded && !messages.length">No messages yet.</div>
          <template x-for="m in messages" :key="m.id">
            <div class="frow" style="grid-template-columns: 1fr auto">
              <div><strong x-text="m.name"></strong> <a :href="'mailto:' + m.email" x-text="m.email"></a> <span class="muted small" x-text="ago(m.at)"></span> <span class="tag" x-show="!m.emailed">Not emailed</span>
                <div class="pre" x-text="m.message"></div><div class="muted small" x-show="m.page" x-text="'From ' + m.page"></div></div>
              <div><button class="btn btn-sm btn-outline-danger" @click="remove(m)">Delete</button></div>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- Database (System → Database, D-047) -->
    <template x-if="route === 'dbms'">
      <section x-data="dbmsPage">
        <div class="page-head"><h1>Database</h1><p>Browse and edit tables directly. The SQL console can run anything the database allows — no undo.</p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>

        <div class="btn-group mb-3" role="group" aria-label="Database view">
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'tables'}" @click="tab = 'tables'">Tables</button>
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'table'}" x-show="selectedTable" @click="tab = 'table'" x-text="selectedTable"></button>
          <button type="button" class="btn btn-outline-secondary" :class="{active: tab === 'console'}" x-show="can('dbms.query')" @click="openConsole()">SQL console</button>
        </div>

        <template x-if="tab === 'tables'">
          <div>
            <div class="d-flex justify-content-end mb-2" x-show="can('dbms.write')">
              <button type="button" class="btn btn-outline-secondary btn-sm" @click="showCreateForm = !showCreateForm" x-text="showCreateForm ? 'Cancel' : 'New table'"></button>
            </div>
            <div class="panel p-3 mb-3" x-show="showCreateForm">
              <div class="row g-2">
                <div class="col-md-6"><label class="form-label" for="nt-name">Table name</label><input id="nt-name" class="form-control mono" x-model="newTable.name"></div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3 mb-2"><label class="form-label mb-0">Columns</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addColumn()">Add column</button></div>
              <template x-for="(c, i) in newTable.columns" :key="i">
                <div class="row g-2 mb-2 align-items-center">
                  <div class="col-3"><input class="form-control form-control-sm mono" aria-label="Column name" placeholder="name" x-model="c.name"></div>
                  <div class="col-2"><select class="form-select form-select-sm" aria-label="Column type" x-model="c.type"><option value="string">Short text</option><option value="text">Long text</option><option value="integer">Whole number</option><option value="bigInteger">Big whole number</option><option value="boolean">On/off</option><option value="float">Decimal</option><option value="json">JSON (text)</option></select></div>
                  <div class="col-2 form-check"><input class="form-check-input" type="checkbox" :id="'pk-' + i" x-model="c.primaryKey"><label class="form-check-label small" :for="'pk-' + i">Primary key</label></div>
                  <div class="col-2 form-check" x-show="c.primaryKey"><input class="form-check-input" type="checkbox" :id="'ai-' + i" x-model="c.autoIncrement"><label class="form-check-label small" :for="'ai-' + i">Auto-increment</label></div>
                  <div class="col-2"><input class="form-control form-control-sm" aria-label="Default value" placeholder="Default" x-model="c.default" x-show="!(c.primaryKey && c.autoIncrement)"></div>
                  <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeColumn(i)" aria-label="Remove column">×</button></div>
                </div>
              </template>
              <div class="help small muted mt-1">No date/time type on purpose — this platform stores every timestamp as milliseconds in a big whole number.</div>
              <button type="button" class="btn btn-primary mt-2" :disabled="busy || !newTable.name || !newTable.columns.length" @click="createTable()">Create table</button>
            </div>

            <div class="panel">
              <div class="empty" x-show="loaded && !tables.length">No tables.</div>
              <table class="table" x-show="tables.length"><thead><tr><th>Name</th><th></th><th></th></tr></thead><tbody>
                <template x-for="t in tables" :key="t.name"><tr>
                  <td class="mono"><a href="#" @click.prevent="openTable(t.name)" x-text="t.name"></a></td>
                  <td class="muted small" x-text="t.view ? 'View' : ''"></td>
                  <td class="text-end"><button class="btn btn-sm btn-outline-danger" type="button" x-show="can('dbms.write') && !t.view" @click="dropTable(t.name)">Drop</button></td>
                </tr></template>
              </tbody></table>
            </div>
          </div>
        </template>

        <template x-if="tab === 'table' && tableInfo">
          <div>
            <div class="panel mb-3">
              <div class="panel-h">Structure</div>
              <table class="table mb-0"><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th><th></th></tr></thead><tbody>
                <template x-for="c in tableInfo.columns" :key="c.name"><tr>
                  <td class="mono small" x-text="c.name"></td>
                  <td class="muted small" x-text="c.type"></td>
                  <td class="muted small" x-text="c.nullable ? 'Yes' : 'No'"></td>
                  <td class="muted small" x-text="c.default ?? '–'"></td>
                  <td><span class="tag ok" x-show="c.primaryKey">Primary key</span> <span class="tag" x-show="c.autoIncrement">Auto-increment</span></td>
                </tr></template>
              </tbody></table>
              <div class="p-2 small muted" x-show="tableInfo.indexes.length">Indexes: <template x-for="idx in tableInfo.indexes" :key="idx.name"><span class="mono me-3" x-text="idx.name + ' (' + idx.columns.join(', ') + (idx.unique ? ', unique' : '') + ')'"></span></template></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="muted small" x-text="rowsTotal + ' record' + (rowsTotal === 1 ? '' : 's')"></span>
              <button class="btn btn-sm btn-primary" type="button" x-show="can('dbms.write') && !tableInfo.sensitive" @click="startNewRow()">Add record</button>
            </div>
            <div class="alert alert-warning" role="alert" x-show="tableInfo.sensitive">This table is only editable through the SQL console.</div>

            <div class="panel p-3 mb-3" x-show="editingRow">
              <div class="panel-h" x-text="editingRow === 'new' ? 'New record' : 'Edit record'"></div>
              <template x-for="c in (tableInfo?.columns || [])" :key="c.name">
                <div class="mb-2" x-show="!(editingRow !== 'new' && c.primaryKey)">
                  <label class="form-label small" x-text="c.name"></label>
                  <template x-if="/bool/i.test(c.type)"><div class="form-check"><input class="form-check-input" type="checkbox" x-model="editForm[c.name]"></div></template>
                  <template x-if="!/bool/i.test(c.type)"><input class="form-control form-control-sm" x-model="editForm[c.name]"></template>
                </div>
              </template>
              <div class="d-flex gap-2 mt-2">
                <button class="btn btn-primary btn-sm" type="button" :disabled="busy" @click="saveRow()">Save</button>
                <button class="btn btn-outline-secondary btn-sm" type="button" @click="cancelEdit()">Cancel</button>
              </div>
            </div>

            <div class="panel">
              <div class="empty" x-show="!rows.length">No records.</div>
              <div class="table-responsive" x-show="rows.length">
                <table class="table mb-0"><thead><tr>
                  <template x-for="c in tableInfo.columns" :key="c.name"><th><a href="#" @click.prevent="sortBy(c.name)" x-text="c.name + (sortCol === c.name ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '')"></a></th></template>
                  <th></th>
                </tr></thead><tbody>
                  <template x-for="(row, i) in rows" :key="i"><tr>
                    <template x-for="c in tableInfo.columns" :key="c.name"><td class="small" x-text="show(row[c.name])"></td></template>
                    <td class="text-end text-nowrap">
                      <button class="btn btn-sm btn-outline-secondary" type="button" x-show="can('dbms.write') && !tableInfo.sensitive" @click="startEditRow(row)">Edit</button>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('dbms.write') && !tableInfo.sensitive" @click="deleteRow(row)">Delete</button>
                    </td>
                  </tr></template>
                </tbody></table>
              </div>
              <div class="d-flex justify-content-between align-items-center p-2" x-show="rowsPages > 1">
                <button class="btn btn-sm btn-outline-secondary" type="button" :disabled="rowsPage <= 1" @click="changePage(rowsPage - 1)">Newer</button>
                <span class="muted small" x-text="'Page ' + rowsPage + ' of ' + rowsPages"></span>
                <button class="btn btn-sm btn-outline-secondary" type="button" :disabled="rowsPage >= rowsPages" @click="changePage(rowsPage + 1)">Older</button>
              </div>
            </div>
          </div>
        </template>

        <template x-if="tab === 'console'">
          <div class="row g-3">
            <div class="col-lg-8">
              <label class="form-label" for="dbms-sql">SQL</label>
              <textarea id="dbms-sql" class="form-control mono" rows="8" spellcheck="false" x-codejar="{ mode: 'text/x-sql', get: sql, set: (v) => (sql = v) }"></textarea>
              <div class="d-flex gap-2 align-items-center mt-2">
                <button class="btn btn-primary" type="button" :disabled="consoleBusy || !sql.trim()" @click="runQuery()">Run</button>
                <input class="form-control form-control-sm" style="max-width:16rem" aria-label="Name this query to save it" placeholder="Save as…" x-model="newQueryName" @keydown.enter.prevent="saveCurrentQuery()">
                <button class="btn btn-outline-secondary btn-sm" type="button" @click="saveCurrentQuery()">Save query</button>
              </div>
              <div class="alert alert-danger mt-2" role="alert" x-show="consoleError" x-text="consoleError"></div>
              <template x-if="consoleResult">
                <div class="panel mt-3">
                  <div class="panel-h" x-text="consoleResult.rows.length ? consoleResult.rowCount + ' row(s)' : consoleResult.rowCount + ' row(s) affected'"></div>
                  <div class="table-responsive" x-show="consoleResult.rows.length">
                    <table class="table mb-0"><thead><tr><template x-for="k in Object.keys(consoleResult.rows[0] || {})" :key="k"><th x-text="k"></th></template></tr></thead><tbody>
                      <template x-for="(row, i) in consoleResult.rows" :key="i"><tr><template x-for="k in Object.keys(consoleResult.rows[0] || {})" :key="k"><td class="small" x-text="show(row[k])"></td></template></tr></template>
                    </tbody></table>
                  </div>
                </div>
              </template>
            </div>
            <div class="col-lg-4">
              <div class="panel">
                <div class="panel-h">Saved queries</div>
                <div class="empty small" x-show="!savedQueries.length">None yet.</div>
                <template x-for="q in savedQueries" :key="q.id">
                  <div class="frow" style="grid-template-columns: 1fr auto">
                    <div><a href="#" @click.prevent="loadSavedQuery(q)" x-text="q.name"></a></div>
                    <div><button class="btn btn-sm btn-outline-danger" type="button" @click="deleteSavedQuery(q)" aria-label="Delete saved query">×</button></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- Sitemap (System → Sitemap, D-053) -->
    <template x-if="route === 'sitemap'">
      <section x-data="sitemapPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Sitemap</h1><p>The list of addresses search engines read at /sitemap.xml. It is built from your site and content, and rebuilt whenever they change.</p></div>
          <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary" :href="sum.publicUrl" target="_blank" rel="noopener" x-show="sum.enabled">Open sitemap.xml</a>
            <a class="btn btn-outline-secondary" href="/api/admin/sitemap/download">Download</a>
            <button class="btn btn-outline-secondary" x-show="can('sitemap.manage')" :disabled="busy" @click="rebuild()">Rebuild now</button>
          </div>
        </div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="alert alert-warning" x-show="sum.noindex">This site asks search engines not to index it (Settings → Website), so /sitemap.xml isn’t published.</div>
        <div class="row g-3 mb-3" x-show="loaded">
          <div class="col-6 col-md-3"><div class="panel p-3"><div class="muted small">Addresses</div><div class="fs-3 fw-semibold" id="sm-total" x-text="sum.total"></div></div></div>
          <div class="col-6 col-md-3"><div class="panel p-3"><div class="muted small">Files</div><div class="fs-3 fw-semibold" x-text="sum.files"></div><div class="muted small" x-text="sum.files > 1 ? 'An index of ' + sum.files + ' parts' : 'One file'"></div></div></div>
          <div class="col-6 col-md-3"><div class="panel p-3"><div class="muted small">With images</div><div class="fs-3 fw-semibold" x-text="sum.withImages"></div></div></div>
          <div class="col-6 col-md-3"><div class="panel p-3"><div class="muted small">Built</div><div class="fs-5 fw-semibold" x-text="sum.generatedAt ? ago(sum.generatedAt) : '–'"></div><div class="muted small" x-show="sum.skipped" x-text="sum.skipped + ' left out by rules'"></div></div></div>
        </div>
        <div class="row g-3" x-show="loaded">
          <div class="col-lg-5">
            <div class="panel">
              <div class="panel-h">What it lists</div>
              <div class="p-3">
                <div class="form-check form-switch mb-2"><input id="sm-enabled" class="form-check-input" type="checkbox" role="switch" x-model="enabled" :disabled="!can('sitemap.manage')"><label class="form-check-label fw-semibold" for="sm-enabled">Publish sitemap.xml</label></div>
                <template x-for="o in toggles" :key="o.key">
                  <div class="form-check mb-1"><input :id="'sm-' + o.key" class="form-check-input" type="checkbox" x-model="v[o.key]" :disabled="!can('sitemap.manage')"><label class="form-check-label" :for="'sm-' + o.key" x-text="o.label"></label></div>
                </template>
                <div class="mt-3" x-show="types.length">
                  <div class="small fw-semibold mb-1">Content types to list</div>
                  <template x-for="t in types" :key="t.id">
                    <div class="form-check form-check-inline"><input :id="'sm-type-' + t.id" class="form-check-input" type="checkbox" :checked="!v.exclude_types.includes(t.id)" :disabled="!can('sitemap.manage')" @change="toggleType(t.id, $event.target.checked)"><label class="form-check-label" :for="'sm-type-' + t.id" x-text="t.plural || t.label || t.id"></label></div>
                  </template>
                </div>
                <div class="row g-2 mt-2">
                  <div class="col-6"><label class="form-label small" for="sm-freq">How often pages change</label><select id="sm-freq" class="form-select" x-model="v.default_changefreq" :disabled="!can('sitemap.manage')"><option value="">Don’t say</option><template x-for="f in freqs" :key="f"><option :value="f" x-text="f"></option></template></select></div>
                  <div class="col-6"><label class="form-label small" for="sm-prio">Priority</label><select id="sm-prio" class="form-select" x-model="v.default_priority" :disabled="!can('sitemap.manage')"><option value="">Don’t say</option><template x-for="p in prios" :key="p"><option :value="p" x-text="p"></option></template></select></div>
                  <div class="col-6"><label class="form-label small" for="sm-per">Addresses per file</label><input id="sm-per" type="number" min="100" max="50000" class="form-control" x-model.number="v.per_file" :disabled="!can('sitemap.manage')"></div>
                </div>
                <div class="form-text">Google ignores “how often” and “priority”; other search engines may read them.</div>
              </div>
            </div>
            <div class="panel mt-3">
              <div class="panel-h">Rules <span class="muted small fw-normal">The first rule that matches an address wins. * matches one part of the address, ** any number.</span></div>
              <div class="empty" x-show="!v.rules.length">No rules: every address is listed with the defaults.</div>
              <template x-for="(r, i) in v.rules" :key="i">
                <div class="p-2 border-bottom d-flex gap-1 flex-wrap align-items-center">
                  <input class="form-control form-control-sm mono" style="max-width:11rem" aria-label="Address pattern" placeholder="/blog/**" x-model="r.pattern" :disabled="!can('sitemap.manage')">
                  <select class="form-select form-select-sm" style="max-width:7.5rem" aria-label="What to do" :value="r.exclude ? 'exclude' : 'list'" @change="r.exclude = $event.target.value === 'exclude'" :disabled="!can('sitemap.manage')"><option value="list">List</option><option value="exclude">Leave out</option></select>
                  <select class="form-select form-select-sm" style="max-width:7.5rem" aria-label="How often it changes" x-show="!r.exclude" x-model="r.changefreq" :disabled="!can('sitemap.manage')"><option value="">Default</option><template x-for="f in freqs" :key="f"><option :value="f" x-text="f"></option></template></select>
                  <select class="form-select form-select-sm" style="max-width:6rem" aria-label="Priority" x-show="!r.exclude" x-model="r.priority" :disabled="!can('sitemap.manage')"><option value="">Default</option><template x-for="p in prios" :key="p"><option :value="p" x-text="p"></option></template></select>
                  <button type="button" class="btn btn-sm btn-link text-danger" x-show="can('sitemap.manage')" @click="v.rules.splice(i, 1)" aria-label="Remove rule"><i class="bi bi-x-lg"></i></button>
                </div>
              </template>
              <div class="p-2" x-show="can('sitemap.manage')"><button type="button" class="btn btn-sm btn-outline-secondary" @click="v.rules.push({pattern: '', exclude: false, changefreq: '', priority: ''})">Add rule</button></div>
            </div>
            <div class="panel mt-3">
              <div class="panel-h">Extra addresses</div>
              <div class="p-3"><textarea id="sm-extra" rows="3" class="form-control mono" placeholder="/landing/spring&#10;/downloads" aria-label="Extra addresses, one per line" :value="v.extra_urls.join('\n')" @input="v.extra_urls = $event.target.value.split('\n').map((x) => x.trim()).filter(Boolean)" :disabled="!can('sitemap.manage')"></textarea><div class="form-text">Addresses on this site that the sitemap wouldn’t find on its own, one per line.</div></div>
            </div>
            <div class="d-flex gap-2 mt-3 align-items-center" x-show="can('sitemap.manage')">
              <button class="btn btn-primary" :disabled="busy" @click="save()" x-text="busy ? 'Saving…' : 'Save changes'"></button>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="panel">
              <div class="panel-h d-flex gap-2 align-items-center flex-wrap"><span>Addresses</span>
                <template x-for="(n, src) in sum.bySource" :key="src"><span class="tag" x-text="label(src) + ': ' + n"></span></template>
                <input class="form-control form-control-sm ms-auto" style="max-width:12rem" aria-label="Filter addresses" placeholder="Filter" x-model="q" @input.debounce.300ms="load(0)">
              </div>
              <div class="empty" x-show="!sum.urls?.length">Nothing listed<span x-show="q"> matches that filter</span>.</div>
              <table class="table table-sm" x-show="sum.urls?.length"><thead><tr><th>Address</th><th>From</th><th>Changed</th><th>Hints</th></tr></thead><tbody>
                <template x-for="u in sum.urls" :key="u.path"><tr>
                  <td class="mono small"><a :href="u.loc" target="_blank" rel="noopener" x-text="u.path"></a> <i class="bi bi-image muted" x-show="u.image" title="Has an image"></i></td>
                  <td class="small muted" x-text="label(u.source)"></td>
                  <td class="small muted" x-text="u.lastmod ? new Date(u.lastmod).toLocaleDateString() : '–'"></td>
                  <td class="small muted" x-text="[u.changefreq, u.priority !== null ? u.priority.toFixed(1) : ''].filter(Boolean).join(' · ') || '–'"></td>
                </tr></template></tbody></table>
              <div class="p-2 d-flex gap-2 align-items-center" x-show="sum.matching > 100">
                <button class="btn btn-sm btn-outline-secondary" :disabled="offset === 0" @click="load(Math.max(0, offset - 100))">Previous</button>
                <span class="muted small" x-text="(offset + 1) + '–' + Math.min(offset + 100, sum.matching) + ' of ' + sum.matching"></span>
                <button class="btn btn-sm btn-outline-secondary" :disabled="offset + 100 >= sum.matching" @click="load(offset + 100)">Next</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </template>

    <!-- Libraries (System → Libraries, D-054) -->
    <template x-if="route === 'libraries'">
      <section x-data="librariesPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Libraries</h1><p>Add npm packages to your site — icon sets, fonts, CSS frameworks. Each server keeps its own copy, checked against the package’s published hash.</p></div>
          <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary" href="/api/admin/libraries/export">Export list</a>
            <label class="btn btn-outline-secondary mb-0" x-show="can('libraries.manage')" :class="{disabled: busy}">Import list<input type="file" hidden accept=".json,application/json" @change="importList($event.target.files[0]); $event.target.value = ''"></label>
          </div>
        </div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="alert alert-info small" x-show="loaded && !allowScripts">Library JavaScript is off, so only stylesheets, fonts and images are served. To use a package’s scripts, turn on “Let libraries add JavaScript” under Settings → Libraries.</div>
        <div class="alert alert-success small" x-show="report" x-text="report"></div>
        <div class="panel mb-3 p-3" x-show="can('libraries.manage')">
          <div class="fw-semibold mb-2">Add a package</div>
          <form class="d-flex gap-2 flex-wrap align-items-center" @submit.prevent="search()">
            <input id="lib-q" class="form-control" style="max-width:18rem" aria-label="Search packages" placeholder="Search npm, e.g. font awesome" x-model="q">
            <button class="btn btn-outline-secondary" :disabled="busy">Search</button>
            <span class="mx-1 muted">or</span>
            <input id="lib-name" class="form-control mono" style="max-width:16rem" aria-label="Package name" placeholder="@fortawesome/fontawesome-free" x-model="name">
            <input id="lib-version" class="form-control mono" style="max-width:7rem" aria-label="Version" placeholder="latest" x-model="version">
            <button type="button" class="btn btn-primary" :disabled="busy || !name" @click="install(name, version || 'latest')" x-text="busy ? 'Installing…' : 'Install'"></button>
            <div class="form-check ms-2"><input id="lib-autoload" class="form-check-input" type="checkbox" x-model="autoload"><label class="form-check-label" for="lib-autoload">Load on every page</label></div>
          </form>
          <table class="table table-sm mt-3 mb-0" x-show="results.length"><tbody>
            <template x-for="p in results" :key="p.name"><tr>
              <td><span class="mono fw-semibold" x-text="p.name"></span> <span class="muted small" x-text="p.version"></span><div class="muted small" x-text="p.description"></div></td>
              <td class="text-end text-nowrap"><span class="tag ok" x-show="p.installed" x-text="'Installed ' + p.installed"></span> <button class="btn btn-sm btn-outline-primary" :disabled="busy" @click="install(p.name, 'latest')" x-text="p.installed ? 'Install latest' : 'Install'"></button></td>
            </tr></template></tbody></table>
        </div>
        <div class="panel">
          <div class="panel-h">Installed</div>
          <div class="empty" x-show="loaded && !libraries.length">No libraries yet.</div>
          <table class="table" x-show="libraries.length"><thead><tr><th>Package</th><th>Loads on every page</th><th>Size</th><th></th></tr></thead><tbody>
            <template x-for="l in libraries" :key="l.name"><tr>
              <td><span class="mono fw-semibold" x-text="l.name"></span> <span class="tag" x-text="l.version"></span> <span class="muted small" x-show="l.license" x-text="l.license"></span>
                <div class="muted small" x-text="l.description"></div></td>
              <td><div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" role="switch" :aria-label="'Load ' + l.name + ' on every page'" :checked="l.autoload" :disabled="!can('libraries.manage')" @change="setAutoload(l, $event.target.checked)"></div>
                <div class="muted small mono" x-text="l.include.join(', ') || 'No files chosen'"></div></td>
              <td class="muted small text-nowrap" x-text="bytes(l.unpackedSize) + ' · ' + l.fileCount + ' files'"></td>
              <td class="text-end text-nowrap">
                <button class="btn btn-sm btn-outline-secondary" @click="configure(l)">Files</button>
                <button class="btn btn-sm btn-outline-secondary" x-show="can('libraries.manage')" :disabled="busy" @click="install(l.name, 'latest')">Update</button>
                <button class="btn btn-sm btn-outline-danger" x-show="can('libraries.manage')" @click="remove(l)">Remove</button>
              </td>
            </tr></template></tbody></table>
        </div>
        <div class="panel mt-3" x-show="current">
          <div class="panel-h d-flex gap-2 align-items-center flex-wrap"><span>Files of <span class="mono" x-text="current?.name"></span></span>
            <input class="form-control form-control-sm ms-auto" style="max-width:14rem" aria-label="Filter files" placeholder="Filter, e.g. .min.css" x-model="fileFilter">
            <button type="button" class="btn btn-sm btn-outline-secondary" @click="current = null">Close</button>
          </div>
          <div class="p-3 small">In a template: <span class="mono" x-text="snippet"></span></div>
          <div class="lib-files">
            <template x-for="f in shownFiles" :key="f.path">
              <div class="d-flex gap-2 align-items-center px-3 py-1 border-top">
                <input type="checkbox" class="form-check-input" :id="'lf-' + f.path" :checked="picked.includes(f.path)" :disabled="!can('libraries.manage') || !loadable(f.path)" @change="pick(f.path, $event.target.checked)">
                <label class="mono small flex-grow-1 mb-0" :for="'lf-' + f.path" x-text="f.path"></label>
                <span class="muted small" x-text="bytes(f.size)"></span>
              </div>
            </template>
          </div>
          <div class="p-3 d-flex gap-2 align-items-center" x-show="can('libraries.manage')">
            <button class="btn btn-primary" :disabled="busy" @click="saveFiles()">Save chosen files</button>
            <span class="muted small">Ticked stylesheets and scripts load on every page, in this order, when the library is set to load.</span>
          </div>
        </div>
      </section>
    </template>

    <!-- My account -->
    <template x-if="route === 'account'">
      <section x-data="accountPage">
        <div class="page-head"><h1>My account</h1><p>Your sign-in details, your password, and the devices you're signed in on.</p></div>

        <div class="panel mb-3">
          <div class="panel-h">Profile</div>
          <form class="frow" id="profile-form" @submit.prevent="saveName()">
            <div><label class="title" for="profile-name">Name</label></div>
            <div class="ctl d-flex gap-2 flex-wrap"><input id="profile-name" class="form-control" style="max-width:20rem" maxlength="128" required :class="{'is-invalid': nameError}" x-model="profile.name" autocomplete="name">
              <button class="btn btn-primary" :disabled="savingName || !nameDirty">Save name</button>
              <div class="invalid-feedback d-block" x-show="nameError" x-text="nameError"></div></div>
          </form>
          <div class="frow"><div><span class="title">Email</span></div><div class="ctl" x-text="me.email"></div></div>
          <div class="frow"><div><span class="title">Role</span></div><div class="ctl" x-text="me.role"></div></div>
        </div>

        <form class="panel mb-3" @submit.prevent="changePassword()" id="password-form">
          <div class="panel-h">Change password</div>
          <div class="frow">
            <div><label class="title" for="pw-current">Current password</label></div>
            <div class="ctl"><input id="pw-current" type="password" class="form-control" :class="{'is-invalid': errors.current}" autocomplete="current-password" required x-model="form.current"><div class="invalid-feedback d-block" x-show="errors.current" x-text="errors.current"></div></div>
          </div>
          <div class="frow">
            <div><label class="title" for="pw-new">New password</label><div class="help" x-text="'At least ' + minLength + ' characters.'"></div></div>
            <div class="ctl"><input id="pw-new" type="password" class="form-control" :class="{'is-invalid': errors.next}" autocomplete="new-password" required x-model="form.next"><div class="invalid-feedback d-block" x-show="errors.next" x-text="errors.next"></div></div>
          </div>
          <div class="frow">
            <div><label class="title" for="pw-confirm">Repeat the new password</label></div>
            <div class="ctl"><input id="pw-confirm" type="password" class="form-control" :class="{'is-invalid': errors.confirm}" autocomplete="new-password" required x-model="form.confirm"><div class="invalid-feedback d-block" x-show="errors.confirm" x-text="errors.confirm"></div></div>
          </div>
          <div class="frow">
            <div class="help">Changing your password signs you out on every other device.</div>
            <div class="ctl"><button class="btn btn-primary" :disabled="busy"><span x-text="busy ? 'Saving…' : 'Change password'"></span></button></div>
          </div>
        </form>

        <div class="panel">
          <div class="panel-h">Where you're signed in <button class="btn btn-sm btn-outline-secondary fw-normal" x-show="others > 0" @click="revokeOthers()">Sign out all other devices</button></div>
          <div class="empty" x-show="loaded && !sessions.length">No active sessions.</div>
          <table class="table" x-show="sessions.length"><thead><tr><th>Device</th><th>Address</th><th>Signed in</th><th>Last active</th><th></th></tr></thead><tbody>
            <template x-for="s in sessions" :key="s.id"><tr>
              <td><span x-text="s.device"></span> <span class="tag ok" x-show="s.current">This device</span></td>
              <td class="mono" x-text="s.ip || '–'"></td>
              <td class="muted" x-text="s.createdAt ? ago(s.createdAt) : '–'"></td>
              <td class="muted" x-text="s.lastSeen ? ago(s.lastSeen) : '–'"></td>
              <td class="text-end"><button class="btn btn-sm btn-outline-secondary" x-show="!s.current" @click="revoke(s)">Sign out</button></td>
            </tr></template></tbody></table>
        </div>
      </section>
    </template>

    <!-- System -->
    <template x-if="route === 'system'">
      <section x-data="systemPage">
        <div class="page-head"><h1>System</h1><p>Health of the pieces this site depends on, the cache, and background work. Shows the server that answered this page.</p></div>

        <div class="panel mb-3">
          <div class="panel-h">Components</div>
          <div class="empty" x-show="!data">Loading…</div>
          <table class="table" x-show="data"><tbody>
            <tr><td>Database</td><td class="mono" x-text="data?.components.database.kind"></td>
              <td><span class="tag" :class="data?.components.database.ok ? 'ok' : 'warn'" x-text="data?.components.database.ok ? 'Up · ' + data.components.database.ms + ' ms' : 'Down'"></span></td></tr>
            <tr><td>Redis</td><td class="muted" x-text="data?.components.redis ? 'Cache, sessions, queue, rate limits' : 'Not configured'"></td>
              <td><span class="tag" :class="data?.components.redis ? (data.components.redis.ok ? 'ok' : 'warn') : ''" x-text="data?.components.redis ? (data.components.redis.ok ? 'Up · ' + data.components.redis.ms + ' ms' : 'Down') : 'Off'"></span></td></tr>
            <tr><td>Background queue</td><td class="mono" x-text="data?.components.queue.driver"></td>
              <td><span class="tag" :class="data?.components.queue.ok ? 'ok' : 'warn'" x-text="data?.components.queue.ok ? 'Up' : 'Down'"></span></td></tr>
            <tr><td>Email</td><td class="muted" x-text="data?.components.mail.enabled ? 'Sending through ' + data.components.mail.transport : 'Not sending. Password reset is hidden.'"></td>
              <td><a href="#/settings/mail" class="small">Email settings</a></td></tr>
            <tr><td>Metrics</td><td class="muted" x-text="data?.components.metrics.enabled ? 'Served at /metrics with a bearer token' : 'Off'"></td>
              <td><a href="#/settings/system" class="small">System settings</a></td></tr>
          </tbody></table>
        </div>

        <div class="panel mb-3">
          <div class="panel-h">Cache <button class="btn btn-sm btn-outline-danger fw-normal" x-show="can('cache.flush')" @click="flush()">Flush cache</button></div>
          <div class="p-3 row g-3" x-show="data">
            <div class="col-6 col-md-3"><div class="muted small">Backend</div><div class="mono" x-text="data?.cache.backend"></div></div>
            <div class="col-6 col-md-3"><div class="muted small">Hit rate on this server</div><div class="mono" x-text="hitRate"></div></div>
            <div class="col-6 col-md-3"><div class="muted small">In memory</div><div class="mono" x-text="data?.cache.l1Entries + ' / ' + data?.cache.l1Max"></div></div>
            <div class="col-6 col-md-3"><div class="muted small">Invalidations</div><div class="mono" x-text="data?.cache.invalidations"></div></div>
            <div class="col-12 small warn" x-show="data && !data.cache.enabled"><span class="tag warn">Cache is turned off in settings</span></div>
          </div>
        </div>

        <div class="panel mb-3">
          <div class="panel-h">Background jobs</div>
          <div class="p-3 row g-3" x-show="data">
            <template x-for="k in ['waiting','active','delayed','completed','failed']" :key="k">
              <div class="col-6 col-md"><div class="muted small" x-text="k"></div><div class="bigver" style="font-size:1.6rem" :class="k === 'failed' && data?.components.queue.counts?.failed ? 'text-danger' : ''" x-text="data?.components.queue.counts?.[k] ?? 0"></div></div>
            </template>
          </div>
          <table class="table" x-show="data?.components.queue.scheduled?.length"><thead><tr><th>Scheduled job</th><th>Runs</th></tr></thead><tbody>
            <template x-for="j in data?.components.queue.scheduled || []" :key="j.name"><tr><td class="mono" x-text="j.name"></td><td class="muted" x-text="every(j.everyMs)"></td></tr></template></tbody></table>
        </div>

        <div class="panel mb-3" x-show="failed.length">
          <div class="panel-h">Failed jobs</div>
          <table class="table"><thead><tr><th>Job</th><th>Reason</th><th>When</th><th></th></tr></thead><tbody>
            <template x-for="j in failed" :key="j.id"><tr>
              <td><span class="mono" x-text="j.name"></span><div class="muted small" x-text="j.attemptsMade + ' attempts'"></div></td>
              <td class="small" x-text="j.failedReason"></td>
              <td class="muted" x-text="j.at ? ago(j.at) : ''"></td>
              <td class="text-end text-nowrap"><template x-if="can('jobs.manage')"><span><button class="btn btn-sm btn-outline-secondary" @click="retry(j)">Run again</button> <button class="btn btn-sm btn-outline-danger" @click="discard(j)">Discard</button></span></template></td>
            </tr></template></tbody></table>
        </div>

        <div class="panel p-3 small" x-show="data">
          <div class="fw-semibold mb-1">This server</div>
          <div class="muted mono" x-text="'v' + data?.version + ' · ' + data?.role + ' · node ' + data?.process.node + ' · up ' + since(Date.now() - data?.uptimeSeconds * 1000) + ' · ' + data?.process.rssMb + ' MB memory'"></div>
        </div>
      </section>
    </template>

  </main>
</div>
</template>
</body>
</html>
