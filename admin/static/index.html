                      <button type="button" class="btn btn-primary" :disabled="busy" @click="save()" x-text="busy ? 'Saving…' : 'Save'"></button>
                      <button type="button" class="btn btn-outline-secondary" x-show="!isNew" @click="preview()">Preview</button>
                    </div>
                    <div class="small text-warning mt-2" x-show="dirty">You have unsaved changes.</div>
                  </div>

                  <template x-for="t in type.taxonomies" :key="t.id">
                    <div class="panel p-3 mb-3">
                      <div class="fw-semibold mb-2" x-text="t.plural"></div>
                      <template x-for="term in (terms[t.id] || [])" :key="term.id"><div class="form-check"><input class="form-check-input" type="checkbox" :id="'t-' + term.id" :checked="hasTerm(term.id)" @change="toggleTerm(term.id, $event.target.checked)"><label class="form-check-label" :for="'t-' + term.id" x-text="term.name"></label></div></template>
                      <div class="d-flex gap-1 mt-2" x-show="type.can.write"><input class="form-control form-control-sm" :aria-label="'New ' + t.label.toLowerCase()" :placeholder="'New ' + t.label.toLowerCase()" x-model="newTerm[t.id]" @keydown.enter.prevent="addTerm(t.id)"><button type="button" class="btn btn-sm btn-outline-secondary" @click="addTerm(t.id)">Add</button></div>
                    </div>
                  </template>

                  <div class="panel p-3" x-show="!isNew">
                    <button type="button" class="btn btn-link px-0" @click="loadRevisions()" x-text="showRevisions ? 'Hide history' : 'History'"></button>
                    <div x-show="showRevisions">
                      <template x-for="r in revisions" :key="r.id"><div class="d-flex justify-content-between align-items-center small py-1 border-top"><div><span x-text="'v' + r.version"></span> · <span class="muted" x-text="(r.by || 'system') + ', ' + ago(r.at)"></span><div class="muted" x-show="r.note" x-text="r.note"></div></div><button type="button" class="btn btn-sm btn-outline-secondary" @click="restore(r)">Restore</button></div></template>
                    </div>
                    <hr>
                    <button type="button" class="btn btn-outline-danger btn-sm" x-show="type.can.delete" @click="remove()">Delete</button>
                  </div>
                </div>
              </div>
              <div class="muted" x-show="loading">Loading…</div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Categories and tags -->
    <template x-if="route === 'terms'">
      <section x-data="termsPage">
        <div class="page-head"><h1>Categories and tags</h1><p>Group posts so visitors can browse them. Deleting one never deletes a post.</p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="row g-3">
          <template x-for="t in taxonomies" :key="t.id">
            <div class="col-md-6"><div class="panel">
              <div class="panel-h" x-text="t.plural"></div>
              <div class="empty" x-show="!(terms[t.id] || []).length" x-text="'No ' + t.plural.toLowerCase() + ' yet.'"></div>
              <table class="table" x-show="(terms[t.id] || []).length"><tbody><template x-for="term in (terms[t.id] || [])" :key="term.id"><tr><td><span x-text="term.name"></span><div class="muted small mono" x-text="term.slug"></div></td><td class="muted" x-text="term.uses + (term.uses === 1 ? ' use' : ' uses')"></td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-secondary" @click="rename(t, term)">Rename</button> <button class="btn btn-sm btn-outline-danger" @click="remove(t, term)">Delete</button></td></tr></template></tbody></table>
              <form class="p-3 d-flex gap-2" @submit.prevent="add(t)"><input class="form-control" :aria-label="'New ' + t.label.toLowerCase()" :placeholder="'New ' + t.label.toLowerCase()" required x-model="names[t.id]"><button class="btn btn-primary">Add</button></form>
            </div></div>
          </template>
        </div>
      </section>
    </template>

    <!-- Media -->
    <template x-if="route === 'media'">
      <section x-data="mediaPage" @dragover.prevent="dragging = true" @dragleave="dragging = false" @drop.prevent="dragging = false; can('media.upload') && upload($event.dataTransfer.files)">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2"><div><h1>Media</h1><p>Images and documents. Images get a private copy without camera data and smaller sizes for fast pages.</p></div>
          <label class="btn btn-primary mb-0" x-show="can('media.upload')">Upload files <input type="file" hidden multiple accept="image/jpeg,image/png,image/gif,image/webp,image/avif,application/pdf" @change="upload($event.target.files); $event.target.value = ''"></label></div>
        <div class="alert alert-warning" x-show="!available">Image processing isn't installed on this server, so images can't be uploaded. Run <span class="mono">npm install</span> without <span class="mono">--omit=optional</span>.</div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <input class="form-control" style="max-width:18rem" placeholder="Search files" aria-label="Search files" x-model="q" @input.debounce.300ms="load()">
          <select class="form-select" style="max-width:10rem" aria-label="Type" x-model="kind" @change="load()"><option value="">All</option><option value="image">Images</option><option value="file">Documents</option></select>
          <span class="muted align-self-center small" x-show="busy">Uploading…</span>
        </div>
        <div class="row g-3">
          <div :class="current ? 'col-lg-8' : 'col-12'">
            <div class="dropzone" :class="{on: dragging}">
              <div class="empty" x-show="!items.length">No files yet. Upload some, or drop them here.</div>
              <div class="media-grid">
                <template x-for="m in items" :key="m.id"><button type="button" class="media-tile" :class="{sel: current && current.id === m.id}" @click="open(m)"><span class="ph"><img x-show="m.kind === 'image'" :src="thumb(m)" :alt="m.alt" loading="lazy"><i class="bi bi-file-earmark-pdf" x-show="m.kind !== 'image'"></i></span><span class="nm" x-text="m.filename"></span></button></template>
              </div>
            </div>
          </div>
          <template x-if="current"><div class="col-lg-4">
            <div class="panel p-3">
              <div class="ph big mb-2" x-show="current && current.kind === 'image'"><img :src="current ? '/media/' + current.id + '/' + current.originalFile : ''" :alt="current ? current.alt : ''"></div>
              <div class="fw-semibold" x-text="current ? current.filename : ''"></div>
              <div class="muted small mb-2" x-text="current ? (current.mime + ' · ' + bytes(current.size) + (current.width ? ' · ' + current.width + '×' + current.height : '')) : ''"></div>
              <div class="small mono mb-2" x-text="current ? current.url : ''"></div>
              <label class="form-label" for="m-alt">Description for screen readers (alt text)</label>
              <input id="m-alt" class="form-control mb-2" maxlength="500" :disabled="!can('media.upload')" x-model="current.alt" x-show="current">
              <div class="d-flex gap-2 flex-wrap"><button class="btn btn-primary btn-sm" x-show="can('media.upload')" @click="saveAlt()">Save description</button><button class="btn btn-outline-danger btn-sm" x-show="can('media.delete')" @click="remove()">Delete</button></div>
              <div class="small muted mt-2" x-text="usage ? 'Used in ' + usage + (usage === 1 ? ' entry.' : ' entries.') : 'Not used anywhere yet.'"></div>
            </div>
          </div></template>
        </div>
      </section>
    </template>

    <!-- Content activity: create/edit/publish/delete across content, pages, components, translations, media, menus, redirects, SEO rules -->
    <template x-if="route === 'content-activity'">
      <section x-data="contentActivityPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Activity</h1><p>Who created, edited, published, restored or deleted a page, entry or file. Security events (sign-ins, settings, webhooks) are in the Audit log.</p></div>
          <a class="btn btn-outline-secondary" :href="exportUrl" download>Export CSV</a>
        </div>
        <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small" for="ca-actor">Actor email</label><input id="ca-actor" class="form-control" style="max-width:16rem" placeholder="e.g. you@example.com" x-model="actorEmail" @input.debounce.400ms="load(true)"></div>
          <div><label class="form-label small" for="ca-from">From</label><input id="ca-from" type="date" class="form-control" x-model="from" @change="load(true)"></div>
          <div><label class="form-label small" for="ca-to">To</label><input id="ca-to" type="date" class="form-control" x-model="to" @change="load(true)"></div>
          <button type="button" class="btn btn-link" x-show="actorEmail || from || to" @click="clearFilters()">Clear filters</button>
        </div>
        <div class="panel">
          <div class="empty" x-show="!entries.length">No content activity yet.</div>
          <table class="table" x-show="entries.length"><thead><tr><th>What happened</th><th>By</th><th>When</th></tr></thead><tbody>
            <template x-for="e in entries" :key="e.id"><tr>
              <td class="small"><span x-html="detail(e)"></span></td>
              <td x-text="e.actor"></td>
              <td class="muted text-nowrap" x-text="ago(e.at)" :title="new Date(e.at).toLocaleString()"></td></tr></template></tbody></table>
        </div>
        <div class="text-center mt-3"><button class="btn btn-outline-secondary" x-show="more" @click="load(false)">Load older</button></div>
      </section>
    </template>

    <!-- Pages: a list, or the builder for one page -->
    <template x-if="route === 'pages'">
      <div>
        <template x-for="v in pagesViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="pagesList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Pages</h1><p>Every address of your site. A page shows one or more components, in an order you choose, or a hand-written template for anything more custom.</p></div>
                <div class="d-flex gap-2 flex-wrap">
                  <a class="btn btn-outline-secondary" href="/api/admin/site/pages/export">Export .zip</a>
                  <label class="btn btn-outline-secondary mb-0" x-show="can('pages.write')" :class="{disabled: importBusy}">Import .zip<input type="file" hidden accept=".zip,application/zip" @change="importZip($event.target.files[0]); $event.target.value = ''"></label>
                  <a class="btn btn-primary" x-show="can('pages.write')" href="#/pages/new">New page</a>
                </div>
              </div>
              <div class="form-check mb-2" x-show="can('pages.write')"><input id="p-prune" class="form-check-input" type="checkbox" x-model="prune"><label class="form-check-label small" for="p-prune">Importing replaces the whole tree (deletes pages the zip doesn't have) instead of adding to it</label></div>
              <div class="alert alert-danger" role="alert" style="white-space:pre-wrap" x-show="importError" x-text="importError"></div>
              <div class="panel">
                <div class="empty" x-show="loaded && !pages.length">No pages yet.</div>
                <table class="table" x-show="pages.length"><thead><tr><th>Address</th><th>Shows</th><th></th><th>Changed</th><th></th></tr></thead><tbody>
                  <template x-for="p in pages" :key="p.path"><tr>
                    <td class="mono small" x-text="addressOf(p)"></td>
                    <td class="muted small" x-text="entryLabel(p)"></td>
                    <td><span class="tag warn" x-show="p.front && p.front.noindex" title="Left out of search engines">noindex</span></td>
                    <td class="muted text-nowrap" x-text="ago(p.updatedAt)"></td>
                    <td class="text-end text-nowrap">
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/pages/' + encodeURIComponent(p.name)">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('pages.write')" @click="remove(p)">Delete</button>
                    </td>
                  </tr></template></tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="pagesEditor(v.name)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New page' : (front.title || pageName)"></h1><p x-show="!isNew" class="mono" x-text="'/' + pageName"></p></div>
                <a href="#/pages" class="btn btn-outline-secondary">Back to pages</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="p-name">Address</label>
                    <div class="input-group">
                      <span class="input-group-text mono">/</span>
                      <input id="p-name" class="form-control mono" placeholder="blog/[slug]" x-model="pageName" @blur="pageName = cleanName">
                    </div>
                    <div class="help small muted mt-1">Use <code>[name]</code> for a part of the address that varies, or <code>[...name]</code> for the rest of it. End with <code>index</code> to answer the folder itself (so <code>blog/index</code> is just <code>/blog</code>).</div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="row g-2">
                      <div class="col-md-6"><label class="form-label" for="p-title">Title</label><input id="p-title" class="form-control" maxlength="200" x-model="front.title"></div>
                      <div class="col-md-6"><label class="form-label" for="p-layout">Layout</label>
                        <select id="p-layout" class="form-select" x-model="front.layout"><option value="">Theme default</option><template x-for="l in layouts" :key="l"><option :value="l" x-text="l"></option></template></select>
                      </div>
                    </div>
                    <label class="form-label mt-2" for="p-desc">Description</label>
                    <textarea id="p-desc" class="form-control" rows="2" maxlength="400" x-model="front.description"></textarea>
                    <div class="row g-2 mt-1 align-items-center">
                      <div class="col-6 col-md-3"><div class="form-check"><input id="p-noindex" class="form-check-input" type="checkbox" x-model="front.noindex"><label class="form-check-label small" for="p-noindex">Noindex</label></div></div>
                      <div class="col-6 col-md-3"><div class="form-check"><input id="p-sitemap" class="form-check-input" type="checkbox" x-model="front.sitemap"><label class="form-check-label small" for="p-sitemap">In sitemap</label></div></div>
                      <div class="col-6 col-md-3"><div class="form-check"><input id="p-cache" class="form-check-input" type="checkbox" x-model="front.cache"><label class="form-check-label small" for="p-cache">Cacheable</label></div></div>
                      <div class="col-6 col-md-3"><select class="form-select form-select-sm" aria-label="Rate limit" x-model="front.limit"><option value="">No extra limit</option><option value="search">Search limit</option></select></div>
                    </div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">SEO defaults for this page</div>
                    <div class="help small muted mb-2">Applies to every address this page produces. A <a href="#/seo">SEO Manager</a> rule for one specific address overrides all of this.</div>
                    <div class="row g-2">
                      <div class="col-md-6"><label class="form-label" for="p-seo-type">Content type (og:type)</label>
                        <select id="p-seo-type" class="form-select" x-model="front.seoType"><option value="">Automatic</option><option value="website">Website</option><option value="article">Article</option></select>
                      </div>
                      <div class="col-md-6"><label class="form-label" for="p-twitter-card">Twitter card</label>
                        <select id="p-twitter-card" class="form-select" x-model="front.twitterCard"><option value="">Site default</option><option value="summary">Summary</option><option value="summary_large_image">Summary with large image</option></select>
                      </div>
                    </div>
                    <label class="form-label mt-2">Default social image</label>
                    <div class="d-flex align-items-center gap-3">
                      <span class="ph thumb" x-show="front.seoImage"><img x-show="seoImageMeta && seoImageMeta.kind === 'image'" :src="seoImageMeta ? thumb(seoImageMeta) : ''" alt=""></span>
                      <span class="muted small" x-show="front.seoImage" x-text="seoImageMeta ? seoImageMeta.filename : ''"></span>
                      <button type="button" class="btn btn-outline-secondary btn-sm" @click="pickSeoImage()" x-text="front.seoImage ? 'Change' : 'Choose from the library'"></button>
                      <button type="button" class="btn btn-link btn-sm" x-show="front.seoImage" @click="front.seoImage = null; seoImageMeta = null">Remove</button>
                    </div>
                    <div class="help small muted mt-1">Used when an entry has no featured image and no site-wide default social image is set.</div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="p-shows">Shows</label>
                    <select id="p-shows" class="form-select mb-2" x-model="shows">
                      <option value="none">Nothing special — a custom page</option>
                      <option value="type">Every entry of a content type</option>
                      <option value="own">Any type with its own address</option>
                      <option value="fixed">One specific entry</option>
                      <option value="terms">Every entry with one taxonomy term</option>
                    </select>
                    <template x-if="shows === 'type' || shows === 'fixed'">
                      <select class="form-select mb-2" aria-label="Content type" x-model="showsType"><option value="">Choose a type…</option><template x-for="t in entryTypes" :key="t.id"><option :value="t.id" x-text="t.label"></option></template></select>
                    </template>
                    <template x-if="shows === 'fixed'"><input class="form-control mono" aria-label="Entry path" placeholder="about/team" x-model="showsPath"></template>
                    <template x-if="shows === 'terms'">
                      <select class="form-select" aria-label="Taxonomy" x-model="showsTaxonomy"><option value="">Choose a taxonomy…</option><template x-for="t in taxonomies" :key="t.id"><option :value="t.id" x-text="t.label"></option></template></select>
                    </template>
                    <div class="help small muted mt-2" x-show="dynamicParams.length" x-text="'Address parts this file name gives: ' + dynamicParams.join(', ')"></div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                      <label class="form-label mb-0">Content</label>
                      <div class="d-flex gap-2 align-items-center">
                        <label class="btn btn-sm btn-outline-secondary mb-0">Import HTML<input type="file" accept=".html,.htm" hidden @change="importFile($event.target.files[0]); $event.target.value = ''"></label>
                        <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleCode()" x-text="mode === 'compose' ? 'Edit as code' : 'Edit as components'"></button>
                      </div>
                    </div>

                    <template x-if="mode === 'compose'">
                      <div>
                        <div class="empty" x-show="!blocks.length">No components on this page yet. Add one below.</div>
                        <template x-for="(b, i) in blocks" :key="b.uid">
                          <div class="panel p-3 mb-2">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                              <strong x-text="componentTitle(b.name)"></strong>
                              <div class="btn-group">
                                <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="i === 0" @click="moveBlock(i, -1)" aria-label="Move up">↑</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="i === blocks.length - 1" @click="moveBlock(i, 1)" aria-label="Move down">↓</button>
                                <button type="button" class="btn btn-sm btn-outline-danger" @click="removeBlock(i)">Remove</button>
                              </div>
                            </div>
                            <div class="empty small" x-show="!propsOf(b.name).length">No properties.</div>
                            <template x-for="p in propsOf(b.name)" :key="p.key">
                              <div class="mb-2">
                                <label class="form-label small" x-text="p.label || p.key"></label>
                                <template x-if="p.type === 'boolean'"><div class="form-check"><input class="form-check-input" type="checkbox" x-model="b.args[p.key]"></div></template>
                                <template x-if="p.type === 'text'"><textarea class="form-control form-control-sm" rows="2" x-model="b.args[p.key]"></textarea></template>
                                <template x-if="p.type === 'number'"><input type="number" class="form-control form-control-sm" x-model.number="b.args[p.key]"></template>
                                <template x-if="!p.type || p.type === 'string'"><input class="form-control form-control-sm" x-model="b.args[p.key]"></template>
                              </div>
                            </template>
                          </div>
                        </template>
                        <div class="d-flex gap-2">
                          <select class="form-select" aria-label="Add a component" x-model="newBlockName"><option value="">Add a component…</option><template x-for="c in components" :key="c.name"><option :value="c.name" x-text="c.meta?.title || c.name"></option></template></select>
                          <button type="button" class="btn btn-outline-secondary text-nowrap" @click="addBlock()">Add</button>
                        </div>
                      </div>
                    </template>
                    <template x-if="mode === 'code'">
                      <textarea class="form-control mono" rows="16" spellcheck="false" x-codejar="{ mode: 'htmlmixed', get: code, set: (v) => (code = v) }"></textarea>
                    </template>
                  </div>
                </div>

                <div class="col-lg-5">
                  <div class="panel mb-3" style="position:sticky;top:1rem">
                    <div class="panel-h d-flex justify-content-between align-items-center">
                      <span>Preview</span>
                      <span class="muted small" x-show="preview.busy">Rendering…</span>
                    </div>
                    <div class="p-2" x-show="dynamicParams.length">
                      <template x-for="p in dynamicParams" :key="p">
                        <input class="form-control form-control-sm mb-1" :aria-label="'Sample value for ' + p" :placeholder="p + ' (sample value)'" x-model="previewParams[p]">
                      </template>
                    </div>
                    <div class="alert alert-danger m-2" role="alert" x-show="preview.error" x-text="preview.error"></div>
                    <iframe title="Page preview" style="width:100%;height:70vh;border:0;border-top:1px solid var(--line)" sandbox="allow-same-origin" :srcdoc="preview.html"></iframe>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded && (isNew || dirty)">
                <span x-show="dirty && !isNew">Unsaved changes</span>
                <span class="ms-auto"></span>
                <button class="btn btn-outline-secondary" type="button" x-show="!isNew" @click="discard()">Discard</button>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create page' : 'Save page'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Components: a list, or the builder for one component -->
    <template x-if="route === 'components'">
      <div>
        <template x-for="v in componentsViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="componentsList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Components</h1><p>Reusable building blocks: an HTML/Liquid template, scoped CSS, and the data it reads. Pages are built by arranging these.</p></div>
                <div class="d-flex gap-2 flex-wrap">
                  <a class="btn btn-outline-secondary" href="/api/admin/site/components/export">Export .zip</a>
                  <label class="btn btn-outline-secondary mb-0" x-show="can('components.write')" :class="{disabled: importBusy}">Import .zip<input type="file" hidden accept=".zip,application/zip" @change="importZip($event.target.files[0]); $event.target.value = ''"></label>
                  <a class="btn btn-primary" x-show="can('components.write')" href="#/components/new">New component</a>
                </div>
              </div>
              <div class="form-check mb-2" x-show="can('components.write')"><input id="c-prune" class="form-check-input" type="checkbox" x-model="prune"><label class="form-check-label small" for="c-prune">Importing replaces the whole library (deletes components the zip doesn't have) instead of adding to it</label></div>
              <div class="alert alert-danger" role="alert" style="white-space:pre-wrap" x-show="importError" x-text="importError"></div>
              <div class="panel">
                <div class="empty" x-show="loaded && !components.length">No components yet.</div>
                <table class="table" x-show="components.length"><thead><tr><th>Name</th><th>Title</th><th>Properties</th><th>Data</th><th>Changed</th><th></th></tr></thead><tbody>
                  <template x-for="c in components" :key="c.path"><tr>
                    <td class="mono small" x-text="c.name"></td>
                    <td x-text="c.meta?.title || '–'"></td>
                    <td class="muted small" x-text="Object.keys(c.meta?.props || {}).length || '–'"></td>
                    <td class="muted small" x-text="(c.meta?.api || []).length || '–'"></td>
                    <td class="muted text-nowrap" x-text="ago(c.updatedAt)"></td>
                    <td class="text-end text-nowrap">
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/components/' + encodeURIComponent(c.name)">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('components.write')" @click="remove(c)">Delete</button>
                    </td>
                  </tr></template></tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="componentsEditor(v.name)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New component' : (metaTitle || name)"></h1><p x-show="!isNew" class="mono" x-text="name"></p></div>
                <a href="#/components" class="btn btn-outline-secondary">Back to components</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="c-name">Name</label>
                    <div class="input-group">
                      <span class="input-group-text mono">components/</span>
                      <input id="c-name" class="form-control mono" placeholder="hero" x-model="newName">
                      <span class="input-group-text mono">.html</span>
                    </div>
                    <div class="row g-2 mt-1">
                      <div class="col-md-6"><label class="form-label" for="c-title">Title</label><input id="c-title" class="form-control" maxlength="80" placeholder="Shown in the page builder" x-model="metaTitle"></div>
                      <div class="col-md-6"><label class="form-label" for="c-desc">Description</label><input id="c-desc" class="form-control" maxlength="300" x-model="metaDescription"></div>
                    </div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label mb-0">Properties</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addProp()">Add property</button></div>
                    <div class="empty small" x-show="!props.length">No properties: this component always shows the same thing.</div>
                    <template x-for="(p, i) in props" :key="i">
                      <div class="row g-2 mb-2 align-items-center">
                        <div class="col-3"><input class="form-control form-control-sm mono" aria-label="Property key" placeholder="heading" x-model="p.key"></div>
                        <div class="col-3"><input class="form-control form-control-sm" aria-label="Label" placeholder="Label" x-model="p.label"></div>
                        <div class="col-3"><select class="form-select form-select-sm" aria-label="Type" x-model="p.type"><option value="string">Short text</option><option value="text">Long text</option><option value="number">Number</option><option value="boolean">On/off</option></select></div>
                        <div class="col-2"><input class="form-control form-control-sm" aria-label="Default value" placeholder="Default" x-model="p.default"></div>
                        <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeProp(i)" aria-label="Remove property">×</button></div>
                      </div>
                    </template>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label mb-0">Data this component reads</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addApi()">Add endpoint</button></div>
                    <div class="empty small" x-show="!apis.length">No data: this component only uses its properties.</div>
                    <template x-for="(a, i) in apis" :key="i">
                      <div class="row g-2 mb-2 align-items-center">
                        <div class="col-3"><input class="form-control form-control-sm mono" aria-label="Name (api.name in the template)" placeholder="post" x-model="a.name"></div>
                        <div class="col-6"><input class="form-control form-control-sm mono" aria-label="Address" placeholder="/api/public/content/post/{{ slug }}" x-model="a.url"></div>
                        <div class="col-2 form-check"><input class="form-check-input" type="checkbox" :id="'api-req-' + i" x-model="a.required"><label class="form-check-label small" :for="'api-req-' + i">Required</label></div>
                        <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeApi(i)" aria-label="Remove endpoint">×</button></div>
                      </div>
                    </template>
                  </div>

                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="c-template">Template (HTML + Liquid)</label>
                    <textarea id="c-template" class="form-control mono" rows="14" spellcheck="false" x-codejar="{ mode: 'htmlmixed', get: template, set: (v) => (template = v) }"></textarea>
                    <div class="help small muted mt-1">A <span class="mono">&lt;script&gt;</span> tag is allowed here and runs on the live page (it is not sandboxed — the same trust level as a script Service); the live preview does not run it, since the preview frame never runs scripts.</div>
                  </div>
                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="c-css">Scoped CSS</label>
                    <textarea id="c-css" class="form-control mono" rows="8" spellcheck="false" x-codejar="{ mode: 'css', get: css, set: (v) => (css = v) }"></textarea>
                  </div>
                </div>

                <div class="col-lg-5">
                  <div class="panel mb-3" style="position:sticky;top:1rem">
                    <div class="panel-h d-flex justify-content-between align-items-center">
                      <span>Preview</span>
                      <span class="muted small" x-show="preview.busy">Rendering…</span>
                    </div>
                    <div class="help small muted p-2" x-show="props.length">Shown with each property at its default value above.</div>
                    <div class="alert alert-danger m-2" role="alert" x-show="preview.error" x-text="preview.error"></div>
                    <iframe title="Component preview" style="width:100%;height:60vh;border:0;border-top:1px solid var(--line)" sandbox="allow-same-origin" :srcdoc="preview.html"></iframe>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded && (isNew || dirty)">
                <span x-show="dirty && !isNew">Unsaved changes</span>
                <span class="ms-auto"></span>
                <button class="btn btn-outline-secondary" type="button" x-show="!isNew" @click="discard()">Discard</button>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create component' : 'Save component'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Services: a list, or the editor for one Service -->
    <template x-if="route === 'services'">
      <div>
        <template x-for="v in servicesViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="servicesList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>Services</h1><p>Custom API endpoints components — and, through the public content API, other callers — can read data from.</p></div>
                <div class="d-flex gap-2 flex-wrap">
                  <a class="btn btn-outline-secondary" href="/api/admin/services/export">Export .zip</a>
                  <label class="btn btn-outline-secondary mb-0" x-show="can('services.write')" :class="{disabled: importBusy}">Import .zip<input type="file" hidden accept=".zip,application/zip" @change="importZip($event.target.files[0]); $event.target.value = ''"></label>
                  <a class="btn btn-primary" x-show="can('services.write')" href="#/services/new">New service</a>
                </div>
              </div>
              <div class="alert alert-danger" role="alert" style="white-space:pre-wrap" x-show="importError" x-text="importError"></div>
              <div class="panel">
                <div class="empty" x-show="loaded && !services.length">No services yet.</div>
                <table class="table" x-show="services.length"><thead><tr><th>Slug</th><th>Name</th><th>Mode</th><th>Access</th><th></th><th></th></tr></thead><tbody>
                  <template x-for="s in services" :key="s.slug"><tr>
                    <td class="mono small" x-text="s.slug"></td>
                    <td x-text="s.name"></td>
                    <td class="muted small" x-text="s.mode === 'sql' ? 'Raw SQL' : s.mode === 'script' ? 'Script (Node.js)' : 'Query builder'"></td>
                    <td class="muted small" x-text="s.access === 'customer' ? 'Signed-in customers' : 'Public'"></td>
                    <td><span class="tag" :class="s.enabled ? 'ok' : 'warn'" x-text="s.enabled ? 'Enabled' : 'Disabled'"></span></td>
                    <td class="text-end text-nowrap">
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/services/' + encodeURIComponent(s.slug)">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('services.write')" @click="remove(s)">Delete</button>
                    </td>
                  </tr></template></tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="servicesEditor(v.slug)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New service' : (name || slug)"></h1><p x-show="!isNew" class="mono" x-text="slug"></p></div>
                <a href="#/services" class="btn btn-outline-secondary">Back to services</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <div class="row g-2">
                      <div class="col-md-6"><label class="form-label" for="s-name">Name</label><input id="s-name" class="form-control" maxlength="200" x-model="name"></div>
                      <div class="col-md-6"><label class="form-label" for="s-slug">Slug</label>
                        <div class="input-group"><span class="input-group-text mono">/services/</span><input id="s-slug" class="form-control mono" placeholder="recent-posts" x-model="newSlug"></div>
                      </div>
                    </div>
                    <label class="form-label mt-2" for="s-desc">Description</label>
                    <textarea id="s-desc" class="form-control" rows="2" maxlength="1000" x-model="description"></textarea>
                    <div class="row g-2 mt-1 align-items-center">
                      <div class="col-6 col-md-4"><div class="form-check"><input id="s-enabled" class="form-check-input" type="checkbox" x-model="enabled"><label class="form-check-label small" for="s-enabled">Enabled</label></div></div>
                      <div class="col-6 col-md-4"><select class="form-select form-select-sm" aria-label="Who can call this" x-model="access"><option value="public">Public</option><option value="customer">Signed-in customers</option></select></div>
                    </div>
                    <div class="help small muted mt-1" x-show="access === 'customer'">Customer accounts aren't built yet — this will take effect once they are.</div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <label class="form-label">Mode</label>
                    <div class="btn-group d-flex mb-3" role="group" aria-label="Service mode">
                      <input type="radio" class="btn-check" id="mode-query" value="query" x-model="mode" autocomplete="off">
                      <label class="btn btn-outline-secondary" for="mode-query">Query builder</label>
                      <input type="radio" class="btn-check" id="mode-sql" value="sql" x-model="mode" autocomplete="off" x-show="can('services.sql')">
                      <label class="btn btn-outline-secondary" for="mode-sql" x-show="can('services.sql')">Raw SQL</label>
                      <input type="radio" class="btn-check" id="mode-script" value="script" x-model="mode" autocomplete="off" x-show="can('services.script')">
                      <label class="btn btn-outline-secondary" for="mode-script" x-show="can('services.script')">Script (Node.js)</label>
                    </div>

                    <template x-if="mode === 'query'">
                      <div>
                        <div class="btn-group d-flex mb-3" role="group" aria-label="What this reads" x-show="can('services.sql')">
                          <input type="radio" class="btn-check" id="src-type" value="type" x-model="qSource" autocomplete="off">
                          <label class="btn btn-outline-secondary btn-sm" for="src-type">Content type</label>
                          <input type="radio" class="btn-check" id="src-table" value="table" x-model="qSource" autocomplete="off">
                          <label class="btn btn-outline-secondary btn-sm" for="src-table">Database table</label>
                        </div>

                        <template x-if="qSource === 'type'">
                          <div>
                            <div class="row g-2">
                              <div class="col-md-6"><label class="form-label" for="s-type">Content type</label>
                                <select id="s-type" class="form-select" x-model="qType"><option value="">Choose a type…</option><template x-for="t in entryTypes" :key="t.id"><option :value="t.id" x-text="t.label"></option></template></select>
                              </div>
                              <div class="col-md-6"><label class="form-label" for="s-sort">Sort</label>
                                <select id="s-sort" class="form-select" x-model="qSort"><option value="newest">Newest first</option><option value="path">By address</option></select>
                              </div>
                            </div>
                            <div class="row g-2 mt-1">
                              <div class="col-md-4"><label class="form-label" for="s-perpage">Per page (default)</label><input id="s-perpage" type="number" min="1" max="200" class="form-control" x-model.number="qPerPageDefault"></div>
                              <div class="col-md-4"><label class="form-label" for="s-permax">Per page (max)</label><input id="s-permax" type="number" min="1" max="200" class="form-control" x-model.number="qPerPageMax"></div>
                              <div class="col-md-4"><label class="form-label" for="s-term">Taxonomy term id (optional)</label><input id="s-term" type="number" class="form-control" x-model="qTermId"></div>
                            </div>
                            <div class="mt-2" x-show="qType">
                              <label class="form-label">Fields to include (none checked = all)</label>
                              <div class="d-flex flex-wrap gap-3">
                                <template x-for="f in fieldsOf(qType)" :key="f.key">
                                  <div class="form-check"><input class="form-check-input" type="checkbox" :id="'f-' + f.key" :checked="qFields.includes(f.key)" @change="toggleField(f.key)"><label class="form-check-label small" :for="'f-' + f.key" x-text="f.label"></label></div>
                                </template>
                              </div>
                            </div>
                          </div>
                        </template>

                        <template x-if="qSource === 'table'">
                          <div>
                            <label class="form-label" for="t-table">Table or view</label>
                            <select id="t-table" class="form-select" x-model="tTable" @change="onTableChange()">
                              <option value="">Choose a table or view…</option>
                              <template x-for="t in tables" :key="t.name"><option :value="t.name" x-text="t.name + (t.view ? ' (view)' : '')"></option></template>
                            </select>
                            <div class="help small muted mt-1">A fixed list of tables (users, sessions, settings, audit logs and a few others) can never be read here, whatever your permissions.</div>

                            <div class="mt-2" x-show="tTable">
                              <label class="form-label">Columns to return</label>
                              <div class="empty small" x-show="!tAvailableColumns.length">Loading columns…</div>
                              <div class="d-flex flex-wrap gap-3">
                                <template x-for="c in tAvailableColumns" :key="c">
                                  <div class="form-check"><input class="form-check-input" type="checkbox" :id="'tc-' + c" :checked="tColumns.includes(c)" @change="toggleColumn(c)"><label class="form-check-label small mono" :for="'tc-' + c" x-text="c"></label></div>
                                </template>
                              </div>
                            </div>

                            <div class="row g-2 mt-2" x-show="tTable">
                              <div class="col-md-6"><label class="form-label" for="t-sort">Sort by</label>
                                <select id="t-sort" class="form-select" x-model="tSortColumn"><option value="">Unsorted</option><template x-for="c in tAvailableColumns" :key="c"><option :value="c" x-text="c"></option></template></select>
                              </div>
                              <div class="col-md-6"><label class="form-label" for="t-dir">Direction</label>
                                <select id="t-dir" class="form-select" x-model="tSortDir"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
                              </div>
                            </div>
                            <div class="row g-2 mt-1" x-show="tTable">
                              <div class="col-md-6"><label class="form-label" for="t-perpage">Per page (default)</label><input id="t-perpage" type="number" min="1" max="200" class="form-control" x-model.number="tPerPageDefault"></div>
                              <div class="col-md-6"><label class="form-label" for="t-permax">Per page (max)</label><input id="t-permax" type="number" min="1" max="200" class="form-control" x-model.number="tPerPageMax"></div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-3 mb-2" x-show="tTable"><label class="form-label mb-0">Parameters</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addTableParam()">Add parameter</button></div>
                            <template x-for="(p, i) in tParams" :key="i">
                              <div class="row g-2 mb-2 align-items-center">
                                <div class="col-4"><input class="form-control form-control-sm mono" aria-label="Parameter name" placeholder="status" x-model="p.name"></div>
                                <div class="col-3"><select class="form-select form-select-sm" aria-label="Parameter type" x-model="p.type"><option value="string">Text</option><option value="number">Number</option><option value="boolean">On/off</option></select></div>
                                <div class="col-3 form-check"><input class="form-check-input" type="checkbox" :id="'treq-' + i" x-model="p.required"><label class="form-check-label small" :for="'treq-' + i">Required</label></div>
                                <div class="col-2 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeTableParam(i)" aria-label="Remove parameter">×</button></div>
                              </div>
                            </template>

                            <div class="d-flex justify-content-between align-items-center mt-3 mb-2" x-show="tTable"><label class="form-label mb-0">Filter by column = parameter</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addWhere()">Add filter</button></div>
                            <template x-for="(w, i) in tWhere" :key="i">
                              <div class="row g-2 mb-2 align-items-center">
                                <div class="col-5"><select class="form-select form-select-sm mono" aria-label="Column" x-model="w.column"><option value="">Column…</option><template x-for="c in tAvailableColumns" :key="c"><option :value="c" x-text="c"></option></template></select></div>
                                <span class="col-auto">=</span>
                                <div class="col-5"><select class="form-select form-select-sm mono" aria-label="Parameter" x-model="w.param"><option value="">Parameter…</option><template x-for="p in tParams" :key="p.name"><option :value="p.name" x-text="p.name"></option></template></select></div>
                                <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeWhere(i)" aria-label="Remove filter">×</button></div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <template x-if="mode === 'script'">
                      <div>
                        <label class="form-label" for="sc-code">Script</label>
                        <textarea id="sc-code" class="form-control mono" rows="14" spellcheck="false" x-codejar="{ mode: 'javascript', get: scCode, set: (v) => (scCode = v), placeholder: &quot;const rows = await ctx.db('entries').where({ type: 'post' }).limit(5);\nreturn { rows };&quot; }"></textarea>
                        <div class="help small muted mt-1">Complete, <strong>unsandboxed</strong> Node.js — the same trust level as shell access to this server. The code becomes an <code>async (req, ctx) =&gt; { … }</code> function: <code>req.query</code> is the request's query string; <code>ctx</code> is the entire platform (database, settings — including secrets, email, everything). Whatever it <code>return</code>s is the response body. A timeout stops the site from WAITING on it, but cannot stop code that's already running.</div>
                      </div>
                    </template>

                    <template x-if="mode === 'sql'">
                      <div>
                        <label class="form-label" for="s-sql">SQL (read-only SELECT, named :params)</label>
                        <textarea id="s-sql" class="form-control mono" rows="8" spellcheck="false" x-codejar="{ mode: 'text/x-sql', get: sSql, set: (v) => (sSql = v), placeholder: 'select title, published_at from entries where type = :type order by published_at desc' }"></textarea>
                        <div class="help small muted mt-1">This runs against your live database, in the dialect it is written for. Only a single SELECT/WITH statement, read-only. Write your own LIMIT — results are also capped by the setting below.</div>

                        <div class="d-flex justify-content-between align-items-center mt-3 mb-2"><label class="form-label mb-0">Parameters</label><button type="button" class="btn btn-sm btn-outline-secondary" @click="addParam()">Add parameter</button></div>
                        <div class="empty small" x-show="!sParams.length">No parameters.</div>
                        <template x-for="(p, i) in sParams" :key="i">
                          <div class="row g-2 mb-2 align-items-center">
                            <div class="col-4"><input class="form-control form-control-sm mono" aria-label="Parameter name" placeholder="type" x-model="p.name"></div>
                            <div class="col-3"><select class="form-select form-select-sm" aria-label="Parameter type" x-model="p.type"><option value="string">Text</option><option value="number">Number</option><option value="boolean">On/off</option></select></div>
                            <div class="col-3 form-check"><input class="form-check-input" type="checkbox" :id="'req-' + i" x-model="p.required"><label class="form-check-label small" :for="'req-' + i">Required</label></div>
                            <div class="col-2 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeParam(i)" aria-label="Remove parameter">×</button></div>
                          </div>
                        </template>

                        <label class="form-label mt-2" for="s-rowlimit">Row limit (blank = the site default)</label>
                        <input id="s-rowlimit" type="number" min="1" max="10000" class="form-control" style="max-width:12rem" x-model="sRowLimit">
                      </div>
                    </template>
                  </div>
                </div>

                <div class="col-lg-5">
                  <div class="panel mb-3" style="position:sticky;top:1rem">
                    <div class="panel-h d-flex justify-content-between align-items-center">
                      <span>Preview</span>
                      <span class="muted small" x-show="preview.busy">Running…</span>
                    </div>
                    <div class="empty small p-3" x-show="!canPreview">Choose a content type or table (or write a query or script) to see a preview.</div>
                    <div class="alert alert-danger m-2" role="alert" x-show="preview.error" x-text="preview.error"></div>
                    <pre class="p-3 mb-0 small" style="max-height:60vh;overflow:auto" x-show="preview.result" x-text="JSON.stringify(preview.result, null, 2)"></pre>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded && (isNew || dirty)">
                <span x-show="dirty && !isNew">Unsaved changes</span>
                <span class="ms-auto"></span>
                <button class="btn btn-outline-secondary" type="button" x-show="!isNew" @click="discard()">Discard</button>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create service' : 'Save service'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- SEO Manager -->
    <template x-if="route === 'seo'">
      <div>
        <template x-for="v in seoViews" :key="v.key"><div>

          <template x-if="v.kind === 'list'">
            <section x-data="seoList">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1>SEO Manager</h1><p>Override title, description, social tags and structured data for one specific address. A page’s own SEO section (Webmaster → Site pages) sets the default for everything else.</p></div>
                <a class="btn btn-primary" x-show="can('seo.write')" href="#/seo/new">New rule</a>
              </div>
              <div class="panel">
                <div class="empty" x-show="loaded && !rules.length">No rules yet — every page uses its own defaults.</div>
                <table class="table" x-show="rules.length"><thead><tr><th>Address</th><th>Priority</th><th>Overrides</th><th></th><th></th></tr></thead><tbody>
                  <template x-for="r in rules" :key="r.id"><tr>
                    <td class="mono small" x-text="r.pattern"></td>
                    <td class="muted small" x-text="r.priority"></td>
                    <td class="muted small" x-text="r.title || r.description ? 'Title/description' : (r.metaTags.length || r.ldJson.length ? 'Tags only' : '—')"></td>
                    <td><span class="tag" :class="r.enabled ? 'ok' : 'warn'" x-text="r.enabled ? 'Enabled' : 'Disabled'"></span></td>
                    <td class="text-end text-nowrap">
                      <a class="btn btn-sm btn-outline-secondary" :href="'#/seo/' + r.id">Edit</a>
                      <button class="btn btn-sm btn-outline-danger" type="button" x-show="can('seo.write')" @click="remove(r)">Delete</button>
                    </td>
                  </tr></template></tbody></table>
              </div>
            </section>
          </template>

          <template x-if="v.kind === 'edit'">
            <section x-data="seoRuleEditor(v.id)">
              <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div><h1 x-text="isNew ? 'New SEO rule' : pattern"></h1></div>
                <a href="#/seo" class="btn btn-outline-secondary">Back to SEO Manager</a>
              </div>
              <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
              <div class="row g-3" x-show="loaded">
                <div class="col-lg-7">
                  <div class="panel p-3 mb-3">
                    <label class="form-label" for="seo-pattern">Address pattern</label>
                    <input id="seo-pattern" class="form-control mono" placeholder="/about or /blog/* or /docs/**" x-model="pattern">
                    <div class="help small muted mt-1">An exact address (<code>/about</code>) matches only that page. <code>*</code> matches within one part of the address (<code>/blog/*</code>); <code>**</code> matches any depth (<code>/docs/**</code>).</div>
                    <div class="row g-2 mt-1 align-items-center">
                      <div class="col-6 col-md-4"><label class="form-label small mb-0" for="seo-priority">Priority</label><input id="seo-priority" type="number" class="form-control form-control-sm" x-model.number="priority"></div>
                      <div class="col-6 col-md-4"><div class="form-check"><input id="seo-enabled" class="form-check-input" type="checkbox" x-model="enabled"><label class="form-check-label small" for="seo-enabled">Enabled</label></div></div>
                    </div>
                    <div class="help small muted mt-1">When two wildcard patterns both match an address, the one with the longer fixed part wins; priority breaks a further tie.</div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Overrides</div>
                    <div class="help small muted mb-2">Leave a field blank to use what the page would otherwise show.</div>
                    <label class="form-label" for="seo-title">Title</label>
                    <input id="seo-title" class="form-control" maxlength="200" x-model="title">
                    <label class="form-label mt-2" for="seo-desc">Description</label>
                    <textarea id="seo-desc" class="form-control" rows="2" maxlength="400" x-model="description"></textarea>
                    <label class="form-label mt-2">Image</label>
                    <div class="d-flex align-items-center gap-3">
                      <span class="ph thumb" x-show="image"><img x-show="imageMeta && imageMeta.kind === 'image'" :src="imageMeta ? thumb(imageMeta) : ''" alt=""></span>
                      <span class="muted small" x-show="image" x-text="imageMeta ? imageMeta.filename : ''"></span>
                      <button type="button" class="btn btn-outline-secondary btn-sm" @click="pickImage()" x-text="image ? 'Change' : 'Choose from the library'"></button>
                      <button type="button" class="btn btn-link btn-sm" x-show="image" @click="image = null; imageMeta = null">Remove</button>
                    </div>
                    <div class="row g-2 mt-2">
                      <div class="col-md-4"><label class="form-label" for="seo-type">Content type</label>
                        <select id="seo-type" class="form-select" x-model="type"><option value="">Use the page’s default</option><option value="website">Website</option><option value="article">Article</option></select>
                      </div>
                      <div class="col-md-4"><label class="form-label" for="seo-twitter">Twitter card</label>
                        <select id="seo-twitter" class="form-select" x-model="twitterCard"><option value="">Use the page’s default</option><option value="summary">Summary</option><option value="summary_large_image">Summary with large image</option></select>
                      </div>
                      <div class="col-md-4"><label class="form-label" for="seo-canonical">Canonical address</label>
                        <input id="seo-canonical" class="form-control" x-model="canonical" placeholder="https://… or /path">
                      </div>
                    </div>
                    <div class="row g-2 mt-1">
                      <div class="col-md-6"><label class="form-label small" for="seo-noindex">Search indexing</label>
                        <select id="seo-noindex" class="form-select form-select-sm" x-model="noindexMode"><option value="inherit">Use the page’s default</option><option value="no">Allow indexing</option><option value="yes">Block indexing (noindex)</option></select>
                      </div>
                      <div class="col-md-6"><label class="form-label small" for="seo-nofollow">Link following</label>
                        <select id="seo-nofollow" class="form-select form-select-sm" x-model="nofollowMode"><option value="inherit">Use the page’s default</option><option value="no">Follow links</option><option value="yes">Don’t follow links (nofollow)</option></select>
                      </div>
                    </div>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Custom meta tags</div>
                    <div class="help small muted mb-2">Anything not covered above — Facebook’s <code>fb:pages</code>, a verification tag, or whatever a platform asks for next.</div>
                    <template x-for="(m, i) in metaTags" :key="i">
                      <div class="row g-2 mb-2 align-items-center">
                        <div class="col-3"><select class="form-select form-select-sm" aria-label="Tag kind" x-model="m.kind"><option value="name">name=</option><option value="property">property=</option></select></div>
                        <div class="col-4"><input class="form-control form-control-sm mono" aria-label="Tag key" placeholder="e.g. fb:pages" x-model="m.key"></div>
                        <div class="col-4"><input class="form-control form-control-sm" aria-label="Tag content" placeholder="content" x-model="m.content"></div>
                        <div class="col-1 text-end"><button type="button" class="btn btn-sm btn-outline-danger" @click="removeMetaTag(i)" aria-label="Remove tag">×</button></div>
                      </div>
                    </template>
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="addMetaTag()">Add tag</button>
                  </div>

                  <div class="panel p-3 mb-3">
                    <div class="panel-h">Extra structured data (JSON-LD)</div>
                    <div class="help small muted mb-2">Added alongside what the page already emits — a FAQPage or HowTo block for answer engines, a Product/Review schema, anything <a href="https://schema.org" target="_blank" rel="noopener">schema.org</a> defines. A JSON array of objects; leave as <code>[]</code> for none.</div>
                    <textarea class="form-control mono" rows="8" spellcheck="false" x-codejar="{ mode: 'application/json', get: ldJsonText, set: (v) => (ldJsonText = v) }"></textarea>
                  </div>
                </div>
              </div>

              <div class="savebar" x-show="loaded">
                <span class="ms-auto"></span>
                <button class="btn btn-primary" type="button" :disabled="busy" @click="save()" x-text="isNew ? 'Create rule' : 'Save rule'"></button>
              </div>
            </section>
          </template>

        </div></template>
      </div>
    </template>

    <!-- Themes -->
    <template x-if="route === 'themes'">
      <section x-data="themesPage">
        <div class="page-head"><h1>Themes</h1><p>A theme controls how the public site looks. Switching applies on every server within seconds.</p></div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="panel">
          <template x-for="t in themes" :key="t.id">
            <div class="node" style="grid-template-columns: 1fr auto">
              <div><strong x-text="t.name"></strong> <span class="tag" x-text="'v' + t.version"></span> <span class="tag ok" x-show="t.active">Live</span> <span class="tag" x-show="t.source === 'disk'">Built in</span>
                <div class="muted small" x-text="t.description"></div><div class="muted small" x-show="t.author" x-text="'By ' + t.author"></div></div>
              <div class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" :href="'#/customize/' + t.id">Customize</a>
                <a class="btn btn-sm btn-outline-secondary" :href="'#/theme-editor/' + t.id" x-text="t.source === 'db' && can('themes.edit') ? 'Edit files' : 'View files'"></a>
                <button class="btn btn-sm btn-outline-secondary" x-show="can('themes.manage')" @click="duplicate(t)">Duplicate</button>
                <a class="btn btn-sm btn-outline-secondary" :href="'/api/admin/themes/' + t.id + '/export'">Export .zip</a>
                <button class="btn btn-sm btn-primary" x-show="!t.active && can('themes.manage')" @click="activate(t)">Make live</button>
                <button class="btn btn-sm btn-outline-danger" x-show="!t.active && t.source === 'db' && can('themes.manage')" @click="remove(t)">Remove</button></div>
            </div>
          </template>
        </div>
        <div class="panel mt-3 p-3" x-show="can('themes.manage')">
          <div class="fw-semibold mb-1">Install a theme</div>
          <div class="muted small mb-2" x-text="'Upload a .zip (up to ' + maxZipMb + ' MB). It is checked before anything is saved: file types, paths, sizes and every template. ' + (allowJs ? 'Scripts are allowed.' : 'Themes with JavaScript are refused.')"></div>
          <label class="btn btn-outline-secondary mb-0" :class="{disabled: busy}">Choose a .zip <input type="file" hidden accept=".zip,application/zip" @change="upload($event.target.files[0]); $event.target.value = ''"></label>
          <span class="muted small ms-2" x-show="busy">Checking and installing…</span>
        </div>
      </section>
    </template>

    <!-- Customize (Appearance → Customize): the theme's options and custom CSS, with a live preview -->
    <template x-if="route === 'customize'">
      <section x-data="customizePage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Customize</h1><p>Change the theme’s options and add your own CSS. The preview updates as you type; visitors see nothing until you save.</p></div>
          <div class="d-flex gap-2 align-items-center">
            <label class="small muted" for="cz-theme">Theme</label>
            <select id="cz-theme" class="form-select" style="max-width:14rem" @change="open($event.target.value)"><template x-for="t in themes" :key="t.id"><option :value="t.id" :selected="t.id === id" x-text="t.name + (t.active ? ' (live)' : '')"></option></template></select>
          </div>
        </div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="alert alert-info small" x-show="theme && !theme.active">This theme isn’t live. What you save here applies when it is made live under Appearance → Themes.</div>
        <div class="row g-3" x-show="loaded">
          <div class="col-lg-5">
            <div class="panel">
              <div class="panel-h">Options</div>
              <div class="empty" x-show="!optionFields.length">This theme has no options of its own.</div>
              <template x-for="f in optionFields" :key="f.key">
                <div class="p-3 border-bottom">
                  <label class="form-label fw-semibold mb-1" :for="'cz_' + f.key" x-text="f.label"></label>
                  <template x-if="f.type === 'string'"><input :id="'cz_' + f.key" class="form-control" :class="{'is-invalid': errors[f.key]}" :value="values[f.key]" @input="set(f.key, $event.target.value)"></template>
                  <template x-if="f.type === 'text'"><textarea :id="'cz_' + f.key" rows="3" class="form-control" :value="values[f.key]" @input="set(f.key, $event.target.value)"></textarea></template>
                  <template x-if="f.type === 'number'"><input :id="'cz_' + f.key" type="number" class="form-control" style="max-width:10rem" :value="values[f.key]" :min="f.min" :max="f.max" @input="set(f.key, $event.target.value === '' ? '' : Number($event.target.value))"></template>
                  <template x-if="f.type === 'boolean'"><div class="form-check form-switch"><input :id="'cz_' + f.key" type="checkbox" class="form-check-input" role="switch" :checked="values[f.key]" @change="set(f.key, $event.target.checked)"><label class="form-check-label muted" :for="'cz_' + f.key" x-text="values[f.key] ? 'On' : 'Off'"></label></div></template>
                  <template x-if="f.type === 'select'"><select :id="'cz_' + f.key" class="form-select" @change="set(f.key, $event.target.value)"><template x-for="o in f.options" :key="o.value"><option :value="o.value" :selected="o.value === values[f.key]" x-text="o.label"></option></template></select></template>
                  <div class="form-text" x-show="f.help" x-text="f.help"></div>
                  <div class="invalid-feedback d-block" x-show="errors[f.key]" x-text="errors[f.key]"></div>
                </div>
              </template>
            </div>
            <div class="panel mt-3">
              <div class="panel-h">Custom CSS <span class="muted small fw-normal">Added after the theme’s styles on every page</span></div>
              <div class="p-3">
                <textarea id="cz-css" class="form-control mono" rows="14" spellcheck="false" aria-label="Custom CSS" x-codejar="{ mode: 'css', get: values.custom_css, set: (v) => set('custom_css', v), placeholder: ':root { --accent: #c0392b; }\n.site-header { border-bottom: 3px solid var(--accent); }' }"></textarea>
                <div class="invalid-feedback d-block" x-show="errors.custom_css" x-text="errors.custom_css"></div>
                <div class="form-text">Tip: themes keep colours and spacing in CSS variables (<span class="mono">--accent</span>, <span class="mono">--ink</span>, <span class="mono">--bg</span>…), so changing one restyles the whole site. Fonts and icon sets: install them under System → Libraries.</div>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3 align-items-center" x-show="can('themes.customize')">
              <button class="btn btn-primary" :disabled="saving || !dirty" @click="save()" x-text="saving ? 'Saving…' : 'Save changes'"></button>
              <button class="btn btn-outline-secondary" :disabled="!dirty" @click="discard()">Discard</button>
              <span class="muted small" x-show="dirty">Unsaved changes</span>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="panel">
              <div class="panel-h d-flex gap-2 align-items-center flex-wrap">
                <span>Preview</span>
                <input class="form-control form-control-sm mono" style="max-width:16rem" aria-label="Preview address" x-model="previewPath" @keydown.enter.prevent="refresh()">
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="refresh()">Show</button>
                <span class="muted small" x-show="previewing">Rendering…</span>
                <span class="text-danger small" x-show="previewError" x-text="previewError"></span>
              </div>
              <!-- allow-same-origin and nothing else: scripts, forms and popups stay off, but the frame keeps the site's origin, so
                   theme/library/media files (served with Cross-Origin-Resource-Policy: same-origin) load. An empty sandbox gives
                   the frame a "null" origin and the browser blocks every one of them, leaving the preview unstyled. -->
              <iframe title="Theme preview" style="width:100%;height:75vh;border:0;border-top:1px solid var(--line)" sandbox="allow-same-origin" :srcdoc="previewHtml"></iframe>
            </div>
          </div>
        </div>
      </section>
    </template>

    <!-- Theme editor (Appearance → Theme editor): the files of an installed theme; built-in themes are read-only -->
    <template x-if="route === 'theme-editor'">
      <section x-data="themeEditorPage">
        <div class="page-head d-flex justify-content-between align-items-end flex-wrap gap-2">
          <div><h1>Theme editor</h1><p>Edit a theme’s layouts, components, styles and wording. Every save is checked like an upload, so a mistake is refused instead of reaching visitors.</p></div>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <label class="small muted" for="te-theme">Theme</label>
            <select id="te-theme" class="form-select" style="max-width:14rem" @change="open($event.target.value)"><template x-for="t in themes" :key="t.id"><option :value="t.id" :selected="t.id === id" x-text="t.name + (t.source === 'disk' ? ' (built in)' : '')"></option></template></select>
            <a class="btn btn-outline-secondary" :href="'/api/admin/themes/' + id + '/export'" x-show="id">Export .zip</a>
          </div>
        </div>
        <div class="alert alert-danger" role="alert" x-show="error" x-text="error"></div>
        <div class="alert alert-warning d-flex gap-2 align-items-center flex-wrap" x-show="loaded && !editable">
          <span>Built-in themes ship read-only with the code, so an edit would be lost on the next update. Duplicate it to get a copy you can edit.</span>
