<script type="application/json" data-cms="meta">{"title":"Under construction banner","description":"A full-width hero for a site/page that isn't ready yet: illustration, heading, message, optional progress bar and ETA line.","props":{"heading":{"type":"string","label":"Heading","default":"We're building something new"},"text":{"type":"text","label":"Message","default":"Our site is currently under construction. We're working hard to bring you a great experience — check back soon!"},"image_url":{"type":"string","label":"Illustration URL"},"progress_percent":{"type":"number","label":"Progress percent (0-100)","default":65},"eta_label":{"type":"string","label":"ETA line","default":"Estimated launch: coming soon"}}}</script>
<style>
:host { display: block; }
.uc { background: linear-gradient(180deg, var(--soft, #f5f7f6) 0%, #eef2f6 100%); border-bottom: 1px solid var(--line, #dde3e1); }
.uc-inner { max-width: 44rem; margin: 0 auto; padding: 4rem 1.25rem 4.5rem; text-align: center; }
.uc-img { width: min(320px, 80%); height: auto; margin: 0 auto 1.75rem; display: block; }
h1 { font-size: clamp(1.8rem, 5vw, 2.75rem); line-height: 1.15; margin: 0 0 0.85rem; letter-spacing: -0.02em; }
.uc-inner p { font-size: 1.1rem; color: var(--muted, #5d7076); margin: 0 auto 1.5rem; max-width: 36rem; }
.uc-progress { width: 100%; max-width: 26rem; height: 10px; border-radius: 999px; background: #dde3e1; margin: 0 auto 0.5rem; overflow: hidden; }
.uc-bar { height: 100%; background: var(--accent, #2b59c3); border-radius: 999px; transition: width 0.3s ease; }
.uc-percent { font-size: 0.9rem; color: var(--muted, #5d7076); margin: 0 0 1.25rem; }
.uc-eta { font-weight: 600; color: var(--accent, #2b59c3); margin: 0; }
@media (max-width: 600px) { .uc-inner { padding: 3rem 1.25rem 3.5rem; } }
</style>
<section class="uc">
  <div class="uc-inner">
    {% if image_url != blank %}<img class="uc-img" src="{{ image_url }}" alt="Under construction illustration" />{% endif %}
    <h1>{{ heading | default: "We're building something new" }}</h1>
    {% if text != blank %}<p>{{ text }}</p>{% endif %}
    {% if progress_percent %}
    <div class="uc-progress"><div class="uc-bar" style="width: {{ progress_percent }}%;"></div></div>
    <p class="uc-percent">{{ progress_percent }}% complete</p>
    {% endif %}
    {% if eta_label != blank %}<p class="uc-eta">{{ eta_label }}</p>{% endif %}
  </div>
</section>
