<script type="application/json" data-cms="meta">
{ "title": "Contact form", "description": "Posts to /contact. Messages appear under Content → Messages; the form is off unless Settings → Site → Contact form is on." }
</script>
<style>
  :host { display: block; }
  form { max-width: 34rem; margin: 0 auto; padding: 1rem 1.25rem 2.5rem; display: grid; gap: 0.35rem; }
  input, textarea { font: inherit; padding: 0.55rem 0.75rem; border: 1px solid var(--line, #dde3e1); border-radius: 8px; background: var(--bg, #fff); color: inherit; }
  label { font-weight: 600; margin-top: 0.6rem; }
  button { margin-top: 1rem; font: inherit; padding: 0.65rem 1.2rem; border: 0; border-radius: 8px; background: var(--accent, #2b59c3); color: #fff; cursor: pointer; justify-self: start; }
  .notice { padding: 0.7rem 0.9rem; border-radius: 8px; margin: 0; }
  .ok { background: #e7f6ec; color: #17603a; } .bad { background: #fdecec; color: #8a1f1f; }
  .hp { position: absolute; left: -9999px; }
</style>
{% if contact.enabled %}
<form class="contact" method="post" action="/contact" id="contact">
  {% if contact.sent %}<p class="notice ok" role="status">{{ 'contact.sent' | t: 'Thanks. Your message has been sent.' }}</p>{% endif %}
  {% if contact.error != blank %}<p class="notice bad" role="alert">{{ contact.error }}</p>{% endif %}
  <label for="c-name">{{ 'contact.name' | t: 'Your name' }}</label>
  <input id="c-name" name="name" required maxlength="120" autocomplete="name">
  <label for="c-email">{{ 'contact.email' | t: 'Your email' }}</label>
  <input id="c-email" name="email" type="email" required maxlength="200" autocomplete="email">
  <label for="c-msg">{{ 'contact.message' | t: 'Message' }}</label>
  <textarea id="c-msg" name="message" rows="6" required maxlength="5000"></textarea>
  <div class="hp" aria-hidden="true"><label for="c-web">Leave this empty</label><input id="c-web" name="website" tabindex="-1" autocomplete="off"></div>
  <input type="hidden" name="t" value="{{ contact.token }}">
  <input type="hidden" name="back" value="{{ request.path }}">
  <button type="submit">{{ 'contact.send' | t: 'Send message' }}</button>
</form>
{% endif %}
