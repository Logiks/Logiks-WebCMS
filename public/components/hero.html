<script type="application/json" data-cms="meta">
{
  "title": "Hero banner",
  "description": "A large heading with a short line and an optional button.",
  "props": {
    "heading": { "type": "string", "label": "Heading", "default": "Welcome" },
    "text": { "type": "text", "label": "Text" },
    "button_label": { "type": "string", "label": "Button label" },
    "button_url": { "type": "string", "label": "Button link" }
  }
}
</script>
<style>
  :host { display: block; background: var(--soft, #f5f7f6); border-bottom: 1px solid var(--line, #dde3e1); }
  .inner { max-width: 68rem; margin: 0 auto; padding: 4.5rem 1.25rem; }
  h1 { font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.15; margin: 0 0 0.75rem; letter-spacing: -0.02em; }
  p { font-size: 1.2rem; color: var(--muted, #5d7076); max-width: 40rem; margin: 0 0 1.5rem; }
  a.button { display: inline-block; background: var(--accent, #2b59c3); color: #fff; padding: 0.7rem 1.3rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
  a.button:hover { filter: brightness(1.08); }
  @media (max-width: 600px) { .inner { padding: 3rem 1.25rem; } }
</style>
<section class="inner">
  <h1>{{ heading | default: "Welcome" }}</h1>
  {% if text != blank %}<p>{{ text }}</p>{% endif %}
  {% if button_label != blank %}<a class="button" href="{{ button_url | default: '/' }}">{{ button_label }}</a>{% endif %}
</section>
