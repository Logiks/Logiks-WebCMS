<script type="application/json" data-cms="meta">
{ "title": "Post card", "description": "One post in a list: image, title, date and excerpt.", "props": { "post": { "type": "string", "label": "The post (from the post API)" } } }
</script>
<style>
  :host { display: block; }
  article { border: 1px solid var(--line, #dde3e1); border-radius: 10px; overflow: hidden; background: var(--bg, #fff); height: 100%; }
  img { display: block; width: 100%; height: 11rem; object-fit: cover; }
  .body { padding: 1rem 1.15rem 1.25rem; }
  h3 { margin: 0 0 0.3rem; font-size: 1.15rem; line-height: 1.3; }
  h3 a { color: inherit; text-decoration: none; }
  h3 a:hover { color: var(--accent, #2b59c3); }
  .meta { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--muted, #5d7076); }
  p { margin: 0; }
</style>
<article>
  {% if post.featuredImage %}<a href="{{ post.url }}" tabindex="-1" aria-hidden="true"><img src="{{ post.featuredImage.src }}"{% if post.featuredImage.srcset != blank %} srcset="{{ post.featuredImage.srcset }}" sizes="(min-width: 800px) 360px, 100vw"{% endif %} alt="" loading="lazy"></a>{% endif %}
  <div class="body">
    <h3>{% if post.url %}<a href="{{ post.url }}">{{ post.title }}</a>{% else %}{{ post.title }}{% endif %}</h3>
    {% if settings.show_dates != false and post.publishedAt %}<p class="meta"><time datetime="{{ post.publishedAt }}">{{ post.publishedAt | date: '%-d %B %Y' }}</time></p>{% endif %}
    {% if post.excerpt != blank %}<p>{{ post.excerpt }}</p>{% endif %}
  </div>
</article>
