<!doctype html>
<html lang="{{ site.locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ seo.head }}
  <style>:root { --accent: {{ settings.accent_color | default: '#2b59c3' }}; }</style>
  {{ content_for_header }}
</head>
<body class="page-{{ page.url | handle | default: 'home' }}">
  <a class="skip" href="#main">{{ 'layout.skip' | t }}</a>
  {% render 'theme/header' %}
  <main id="main">
    {{ content_for_layout }}
  </main>
  {% render 'theme/footer' %}
  {{ content_for_footer }}
</body>
</html>
