<style>
  :host { display: block; background: #0b1020; border-bottom: 1px solid #1f2a44; }
  .bar { max-width: 68rem; margin: 0 auto; padding: 1.2rem 1.25rem; text-align: center; }
  .brand { display: inline-block; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #e8eeff; text-decoration: none; }
  nav { margin-top: 0.6rem; }
  ul { list-style: none; display: flex; justify-content: center; gap: 1.5rem; margin: 0; padding: 0; flex-wrap: wrap; }
  a.link { color: #9fb0d8; text-decoration: none; }
  a.link:hover, a.link[aria-current] { color: var(--accent, #7aa2ff); }
</style>
<header>
  <div class="bar">
    <a class="brand" href="/">{{ site.name }}</a>
    <nav aria-label="{{ 'layout.main_menu' | t }}">
      <ul>
        {% for item in menus.main %}
          <li><a class="link" href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
            {% if item.children.size > 0 %}<ul class="sub">{% for child in item.children %}<li><a class="link" href="{{ child.url }}"{% if child.active %} aria-current="page"{% endif %}>{{ child.label }}</a></li>{% endfor %}</ul>{% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
